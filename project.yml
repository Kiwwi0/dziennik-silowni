name: DziennikSilowni
options:
  bundleIdPrefix: pl.sansnom23
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: pl
targets:
  DziennikSilowni:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DziennikSilowni
      - path: Resources/img
        type: folder
        buildPhase: resources
      - path: Resources/exercises.json
        buildPhase: resources
    info:
      path: DziennikSilowni/Info.plist
      properties:
        CFBundleDisplayName: Dziennik siłowni
        CFBundleDevelopmentRegion: pl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.sansnom23.dzienniksilowni
        PRODUCT_NAME: DziennikSilowni
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
