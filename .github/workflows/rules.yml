name: Reguły bazy Firebase

# Zadanie „test” sprawdza reguły na emulatorze (testy-regul/) przy każdej zmianie firestore.rules, firebase.json,
# testy-regul/ i tego pliku – także w pull requestach i przy ręcznym uruchomieniu.
# Zadanie „deploy” wgrywa firestore.rules do projektu dziennik-silowni tylko po zielonym teście i tylko gdy push do main
# zmienił firestore.rules albo uruchomiono ręcznie (workflow_dispatch) na main; zadanie „zmiany” rozstrzyga to z listy plików pushu.
# Push zmieniający wyłącznie testy lub ten plik nie tworzy więc oczekującego wdrożenia (zadanie deploy jest pomijane).
# Wdrożenie czeka na zatwierdzenie w środowisku „produkcja” (Review deployments).
# Wymaga sekretu środowiska FIREBASE_SERVICE_ACCOUNT (cały plik JSON klucza osobnego konta serwisowego z rolą Firebase Rules Admin).
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'testy-regul/**'
      - '.github/workflows/rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'testy-regul/**'
      - '.github/workflows/rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Testy reguł na emulatorze Firestore. Bez środowiska i bez sekretów.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testy-regul/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Zainstaluj zależności testów
        working-directory: testy-regul
        run: npm ci
      - name: Testy reguł (emulator Firestore)
        working-directory: testy-regul
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-dziennik "npm test"

  # Czy ten push zmienił firestore.rules? Bez tego push samych testów utworzyłby oczekujące wdrożenie.
  zmiany:
    runs-on: ubuntu-latest
    outputs:
      reguly: ${{ steps.diff.outputs.reguly }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Czy zmieniono firestore.rules
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "reguly=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            if git diff --name-only "$BEFORE" "$SHA" -- firestore.rules > "$RUNNER_TEMP/zm.txt" 2>/dev/null; then
              if [ -s "$RUNNER_TEMP/zm.txt" ]; then r=true; else r=false; fi
            else
              r=true   # nie da się porównać (np. wymuszony push) – bezpieczniej zapytać o zatwierdzenie
            fi
            echo "reguly=$r" >> "$GITHUB_OUTPUT"
          else
            echo "reguly=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  deploy:
    needs: [test, zmiany]
    # Tylko push do main zmieniający firestore.rules albo ręczne uruchomienie na main; nigdy w pull requestach ani z innych gałęzi.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.zmiany.outputs.reguly == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: firestore-rules
      cancel-in-progress: false
    # Środowisko z wymaganym zatwierdzeniem; sekret FIREBASE_SERVICE_ACCOUNT pochodzi z tego środowiska.
    environment: produkcja
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sprawdź klucz
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Brak sekretu FIREBASE_SERVICE_ACCOUNT – dodaj go w Settings → Environments → produkcja → Environment secrets."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "Konto serwisowe: $(jq -r .client_email "$RUNNER_TEMP/sa.json")"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Wgraj reguły
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project dziennik-silowni --non-interactive
      - name: Usuń klucz z dysku
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
