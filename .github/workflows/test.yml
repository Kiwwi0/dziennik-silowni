name: Test strony

# Przy każdym pushu i pull requeście: buduje wersję testową i stronę, sprawdza, że web/ odpowiada źródłom,
# i uruchamia test dymny (testy/dymny/dymny.py) w Chromium i WebKit. Zielony znak = strona startuje,
# da się zrobić i zapisać trening oraz dodać wpis w diecie, a web/ jest zbudowane z aktualnych źródeł.
# Wdrożenie strony (pages.yml) rusza dopiero po zielonym wyniku tego workflow.
# Testy reguł Firestore to osobny workflow (rules.yml).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: testy/dymny/requirements.txt
      - name: Zainstaluj zależności (Playwright, Pillow)
        run: python3 -m pip install -r testy/dymny/requirements.txt
      - name: Zainstaluj przeglądarki Playwright (Chromium, WebKit)
        run: python3 -m playwright install --with-deps chromium webkit
      - name: Zbuduj wersję testową (zrodla/dist/index.html)
        run: python3 -I zrodla/build.py
      - name: Zbuduj stronę (web/)
        run: python3 -I zrodla/build_web.py .
      - name: Sprawdź, że web/ odpowiada źródłom
        run: |
          if ! git diff --exit-code --stat web/; then
            echo "::error::web/ nie odpowiada źródłom. Uruchom lokalnie: python3 -I zrodla/build_web.py . i zatwierdź zmiany w web/."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all web/)" ]; then
            git status --porcelain --untracked-files=all web/
            echo "::error::Budowanie utworzyło pliki spoza repozytorium w web/. Zatwierdź je albo usuń ze źródeł."
            exit 1
          fi
      - name: Test dymny (Chromium i WebKit)
        run: python3 testy/dymny/dymny.py --silniki chromium,webkit --zrzuty testy/dymny/zrzuty
      - name: Zrzuty ekranu z testu
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zrzuty-testu-dymnego
          path: testy/dymny/zrzuty/
          if-no-files-found: ignore
          retention-days: 14
