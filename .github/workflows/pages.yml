name: Strona siłownia

# Wdrożenie rusza dopiero po zielonym wyniku workflow „Test strony” (test.yml) dla pushu do main
# (workflow_run: nie trzeba dublować testów ani łączyć obu plików, a czerwony test po prostu nie uruchamia wdrożenia).
# Wdrażany jest dokładnie ten commit, który przeszedł testy (head_sha). Ręczne uruchomienie (workflow_dispatch) zostaje
# jak dawniej i omija testy (tylko z gałęzi main), więc używaj go tylko świadomie.
# Przed wdrożeniem pomijamy commit, który nie jest już końcówką main (starszy przebieg nie nadpisze nowszej strony).
on:
  workflow_run:
    workflows: ['Test strony']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # trwającego wdrożenia nie przerywamy; kolejne czeka w kolejce

jobs:
  deploy:
    # Po workflow_run: tylko po sukcesie testu i tylko dla pushu (nie pull requesta) do main.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sprawdź, czy ten commit to nadal końcówka main
        id: swiezy
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # git ls-remote nie wymaga checkoutu; przy błędzie sieci wdrożenie się nie uda (set -e), a nie przejdzie po cichu
          glowa=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ -z "$glowa" ]; then echo "::error::Nie udało się odczytać main przez git ls-remote."; exit 1; fi
          if [ "$glowa" = "$SHA" ]; then
            echo "swiezy=true" >> "$GITHUB_OUTPUT"
          else
            echo "swiezy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pomijam wdrożenie: $SHA nie jest już końcówką main ($glowa). Wdroży je nowszy przebieg."
          fi
      - if: steps.swiezy.outputs.swiezy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # po testach: dokładnie przetestowany commit; ręcznie: bieżący stan gałęzi
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.swiezy.outputs.swiezy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - if: steps.swiezy.outputs.swiezy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        if: steps.swiezy.outputs.swiezy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
