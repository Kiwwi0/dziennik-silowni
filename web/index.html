// m = {p:[…], s:[…]} – klucze mięśni albo grup (MUSCLE_GROUPS). Zwraca dwa rysunki: przód i tył.
function bodyMapFigs(m, heat){
  const ex = list => list.flatMap(k => MUSCLE_GROUPS[k] || [k]);
  const P = new Set(heat ? Object.keys(heat).filter(k => heat[k] === 'h-rec') : ex(m.p)), S = new Set(heat ? [] : ex(m.s).filter(k => !P.has(k)));
  const cls = heat ? (r => 'm' + (heat[r] ? ' ' + heat[r] : '')) : (r => P.has(r) ? 'm p1' : S.has(r) ? 'm p2' : 'm');
  const fig = view => {
    let base = '', hi = '', defs = '', over = '';
    const put = (r, el) => { if (P.has(r)) hi += el; else base += el; };
    BODYMAP[view].forEach(([r, d, sp], i) => {
      if (r === 'skin'){ base += `<path class="k" d="${d}"/>`; return; }
      if (!sp){ put(r, `<path class="${cls(r)}" d="${d}"/>`); return; }
      const sd = BODYMAP.split[sp], id = `bm${view[0]}${i}`;
      defs += `<clipPath id="${id}"><path d="${d}"/></clipPath>`;
      sd.parts.forEach(([r2, poly], j) => {
        defs += `<clipPath id="${id}_${j}"><polygon points="${poly.map(q => q.join(',')).join(' ')}"/></clipPath>`;
        put(r2, `<path class="${cls(r2)}" d="${d}" clip-path="url(#${id}_${j})"/>`);
      });
      over += `<g clip-path="url(#${id})">${sd.lines.map(l => `<line class="sp" x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}"/>`).join('')}</g>`;
    });
    return `<svg viewBox="${view === 'front' ? '40 150 646 1215' : '764 150 646 1215'}" aria-hidden="true"><defs>${defs}</defs><path class="ol" d="${BODYMAP.outline[view]}"/>${base}${hi}${over}</svg>`;
  };
  return `<span class="bm-figs"><span class="bm-fig">${fig('front')}<span class="bm-cap">Przód</span></span><span class="bm-fig">${fig('back')}<span class="bm-cap">Tył</span></span></span>`;
}
const muscleName = k => MUSCLE_GROUP_NAMES[k] || MUSCLE_NAMES[k] || k;
</script>
<script type="application/json" id="exdata">[{"id":"Barbell_Bench_Press_-_Medium_Grip","name":"Wyciskanie sztangi na ławce płaskiej","en":"Barbell Bench Press - Medium Grip","group":"Klatka piersiowa","mode":"reps","equipment":"Sztanga","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Połóż się na ławce tak, aby oczy były mniej więcej pod sztangą. Stopy oprzyj stabilnie na podłodze.","Ściągnij łopatki do siebie i w dół, lekko wygnij odcinek piersiowy. Pośladki, łopatki i głowa cały czas dotykają ławki.","Chwyć sztangę nachwytem nieco szerzej niż barki, zdejmij ją ze stojaków i ustaw nad barkami na wyprostowanych rękach.","Na wdechu opuszczaj sztangę w kontrolowany sposób do dolnej części klatki, z łokciami ustawionymi ok. 45–70° od tułowia.","Po lekkim dotknięciu klatki wypchnij sztangę z wydechem z powrotem do góry."],"tips":["Nie odbijaj sztangi od klatki i nie odrywaj pośladków od ławki.","Nadgarstki trzymaj prosto, sztanga leży nad przedramionami.","Przy ciężkich seriach ćwicz z asekuracją."]},{"id":"Barbell_Incline_Bench_Press_-_Medium_Grip","name":"Wyciskanie sztangi na ławce skośnej","en":"Barbell Incline Bench Press - Medium Grip","group":"Klatka piersiowa","mode":"reps","equipment":"Sztanga","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Ustaw ławkę pod kątem ok. 30–45°. Usiądź, oprzyj plecy i ściągnij łopatki.","Chwyć sztangę nachwytem nieco szerzej niż barki i zdejmij ją ze stojaków nad górną część klatki.","Opuszczaj sztangę powoli do górnej części klatki, tuż pod obojczykami.","Wypchnij sztangę pionowo w górę, prawie do pełnego wyprostu łokci."],"tips":["Zbyt stromy kąt ławki przenosi pracę na barki.","Nie odrywaj pleców od oparcia i nie unoś barków do uszu."]},{"id":"Decline_Barbell_Bench_Press","name":"Wyciskanie sztangi na ławce skośnej głową w dół","en":"Decline Barbell Bench Press","group":"Klatka piersiowa","mode":"reps","equipment":"Sztanga","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Zablokuj nogi pod wałkami ławki ustawionej głową w dół i połóż się, ściągając łopatki.","Chwyć sztangę nachwytem nieco szerzej niż barki i zdejmij ją ze stojaków, najlepiej z pomocą partnera.","Opuszczaj sztangę do dolnej części klatki.","Wypchnij ją z powrotem do wyprostu rąk."],"tips":["Ćwicz z asekuracją, bo w tej pozycji trudniej bezpiecznie odłożyć sztangę.","Kontroluj ruch w dół i nie odbijaj sztangi."]},{"id":"Dumbbell_Bench_Press","name":"Wyciskanie hantli na ławce płaskiej","en":"Dumbbell Bench Press","group":"Klatka piersiowa","mode":"reps","equipment":"Hantle","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Usiądź na końcu ławki z hantlami opartymi na udach, potem połóż się, przenosząc hantle nad klatkę.","Ściągnij łopatki, stopy oprzyj na podłodze. Hantle trzymaj nachwytem na wysokości klatki.","Wypchnij hantle w górę, zbliżając je do siebie nad klatką.","Opuszczaj je powoli do poziomu klatki, czując rozciągnięcie mięśni piersiowych."],"tips":["Hantle dają większy zakres ruchu niż sztanga, ale nie opuszczaj ich niżej, niż pozwalają barki.","Po serii odłóż hantle na uda, zamiast upuszczać je na boki."]},{"id":"Incline_Dumbbell_Press","name":"Wyciskanie hantli na ławce skośnej","en":"Incline Dumbbell Press","group":"Klatka piersiowa","mode":"reps","equipment":"Hantle","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Ustaw ławkę pod kątem 30–45°, usiądź z hantlami na udach i połóż się, przenosząc je na wysokość barków.","Ściągnij łopatki, nadgarstki trzymaj prosto nad łokciami.","Wypchnij hantle w górę i lekko do środka, aż ręce będą prawie proste.","Opuszczaj je powoli do poziomu górnej części klatki."],"tips":["Nie stukaj hantlami o siebie na górze, żeby nie tracić napięcia mięśni.","Łokcie nie powinny uciekać daleko na boki."]},{"id":"Dumbbell_Flyes","name":"Rozpiętki z hantlami na ławce płaskiej","en":"Dumbbell Flyes","group":"Klatka piersiowa","mode":"reps","equipment":"Hantle","primary":["klatka piersiowa"],"secondary":[],"level":"początkujący","steps":["Połóż się na ławce z hantlami nad klatką, dłonie zwrócone do siebie, łokcie lekko ugięte.","Na wdechu opuszczaj hantle szerokim łukiem na boki, aż poczujesz rozciągnięcie klatki.","Zatrzymaj ruch na wysokości klatki i tym samym łukiem unieś hantle z powrotem, jakbyś obejmował beczkę."],"tips":["Kąt w łokciach pozostaje stały przez cały ruch. To nie jest wyciskanie.","Używaj mniejszego ciężaru niż przy wyciskaniu i nie opuszczaj rąk za nisko."]},{"id":"Incline_Dumbbell_Flyes","name":"Rozpiętki z hantlami na ławce skośnej","en":"Incline Dumbbell Flyes","group":"Klatka piersiowa","mode":"reps","equipment":"Hantle","primary":["klatka piersiowa"],"secondary":["barki"],"level":"początkujący","steps":["Ustaw ławkę pod kątem ok. 30°, połóż się z hantlami nad górną częścią klatki, dłonie zwrócone do siebie.","Z lekko ugiętymi łokciami opuszczaj hantle łukiem na boki do poziomu barków.","Wróć tym samym łukiem do góry, napinając klatkę."],"tips":["Ruch kontrolowany, bez szarpania na dole.","Nie prostuj całkowicie łokci."]},{"id":"Cable_Crossover","name":"Krzyżowanie linek wyciągu (brama)","en":"Cable Crossover","group":"Klatka piersiowa","mode":"reps","equipment":"Wyciąg","primary":["klatka piersiowa"],"secondary":["barki"],"level":"początkujący","steps":["Ustaw wyciągi w górnej pozycji, chwyć uchwyty i zrób krok do przodu, stając w lekkim wykroku. Pochyl tułów nieco do przodu.","Ramiona rozłożone na boki, łokcie lekko ugięte.","Sprowadź dłonie łukiem przed siebie i w dół, aż spotkają się przed biodrami.","Zatrzymaj na chwilę, napinając klatkę, i powoli wróć do rozłożenia ramion."],"tips":["Nie zamieniaj ruchu w wyciskanie, łokcie mają stały kąt.","Wyciągi ustawione nisko akcentują górną część klatki, wysoko dolną."]},{"id":"Butterfly","name":"Rozpiętki na maszynie (butterfly)","en":"Butterfly","group":"Klatka piersiowa","mode":"reps","equipment":"Maszyna","primary":["klatka piersiowa"],"secondary":[],"level":"początkujący","steps":["Ustaw siedzisko tak, aby uchwyty były na wysokości klatki. Usiądź, plecy przy oparciu.","Chwyć uchwyty (lub oprzyj przedramiona o poduszki) z lekko ugiętymi łokciami.","Sprowadź ramiona przed siebie, aż uchwyty prawie się zetkną, i na chwilę napnij klatkę.","Powoli wróć do pozycji wyjściowej."],"tips":["Nie odrywaj pleców od oparcia.","Nie pozwól, by ciężar szarpał ramionami do tyłu."]},{"id":"Machine_Bench_Press","name":"Wyciskanie na maszynie siedząc","en":"Machine Bench Press","group":"Klatka piersiowa","mode":"reps","equipment":"Maszyna","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Ustaw siedzisko tak, aby uchwyty były na wysokości środka klatki. Usiądź, plecy przy oparciu, łopatki ściągnięte.","Chwyć uchwyty nachwytem.","Wypchnij uchwyty przed siebie, prawie do pełnego wyprostu łokci.","Powoli wróć, nie odkładając ciężaru całkowicie na stos."],"tips":["Dobre ćwiczenie do bezpiecznej pracy aż do upadku mięśniowego.","Nie wysuwaj barków do przodu na końcu ruchu."]},{"id":"Pushups","name":"Pompki","en":"Pushups","group":"Klatka piersiowa","mode":"reps","equipment":"Masa ciała","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"początkujący","steps":["Oprzyj dłonie o podłogę nieco szerzej niż barki, nogi wyprostowane, ciało w jednej linii od głowy do pięt.","Napnij brzuch i pośladki.","Opuszczaj ciało, uginając łokcie, aż klatka znajdzie się tuż nad podłogą.","Wypchnij się z powrotem do wyprostu rąk."],"tips":["Biodra nie mogą opadać ani wędrować w górę.","Łokcie prowadź ok. 45° od tułowia, nie na boki.","Za trudne? Rób pompki z dłońmi opartymi o ławkę."]},{"id":"Dips_-_Chest_Version","name":"Pompki na poręczach (wersja na klatkę)","en":"Dips - Chest Version","group":"Klatka piersiowa","mode":"reps","equipment":"Masa ciała","primary":["klatka piersiowa"],"secondary":["barki","triceps"],"level":"średni","steps":["Wejdź na poręcze i ustaw się w podporze na prostych rękach.","Pochyl tułów do przodu ok. 30°, łokcie lekko na zewnątrz.","Opuszczaj się, aż poczujesz rozciągnięcie klatki (ramiona mniej więcej równolegle do podłogi).","Wypchnij się z powrotem do góry."],"tips":["Nie schodź za nisko, jeśli czujesz dyskomfort w barkach.","Gdy masa ciała to za mało, dodaj obciążenie na pasie."]},{"id":"Straight-Arm_Dumbbell_Pullover","name":"Przenoszenie hantla za głowę (pullover)","en":"Straight-Arm Dumbbell Pullover","group":"Klatka piersiowa","mode":"reps","equipment":"Hantle","primary":["klatka piersiowa"],"secondary":["najszerszy grzbietu","barki","triceps"],"level":"średni","steps":["Połóż się w poprzek ławki, opierając na niej tylko łopatki. Biodra nisko, stopy na podłodze.","Chwyć hantel oburącz pod talerzem i trzymaj go nad klatką na prawie prostych rękach.","Opuszczaj hantel łukiem za głowę, aż poczujesz rozciągnięcie klatki i boków pleców.","Wróć tym samym łukiem nad klatkę."],"tips":["Łokcie lekko ugięte i nieruchome.","Trzymaj stabilną pozycję bioder przez całą serię."]},{"id":"Pullups","name":"Podciąganie na drążku nachwytem","en":"Pullups","group":"Plecy","mode":"reps","equipment":"Masa ciała","primary":["najszerszy grzbietu"],"secondary":["biceps","środek pleców"],"level":"początkujący","steps":["Chwyć drążek nachwytem szerzej niż barki i zawiśnij na prostych rękach.","Ściągnij łopatki w dół i lekko wypchnij klatkę.","Podciągnij się, prowadząc łokcie w dół do boków, aż broda znajdzie się nad drążkiem.","Opuść się powoli do pełnego zwisu."],"tips":["Bez bujania i wymachów nóg.","Kontroluj także fazę opuszczania.","Za trudne? Użyj gumy albo maszyny wspomagającej."]},{"id":"Chin-Up","name":"Podciąganie na drążku podchwytem","en":"Chin-Up","group":"Plecy","mode":"reps","equipment":"Masa ciała","primary":["najszerszy grzbietu"],"secondary":["biceps","przedramiona","środek pleców"],"level":"początkujący","steps":["Chwyć drążek podchwytem na szerokość barków i zawiśnij.","Napnij brzuch i ściągnij łopatki.","Podciągnij się, aż broda znajdzie się nad drążkiem, prowadząc łokcie blisko tułowia.","Opuść się powoli do wyprostu rąk."],"tips":["Ten wariant mocniej angażuje bicepsy niż podciąganie nachwytem.","Pełny zakres ruchu w każdym powtórzeniu."]},{"id":"Band_Assisted_Pull-Up","name":"Podciąganie z gumą","en":"Band Assisted Pull-Up","group":"Plecy","mode":"reps","equipment":"Guma","primary":["najszerszy grzbietu"],"secondary":["brzuch","przedramiona","środek pleców"],"level":"początkujący","steps":["Zaczep gumę oporową o drążek i włóż w nią kolano lub stopę.","Chwyć drążek nachwytem i zawiśnij na prostych rękach.","Podciągnij się, aż broda znajdzie się nad drążkiem.","Opuść się powoli, kontrolując ruch."],"tips":["Im grubsza guma, tym większa pomoc. Zmniejszaj ją wraz z postępami.","Kolor gumy możesz zapisać w notatce ćwiczenia w planie."]},{"id":"Wide-Grip_Lat_Pulldown","name":"Ściąganie drążka wyciągu górnego szerokim chwytem","en":"Wide-Grip Lat Pulldown","group":"Plecy","mode":"reps","equipment":"Wyciąg","primary":["najszerszy grzbietu"],"secondary":["biceps","środek pleców","barki"],"level":"początkujący","steps":["Usiądź przy wyciągu i zablokuj uda pod wałkami.","Chwyć drążek nachwytem wyraźnie szerzej niż barki.","Lekko odchyl tułów do tyłu, wypnij klatkę i ściągnij łopatki w dół.","Ściągnij drążek do górnej części klatki, prowadząc łokcie w dół i do tyłu.","Powoli oddaj drążek do góry, do pełnego wyprostu rąk."],"tips":["Nie odchylaj się mocno do tyłu i nie ciągnij tułowiem.","Nie ściągaj drążka za głowę."]},{"id":"V-Bar_Pulldown","name":"Ściąganie wyciągu górnego wąskim uchwytem","en":"V-Bar Pulldown","group":"Plecy","mode":"reps","equipment":"Wyciąg","primary":["najszerszy grzbietu"],"secondary":["biceps","środek pleców","barki"],"level":"średni","steps":["Załóż uchwyt V na wyciąg górny i usiądź, blokując uda pod wałkami.","Chwyć uchwyt chwytem neutralnym (dłonie zwrócone do siebie) i lekko odchyl się do tyłu.","Ściągnij uchwyt do górnej części klatki, ściągając łopatki.","Powoli wróć do wyprostu rąk."],"tips":["Klatka idzie na spotkanie uchwytu, barki zostają nisko.","Kontroluj fazę powrotu."]},{"id":"Straight-Arm_Pulldown","name":"Ściąganie wyciągu prostymi rękami","en":"Straight-Arm Pulldown","group":"Plecy","mode":"reps","equipment":"Wyciąg","primary":["najszerszy grzbietu"],"secondary":[],"level":"początkujący","steps":["Stań przed wyciągiem górnym z prostym drążkiem lub liną i chwyć go nachwytem na szerokość barków.","Pochyl lekko tułów, ręce prawie proste przed sobą na wysokości głowy.","Sprowadź drążek łukiem w dół do ud, napinając mięśnie najszersze grzbietu.","Powoli wróć do góry."],"tips":["Łokcie lekko ugięte, ale nieruchome.","Ruch odbywa się w stawach barkowych, nie w łokciach."]},{"id":"Bent_Over_Barbell_Row","name":"Wiosłowanie sztangą w opadzie tułowia","en":"Bent Over Barbell Row","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["środek pleców"],"secondary":["biceps","najszerszy grzbietu","barki"],"level":"początkujący","steps":["Stań ze sztangą trzymaną nachwytem nieco szerzej niż barki. Ugnij lekko kolana.","Pochyl tułów do przodu (ok. 45° lub niżej), utrzymując proste plecy. Sztanga wisi na prostych rękach.","Przyciągnij sztangę do dolnej części brzucha, prowadząc łokcie blisko tułowia i ściągając łopatki.","Opuść sztangę powoli do wyprostu rąk."],"tips":["Plecy cały czas proste, nie zaokrąglaj odcinka lędźwiowego.","Nie prostuj tułowia, żeby „wrzucić” ciężar."]},{"id":"Reverse_Grip_Bent-Over_Rows","name":"Wiosłowanie sztangą podchwytem","en":"Reverse Grip Bent-Over Rows","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["środek pleców"],"secondary":["biceps","najszerszy grzbietu","barki"],"level":"średni","steps":["Chwyć sztangę podchwytem na szerokość barków, ugnij lekko kolana i pochyl tułów do przodu z prostymi plecami.","Przyciągnij sztangę do brzucha, prowadząc łokcie blisko ciała.","Na górze ściśnij łopatki, a potem powoli opuść sztangę."],"tips":["Podchwyt mocniej angażuje bicepsy i dolną część najszerszego grzbietu.","Tułów nieruchomy przez całą serię."]},{"id":"One-Arm_Dumbbell_Row","name":"Wiosłowanie hantlem jednorącz","en":"One-Arm Dumbbell Row","group":"Plecy","mode":"reps","equipment":"Hantle","primary":["środek pleców"],"secondary":["biceps","najszerszy grzbietu","barki"],"level":"początkujący","steps":["Oprzyj kolano i dłoń tej samej strony o ławkę, drugą stopę postaw na podłodze. Plecy proste, równoległe do podłogi.","W wolnej ręce trzymaj hantel na wyprostowanym ramieniu.","Przyciągnij hantel do biodra, prowadząc łokieć blisko tułowia.","Powoli opuść hantel do pełnego wyprostu. Po serii zmień stronę."],"tips":["Nie skręcaj tułowia przy podciąganiu hantla.","Myśl o ciągnięciu łokciem, a nie dłonią."]},{"id":"Seated_Cable_Rows","name":"Przyciąganie linki wyciągu dolnego siedząc","en":"Seated Cable Rows","group":"Plecy","mode":"reps","equipment":"Wyciąg","primary":["środek pleców"],"secondary":["biceps","najszerszy grzbietu","barki"],"level":"początkujący","steps":["Usiądź przy wyciągu dolnym, oprzyj stopy o podest i lekko ugnij kolana. Chwyć uchwyt V.","Wyprostuj plecy, tułów prawie pionowo, ręce wyprostowane przed sobą.","Przyciągnij uchwyt do brzucha, ściągając łopatki i prowadząc łokcie blisko ciała.","Powoli oddaj uchwyt do przodu, pozwalając łopatkom się rozsunąć."],"tips":["Nie bujaj tułowiem w przód i w tył.","Barki trzymaj nisko, z dala od uszu."]},{"id":"T-Bar_Row_with_Handle","name":"Wiosłowanie sztangą T (T-bar)","en":"T-Bar Row with Handle","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["środek pleców"],"secondary":["biceps","najszerszy grzbietu"],"level":"początkujący","steps":["Stań okrakiem nad sztangą zablokowaną jednym końcem (lub na maszynie T-bar) i załóż uchwyt pod talerzami.","Ugnij kolana, pochyl tułów z prostymi plecami i chwyć uchwyt oburącz.","Przyciągnij ciężar do dolnej części klatki, ściągając łopatki.","Opuść go powoli do wyprostu rąk."],"tips":["Plecy proste, głowa w przedłużeniu tułowia.","Nie podrywaj ciężaru biodrami."]},{"id":"Lying_T-Bar_Row","name":"Wiosłowanie sztangą T z podparciem klatki","en":"Lying T-Bar Row","group":"Plecy","mode":"reps","equipment":"Maszyna","primary":["środek pleców"],"secondary":["biceps","najszerszy grzbietu"],"level":"średni","steps":["Ustaw podest tak, aby po oparciu klatki o poduszkę ręce swobodnie sięgały uchwytów. Stań na podeście i połóż się klatką i brzuchem na poduszce.","Chwyć uchwyty (szeroko nachwytem albo wąsko chwytem neutralnym) i zdejmij ciężar z blokady, prostując ręce.","Przyciągnij uchwyty do tułowia, prowadząc łokcie wzdłuż ciała i ściągając łopatki.","Opuść ciężar powoli do pełnego wyprostu rąk, czując rozciągnięcie pleców."],"tips":["Klatka cały czas przy poduszce. Nie odrywaj jej, żeby pomóc sobie tułowiem.","Głowa w przedłużeniu tułowia, nie zadzieraj jej do góry."]},{"id":"Leverage_Iso_Row","name":"Wiosłowanie na maszynie","en":"Leverage Iso Row","group":"Plecy","mode":"reps","equipment":"Maszyna","primary":["najszerszy grzbietu"],"secondary":["biceps","środek pleców"],"level":"początkujący","steps":["Ustaw siedzisko tak, aby uchwyty były na wysokości klatki, i oprzyj klatkę o poduszkę.","Chwyć uchwyty chwytem neutralnym lub nachwytem.","Przyciągnij uchwyty do tułowia, ściągając łopatki.","Powoli wróć, nie odkładając ciężaru całkowicie."],"tips":["Klatka cały czas przy poduszce.","Na końcu ruchu zatrzymaj się na sekundę."]},{"id":"Inverted_Row","name":"Podciąganie australijskie","en":"Inverted Row","group":"Plecy","mode":"reps","equipment":"Masa ciała","primary":["środek pleców"],"secondary":["najszerszy grzbietu"],"level":"początkujący","steps":["Ustaw drążek (np. w suwnicy Smitha) na wysokości pasa. Połóż się pod nim i chwyć go nachwytem szerzej niż barki.","Wyprostuj ciało w jednej linii, pięty oparte o podłogę.","Podciągnij klatkę do drążka, ściągając łopatki.","Opuść się powoli do wyprostu rąk."],"tips":["Biodra nie mogą opadać.","Im bardziej poziomo leży ciało, tym trudniej."]},{"id":"Dumbbell_Incline_Row","name":"Wiosłowanie hantlami w leżeniu na ławce skośnej","en":"Dumbbell Incline Row","group":"Plecy","mode":"reps","equipment":"Hantle","primary":["środek pleców"],"secondary":["biceps","przedramiona","najszerszy grzbietu","barki"],"level":"początkujący","steps":["Ustaw ławkę pod kątem 30–45° i połóż się na niej przodem, z hantlami w dłoniach.","Ręce zwisają prosto w dół, dłonie zwrócone do siebie.","Przyciągnij hantle do boków tułowia, ściągając łopatki.","Opuść je powoli do wyprostu."],"tips":["Klatka cały czas oparta o ławkę, co odciąża dolny odcinek pleców.","Nie unoś barków do uszu."]},{"id":"Barbell_Deadlift","name":"Martwy ciąg klasyczny","en":"Barbell Deadlift","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["prostowniki grzbietu"],"secondary":["łydki","przedramiona","pośladki","dwugłowe uda","najszerszy grzbietu","środek pleców","czworogłowe uda","kaptury"],"level":"średni","steps":["Stań ze stopami na szerokość bioder, sztanga nad środkiem stopy, blisko piszczeli.","Zegnij biodra i kolana i chwyć sztangę nachwytem tuż za kolanami. Plecy proste, klatka do przodu, barki nad sztangą.","Weź wdech, napnij brzuch i plecy, odepchnij podłogę nogami i podnoś sztangę blisko nóg, prostując jednocześnie kolana i biodra.","Na górze stań prosto, bez odchylania się do tyłu.","Opuść sztangę kontrolowanie: najpierw cofnij biodra, potem ugnij kolana."],"tips":["Najczęstszy błąd to zaokrąglanie pleców. Lepiej mniejszy ciężar z dobrą techniką.","Sztanga przez cały czas blisko ciała.","Przed każdym powtórzeniem weź wdech i napnij brzuch."]},{"id":"Sumo_Deadlift","name":"Martwy ciąg sumo","en":"Sumo Deadlift","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["dwugłowe uda"],"secondary":["przywodziciele","przedramiona","pośladki","prostowniki grzbietu","środek pleców","czworogłowe uda","kaptury"],"level":"średni","steps":["Stań w szerokim rozkroku, palce stóp skierowane na zewnątrz, sztanga blisko piszczeli.","Zejdź w dół z wyprostowanymi plecami i chwyć sztangę wąsko, między nogami.","Rozpychaj kolana na zewnątrz, napnij plecy i podnoś sztangę, prostując nogi i biodra.","Opuść sztangę kontrolowanie."],"tips":["Tułów jest bardziej pionowy niż w martwym ciągu klasycznym.","Kolana podążają w kierunku palców stóp."]},{"id":"Trap_Bar_Deadlift","name":"Martwy ciąg z trap barem","en":"Trap Bar Deadlift","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["czworogłowe uda"],"secondary":["pośladki","dwugłowe uda"],"level":"początkujący","steps":["Wejdź do środka sztangi heksagonalnej (trap bar), stopy na szerokość bioder.","Zegnij biodra i kolana i chwyć uchwyty po bokach.","Napnij plecy i brzuch, wstań, prostując jednocześnie kolana i biodra.","Opuść ciężar kontrolowanie."],"tips":["Łatwiejszy technicznie i łagodniejszy dla pleców niż martwy ciąg klasyczny.","Plecy proste, wzrok przed siebie."]},{"id":"Hyperextensions_Back_Extensions","name":"Wyprosty tułowia na ławce rzymskiej","en":"Hyperextensions (Back Extensions)","group":"Plecy","mode":"reps","equipment":"Maszyna","primary":["prostowniki grzbietu"],"secondary":["pośladki","dwugłowe uda"],"level":"początkujący","steps":["Ustaw się na ławce rzymskiej tak, aby biodra opierały się o poduszkę, a pięty były zablokowane.","Skrzyżuj ręce na klatce lub trzymaj je przy głowie. Ciało w jednej linii.","Opuść tułów, zginając się w biodrach, z prostymi plecami.","Unieś tułów z powrotem do linii z nogami."],"tips":["Nie przeprostowuj pleców na górze.","Talerz trzymany przy klatce zwiększa obciążenie."]},{"id":"Barbell_Shrug","name":"Szrugsy ze sztangą","en":"Barbell Shrug","group":"Plecy","mode":"reps","equipment":"Sztanga","primary":["kaptury"],"secondary":[],"level":"początkujący","steps":["Stań prosto, trzymając sztangę nachwytem na szerokość barków przed udami.","Unieś barki jak najwyżej w stronę uszu, ręce proste.","Zatrzymaj się na sekundę na górze.","Powoli opuść barki."],"tips":["Nie kręć barkami w kółko. Ruch tylko w górę i w dół.","Nie uginaj łokci."]},{"id":"Dumbbell_Shrug","name":"Szrugsy z hantlami","en":"Dumbbell Shrug","group":"Plecy","mode":"reps","equipment":"Hantle","primary":["kaptury"],"secondary":[],"level":"początkujący","steps":["Stań prosto z hantlami po bokach tułowia, dłonie zwrócone do ciała.","Unieś barki jak najwyżej w stronę uszu.","Zatrzymaj na chwilę i powoli opuść."],"tips":["Ręce pozostają proste.","Głowa w neutralnej pozycji, nie wysuwaj jej do przodu."]},{"id":"Standing_Military_Press","name":"Wyciskanie sztangi nad głowę stojąc (OHP)","en":"Standing Military Press","group":"Barki","mode":"reps","equipment":"Sztanga","primary":["barki"],"secondary":["triceps"],"level":"początkujący","steps":["Ustaw sztangę na stojakach na wysokości klatki. Chwyć ją nachwytem nieco szerzej niż barki i zdejmij, opierając na przedniej części barków.","Stopy na szerokość bioder, napnij brzuch i pośladki.","Wypchnij sztangę pionowo nad głowę, odsuwając głowę lekko do tyłu, żeby zrobić jej miejsce.","Na górze sztanga jest nad środkiem stopy, łokcie proste. Opuść ją kontrolowanie na barki."],"tips":["Nie wyginaj mocno lędźwi, trzymaj tułów napięty.","Nie pomagaj sobie nogami."]},{"id":"Seated_Dumbbell_Press","name":"Wyciskanie hantli nad głowę siedząc","en":"Seated Dumbbell Press","group":"Barki","mode":"reps","equipment":"Hantle","primary":["barki"],"secondary":["triceps"],"level":"początkujący","steps":["Usiądź na ławce z oparciem ustawionym pionowo. Unieś hantle na wysokość barków, dłonie zwrócone do przodu.","Wypchnij hantle nad głowę, aż ręce będą prawie proste.","Opuść je powoli do wysokości barków."],"tips":["Plecy przy oparciu, bez wyginania lędźwi.","Nie stukaj hantlami nad głową."]},{"id":"Arnold_Dumbbell_Press","name":"Wyciskanie Arnolda","en":"Arnold Dumbbell Press","group":"Barki","mode":"reps","equipment":"Hantle","primary":["barki"],"secondary":["triceps"],"level":"średni","steps":["Usiądź z hantlami przed barkami, dłonie zwrócone do siebie.","Wypychając hantle w górę, obracaj dłonie tak, aby na górze były zwrócone do przodu.","Opuszczaj hantle, wykonując obrót w odwrotnym kierunku."],"tips":["Ruch płynny, bez szarpania.","Używaj mniejszego ciężaru niż przy zwykłym wyciskaniu."]},{"id":"Machine_Shoulder_Military_Press","name":"Wyciskanie nad głowę na maszynie","en":"Machine Shoulder (Military) Press","group":"Barki","mode":"reps","equipment":"Maszyna","primary":["barki"],"secondary":["triceps"],"level":"początkujący","steps":["Ustaw siedzisko tak, aby uchwyty były na wysokości barków. Usiądź, plecy przy oparciu.","Chwyć uchwyty nachwytem.","Wypchnij je w górę, prawie do pełnego wyprostu łokci.","Opuść powoli do wysokości barków."],"tips":["Nie odrywaj pleców od oparcia.","Dobra alternatywa dla wyciskania wolnym ciężarem na początek."]},{"id":"Side_Lateral_Raise","name":"Unoszenie hantli bokiem","en":"Side Lateral Raise","group":"Barki","mode":"reps","equipment":"Hantle","primary":["barki"],"secondary":[],"level":"początkujący","steps":["Stań prosto z hantlami po bokach ciała, łokcie lekko ugięte.","Unieś hantle bokiem do wysokości barków, prowadząc ruch łokciami.","Zatrzymaj na chwilę i powoli opuść."],"tips":["Nie bujaj tułowiem i nie podrzucaj hantli.","Nie unoś rąk wyżej niż barki i nie podciągaj barków do uszu.","Najlepiej działa lekki ciężar i więcej powtórzeń."]},{"id":"Standing_Low-Pulley_Deltoid_Raise","name":"Unoszenie ramienia bokiem na wyciągu dolnym","en":"Standing Low-Pulley Deltoid Raise","group":"Barki","mode":"reps","equipment":"Wyciąg","primary":["barki"],"secondary":["przedramiona"],"level":"początkujący","steps":["Stań bokiem do wyciągu dolnego i chwyć uchwyt ręką dalszą od wyciągu. Drugą ręką przytrzymaj się konstrukcji.","Ręka z uchwytem przed ciałem, łokieć lekko ugięty.","Unieś ramię bokiem do wysokości barku.","Powoli opuść. Po serii zmień stronę."],"tips":["Wyciąg utrzymuje napięcie także na dole ruchu, czego brakuje przy hantlach.","Tułów nieruchomy."]},{"id":"Front_Dumbbell_Raise","name":"Unoszenie hantli przodem","en":"Front Dumbbell Raise","group":"Barki","mode":"reps","equipment":"Hantle","primary":["barki"],"secondary":[],"level":"początkujący","steps":["Stań prosto z hantlami przed udami, dłonie zwrócone do ciała.","Unieś jedną lub obie hantle przed sobą do wysokości oczu, z lekko ugiętymi łokciami.","Powoli opuść."],"tips":["Bez bujania tułowiem.","Przednia część barków mocno pracuje też przy wyciskaniach, więc to ćwiczenie nie zawsze jest potrzebne."]},{"id":"Reverse_Flyes","name":"Odwrotne rozpiętki z hantlami w opadzie","en":"Reverse Flyes","group":"Barki","mode":"reps","equipment":"Hantle","primary":["barki"],"secondary":[],"level":"początkujący","steps":["Pochyl tułów do przodu prawie do poziomu (albo połóż się przodem na ławce skośnej). Hantle zwisają pod klatką.","Z lekko ugiętymi łokciami unieś hantle łukiem na boki do wysokości barków.","Zatrzymaj na chwilę i powoli opuść."],"tips":["Pracuje tylna część barków, więc nie ściągaj mocno łopatek.","Lekki ciężar, pełna kontrola."]},{"id":"Reverse_Machine_Flyes","name":"Odwrotne rozpiętki na maszynie","en":"Reverse Machine Flyes","group":"Barki","mode":"reps","equipment":"Maszyna","primary":["barki"],"secondary":[],"level":"początkujący","steps":["Usiądź na maszynie butterfly przodem do oparcia. Ustaw uchwyty w tylnej pozycji.","Chwyć uchwyty na prostych rękach przed sobą.","Rozłóż ręce łukiem na boki i do tyłu, aż będą w linii z barkami.","Powoli wróć do przodu."],"tips":["Łokcie lekko ugięte i nieruchome.","Klatka przy oparciu przez całą serię."]},{"id":"Face_Pull","name":"Przyciąganie liny do twarzy (face pull)","en":"Face Pull","group":"Barki","mode":"reps","equipment":"Wyciąg","primary":["barki"],"secondary":["środek pleców"],"level":"średni","steps":["Załóż linę na wyciąg ustawiony na wysokości twarzy lub nieco wyżej. Chwyć końce liny nachwytem.","Cofnij się o krok, aby ręce były wyprostowane przed sobą.","Przyciągnij linę w stronę twarzy, rozciągając jej końce na boki i prowadząc łokcie wysoko.","Na końcu ruchu dłonie są obok uszu. Powoli wróć."],"tips":["Świetne ćwiczenie na tylną część barków i zdrowie stawów barkowych.","Nie odchylaj się do tyłu, żeby ruszyć ciężar."]},{"id":"Upright_Barbell_Row","name":"Podciąganie sztangi wzdłuż tułowia","en":"Upright Barbell Row","group":"Barki","mode":"reps","equipment":"Sztanga","primary":["barki"],"secondary":["kaptury"],"level":"początkujący","steps":["Stań prosto ze sztangą trzymaną nachwytem przed udami, ręce na szerokość barków lub nieco węziej.","Unieś sztangę blisko ciała, prowadząc łokcie w górę i na boki.","Zatrzymaj, gdy łokcie znajdą się na wysokości barków.","Powoli opuść."],"tips":["Nie unoś łokci wyżej niż barki, jeśli czujesz dyskomfort w stawach.","Szerszy chwyt jest zwykle bezpieczniejszy dla barków."]},{"id":"Band_Pull_Apart","name":"Rozciąganie gumy przed sobą","en":"Band Pull Apart","group":"Barki","mode":"reps","equipment":"Guma","primary":["barki"],"secondary":["środek pleców","kaptury"],"level":"początkujący","steps":["Stań prosto, trzymając gumę oporową oburącz przed sobą na wysokości barków, ręce proste.","Rozciągnij gumę, rozkładając ręce na boki, aż dotknie klatki.","Powoli wróć do pozycji wyjściowej."],"tips":["Dobra rozgrzewka barków przed wyciskaniem.","Barki nisko, bez wyginania pleców."]},{"id":"External_Rotation_with_Cable","name":"Rotacja zewnętrzna ramienia na wyciągu","en":"External Rotation with Cable","group":"Barki","mode":"reps","equipment":"Wyciąg","primary":["barki"],"secondary":[],"level":"początkujący","steps":["Stań bokiem do wyciągu ustawionego na wysokości łokcia i chwyć uchwyt ręką dalszą od wyciągu.","Łokieć przyciśnij do boku tułowia, ugięty pod kątem 90°, przedramię przed brzuchem.","Obróć przedramię na zewnątrz, nie odrywając łokcia od ciała.","Powoli wróć. Po serii zmień stronę."],"tips":["Bardzo lekki ciężar, to ćwiczenie wzmacniające stożek rotatorów.","Łokieć cały czas przy tułowiu."]},{"id":"Barbell_Curl","name":"Uginanie ramion ze sztangą stojąc","en":"Barbell Curl","group":"Biceps","mode":"reps","equipment":"Sztanga","primary":["biceps"],"secondary":["przedramiona"],"level":"początkujący","steps":["Stań prosto, trzymając sztangę podchwytem na szerokość barków.","Łokcie przy bokach tułowia.","Ugnij ramiona, unosząc sztangę do wysokości barków.","Powoli opuść ją do pełnego wyprostu."],"tips":["Nie bujaj tułowiem i nie wysuwaj łokci do przodu.","Opuszczanie powinno trwać ok. 2 sekundy."]},{"id":"EZ-Bar_Curl","name":"Uginanie ramion ze sztangą łamaną","en":"EZ-Bar Curl","group":"Biceps","mode":"reps","equipment":"Sztanga łamana","primary":["biceps"],"secondary":[],"level":"początkujący","steps":["Chwyć sztangę łamaną podchwytem za zewnętrzne lub wewnętrzne wygięcia.","Stań prosto, łokcie przy tułowiu.","Ugnij ramiona, unosząc sztangę do barków.","Powoli opuść do wyprostu."],"tips":["Sztanga łamana odciąża nadgarstki w porównaniu z prostą.","Bez odchylania tułowia."]},{"id":"Dumbbell_Alternate_Bicep_Curl","name":"Uginanie ramion z hantlami naprzemiennie","en":"Dumbbell Alternate Bicep Curl","group":"Biceps","mode":"reps","equipment":"Hantle","primary":["biceps"],"secondary":["przedramiona"],"level":"początkujący","steps":["Stań prosto z hantlami po bokach, dłonie zwrócone do ciała.","Ugnij jedno ramię, obracając w trakcie ruchu dłoń do góry.","Unieś hantel do barku, napnij biceps i powoli opuść.","Powtórz drugą ręką."],"tips":["Łokieć pozostaje przy tułowiu.","Nie pomagaj sobie bujaniem."]},{"id":"Hammer_Curls","name":"Uginanie ramion z hantlami chwytem młotkowym","en":"Hammer Curls","group":"Biceps","mode":"reps","equipment":"Hantle","primary":["biceps"],"secondary":[],"level":"początkujący","steps":["Stań prosto z hantlami po bokach, dłonie zwrócone do siebie.","Ugnij ramiona, unosząc hantle do barków bez obracania dłoni.","Powoli opuść."],"tips":["Ten chwyt mocniej angażuje mięsień ramienny i przedramiona.","Łokcie przy bokach, tułów nieruchomy."]},{"id":"Incline_Dumbbell_Curl","name":"Uginanie ramion z hantlami na ławce skośnej","en":"Incline Dumbbell Curl","group":"Biceps","mode":"reps","equipment":"Hantle","primary":["biceps"],"secondary":[],"level":"początkujący","steps":["Usiądź na ławce ustawionej pod kątem ok. 45°. Ręce z hantlami zwisają swobodnie w dół.","Dłonie zwrócone do przodu.","Ugnij ramiona, unosząc hantle do barków, bez przesuwania łokci do przodu.","Powoli opuść do pełnego wyprostu."],"tips":["Ta pozycja rozciąga biceps, więc użyj mniejszego ciężaru niż na stojąco.","Głowa i plecy przy oparciu."]},{"id":"Preacher_Curl","name":"Uginanie ramion na modlitewniku","en":"Preacher Curl","group":"Biceps","mode":"reps","equipment":"Sztanga","primary":["biceps"],"secondary":[],"level":"początkujący","steps":["Usiądź przy modlitewniku i oprzyj tył ramion o poduszkę.","Chwyć sztangę (prostą lub łamaną) podchwytem na szerokość barków.","Ugnij ramiona, unosząc sztangę do barków.","Powoli opuść, prawie do pełnego wyprostu."],"tips":["Nie opuszczaj ciężaru gwałtownie, bo na dole biceps jest najbardziej narażony.","Nie odrywaj ramion od poduszki."]},{"id":"Concentration_Curls","name":"Uginanie ramienia z hantlem w siadzie","en":"Concentration Curls","group":"Biceps","mode":"reps","equipment":"Hantle","primary":["biceps"],"secondary":["przedramiona"],"level":"początkujący","steps":["Usiądź na ławce w rozkroku. Oprzyj tył ramienia o wewnętrzną stronę uda.","Trzymaj hantel w wyprostowanej ręce, dłoń zwrócona do przodu.","Ugnij ramię, unosząc hantel do barku, i napnij biceps.","Powoli opuść. Po serii zmień rękę."],"tips":["Ramię nieruchome, pracuje tylko przedramię.","Skup się na napięciu mięśnia, nie na ciężarze."]},{"id":"Standing_Biceps_Cable_Curl","name":"Uginanie ramion na wyciągu dolnym","en":"Standing Biceps Cable Curl","group":"Biceps","mode":"reps","equipment":"Wyciąg","primary":["biceps"],"secondary":[],"level":"początkujący","steps":["Stań przodem do wyciągu dolnego z prostym drążkiem i chwyć go podchwytem na szerokość barków.","Łokcie przy tułowiu, ręce wyprostowane.","Ugnij ramiona, przyciągając drążek do barków.","Powoli wróć do wyprostu."],"tips":["Wyciąg utrzymuje napięcie w całym zakresie ruchu.","Nie odchylaj tułowia."]},{"id":"Triceps_Pushdown","name":"Prostowanie ramion na wyciągu górnym (drążek)","en":"Triceps Pushdown","group":"Triceps","mode":"reps","equipment":"Wyciąg","primary":["triceps"],"secondary":[],"level":"początkujący","steps":["Stań przed wyciągiem górnym z krótkim drążkiem i chwyć go nachwytem na szerokość barków.","Łokcie przy tułowiu, przedramiona mniej więcej równolegle do podłogi.","Wyprostuj ręce, dociskając drążek w stronę ud.","Powoli wróć, aż przedramiona będą poziomo."],"tips":["Łokcie nieruchome, nie odsuwaj ich od tułowia.","Nie dociskaj ciężaru tułowiem."]},{"id":"Triceps_Pushdown_-_Rope_Attachment","name":"Prostowanie ramion na wyciągu górnym z liną","en":"Triceps Pushdown - Rope Attachment","group":"Triceps","mode":"reps","equipment":"Wyciąg","primary":["triceps"],"secondary":[],"level":"początkujący","steps":["Załóż linę na wyciąg górny i chwyć jej końce chwytem neutralnym.","Łokcie przy tułowiu, przedramiona poziomo.","Wyprostuj ręce w dół, na końcu rozciągając końce liny na boki.","Powoli wróć do pozycji wyjściowej."],"tips":["Rozchylenie liny na dole mocniej napina triceps.","Ramiona nieruchome."]},{"id":"Cable_Rope_Overhead_Triceps_Extension","name":"Prostowanie ramion nad głową z liną","en":"Cable Rope Overhead Triceps Extension","group":"Triceps","mode":"reps","equipment":"Wyciąg","primary":["triceps"],"secondary":[],"level":"początkujący","steps":["Załóż linę na wyciąg i stań tyłem do niego. Chwyć linę oburącz i przełóż ją za głowę.","Pochyl się lekko do przodu w wykroku, łokcie wysoko przy głowie.","Wyprostuj ręce przed sobą i w górę.","Powoli wróć, czując rozciągnięcie tricepsa."],"tips":["Łokcie nie rozjeżdżają się na boki.","Ręce nad głową najmocniej rozciągają długą głowę tricepsa."]},{"id":"EZ-Bar_Skullcrusher","name":"Wyciskanie francuskie leżąc (sztanga łamana)","en":"EZ-Bar Skullcrusher","group":"Triceps","mode":"reps","equipment":"Sztanga łamana","primary":["triceps"],"secondary":["przedramiona"],"level":"początkujący","steps":["Połóż się na ławce, trzymając sztangę łamaną nachwytem nad klatką na prostych rękach.","Ramiona lekko pochylone w stronę głowy.","Ugnij łokcie, opuszczając sztangę w stronę czoła lub tuż za głowę.","Wyprostuj ręce z powrotem."],"tips":["Ramiona nieruchome, pracują tylko łokcie.","Nie rozkładaj łokci na boki."]},{"id":"Standing_Dumbbell_Triceps_Extension","name":"Wyciskanie francuskie hantla oburącz","en":"Standing Dumbbell Triceps Extension","group":"Triceps","mode":"reps","equipment":"Hantle","primary":["triceps"],"secondary":[],"level":"początkujący","steps":["Usiądź lub stań, trzymając hantel oburącz pod talerzem nad głową, na prostych rękach.","Ugnij łokcie, opuszczając hantel za głowę.","Wyprostuj ręce z powrotem do góry."],"tips":["Łokcie skierowane do przodu, blisko głowy.","Napnij brzuch, nie wyginaj pleców."]},{"id":"Close-Grip_Barbell_Bench_Press","name":"Wyciskanie sztangi wąskim chwytem","en":"Close-Grip Barbell Bench Press","group":"Triceps","mode":"reps","equipment":"Sztanga","primary":["triceps"],"secondary":["klatka piersiowa","barki"],"level":"początkujący","steps":["Połóż się na ławce płaskiej i chwyć sztangę nachwytem na szerokość barków, czyli węziej niż przy zwykłym wyciskaniu.","Zdejmij sztangę ze stojaków nad klatkę.","Opuść ją do dolnej części klatki, prowadząc łokcie blisko tułowia.","Wypchnij sztangę do góry."],"tips":["Zbyt wąski chwyt obciąża nadgarstki. Szerokość barków wystarczy.","Ćwicz z asekuracją."]},{"id":"Dips_-_Triceps_Version","name":"Pompki na poręczach (wersja na triceps)","en":"Dips - Triceps Version","group":"Triceps","mode":"reps","equipment":"Masa ciała","primary":["triceps"],"secondary":["klatka piersiowa","barki"],"level":"początkujący","steps":["Wejdź na poręcze w podporze na prostych rękach, tułów pionowo.","Łokcie blisko tułowia.","Opuszczaj się, aż ramiona będą mniej więcej równolegle do podłogi.","Wypchnij się z powrotem do wyprostu rąk."],"tips":["Pionowy tułów przenosi pracę z klatki na triceps.","Nie schodź za głęboko, jeśli bolą barki."]},{"id":"Bench_Dips","name":"Pompki w podporze tyłem na ławce","en":"Bench Dips","group":"Triceps","mode":"reps","equipment":"Masa ciała","primary":["triceps"],"secondary":["klatka piersiowa","barki"],"level":"początkujący","steps":["Usiądź na krawędzi ławki i oprzyj dłonie obok bioder. Wysuń biodra przed ławkę, nogi wyprostowane lub ugięte.","Opuszczaj ciało, uginając łokcie do ok. 90°.","Wypchnij się z powrotem do wyprostu rąk."],"tips":["Plecy blisko ławki.","Ugięte nogi to łatwiejszy wariant, nogi na drugiej ławce to trudniejszy."]},{"id":"Tricep_Dumbbell_Kickback","name":"Prostowanie ramienia z hantlem w opadzie","en":"Tricep Dumbbell Kickback","group":"Triceps","mode":"reps","equipment":"Hantle","primary":["triceps"],"secondary":[],"level":"początkujący","steps":["Oprzyj się jedną ręką i kolanem o ławkę, plecy proste. W drugiej ręce trzymaj hantel.","Ramię równolegle do tułowia, łokieć ugięty pod kątem 90°.","Wyprostuj rękę w łokciu, wypychając hantel do tyłu.","Powoli wróć do 90°. Po serii zmień stronę."],"tips":["Ramię nieruchome, przy tułowiu.","Lekki ciężar. Liczy się pełny wyprost."]},{"id":"Barbell_Squat","name":"Przysiad ze sztangą na plecach","en":"Barbell Squat","group":"Czworogłowe uda","mode":"reps","equipment":"Sztanga","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda","prostowniki grzbietu"],"level":"początkujący","steps":["Ustaw sztangę na stojakach na wysokości barków. Wejdź pod nią i oprzyj ją na górnej części pleców, nie na karku.","Chwyć sztangę szerzej niż barki, zdejmij ją i cofnij się o dwa kroki. Stopy na szerokość barków lub nieco szerzej, palce lekko na zewnątrz.","Weź wdech, napnij brzuch i schodź w dół, cofając biodra i uginając kolana w kierunku palców.","Zejdź co najmniej do momentu, gdy uda będą równoległe do podłogi.","Wypchnij się ze środka stopy z powrotem do wyprostu."],"tips":["Kolana nie mogą zapadać się do środka.","Plecy proste, pięty cały czas na podłodze.","Ustaw zabezpieczenia w stojakach na wypadek nieudanego powtórzenia."]},{"id":"Front_Barbell_Squat","name":"Przysiad przedni ze sztangą","en":"Front Barbell Squat","group":"Czworogłowe uda","mode":"reps","equipment":"Sztanga","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"zaawansowany","steps":["Oprzyj sztangę na przedniej części barków, łokcie wysoko przed sobą (chwyt olimpijski lub skrzyżowane ręce).","Stopy na szerokość barków, palce lekko na zewnątrz.","Schodź w dół z tułowiem jak najbardziej pionowym.","Wypchnij się z powrotem do góry, utrzymując łokcie wysoko."],"tips":["Opadające łokcie sprawiają, że sztanga zsuwa się z barków.","Wymaga dobrej mobilności nadgarstków i kostek."]},{"id":"Goblet_Squat","name":"Przysiad z kettlebell przy klatce (goblet)","en":"Goblet Squat","group":"Czworogłowe uda","mode":"reps","equipment":"Kettlebell","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda","barki"],"level":"początkujący","steps":["Trzymaj kettlebell (lub hantel) oburącz przy klatce, łokcie skierowane w dół.","Stopy nieco szerzej niż barki, palce lekko na zewnątrz.","Zejdź w przysiad, wsuwając łokcie między kolana.","Wypchnij się z pięt do wyprostu."],"tips":["Świetne ćwiczenie do nauki techniki przysiadu.","Tułów wyprostowany, klatka do przodu."]},{"id":"Bodyweight_Squat","name":"Przysiad bez obciążenia","en":"Bodyweight Squat","group":"Czworogłowe uda","mode":"reps","equipment":"Masa ciała","primary":["czworogłowe uda"],"secondary":["pośladki","dwugłowe uda"],"level":"początkujący","steps":["Stań ze stopami na szerokość barków, ręce przed sobą.","Cofnij biodra i ugnij kolana, schodząc w dół jak do siadania na krześle.","Zejdź do równoległości ud z podłogą lub niżej.","Wróć do pozycji stojącej."],"tips":["Pięty na podłodze, kolana w linii ze stopami.","Dobra rozgrzewka przed przysiadem ze sztangą."]},{"id":"Leg_Press","name":"Wypychanie nogami na suwnicy","en":"Leg Press","group":"Czworogłowe uda","mode":"reps","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"początkujący","steps":["Usiądź na maszynie, plecy i pośladki dociśnięte do oparcia. Stopy postaw na platformie na szerokość barków.","Zwolnij blokady i opuszczaj platformę, uginając kolana do ok. 90°.","Wypchnij platformę całymi stopami, nie prostując całkowicie kolan."],"tips":["Nie blokuj kolan na górze.","Pośladki nie mogą odrywać się od oparcia na dole.","Stopy wyżej na platformie to więcej pracy pośladków i dwugłowych."]},{"id":"Hack_Squat","name":"Przysiad na maszynie hack","en":"Hack Squat","group":"Czworogłowe uda","mode":"reps","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"początkujący","steps":["Wejdź na maszynę, oprzyj plecy o oparcie, a barki pod poduszki. Stopy na szerokość barków.","Zwolnij blokady i schodź w dół, uginając kolana do co najmniej 90°.","Wypchnij się z powrotem do góry, nie blokując kolan."],"tips":["Plecy cały czas przy oparciu.","Kolana w linii ze stopami."]},{"id":"Smith_Machine_Squat","name":"Przysiad na suwnicy Smitha","en":"Smith Machine Squat","group":"Czworogłowe uda","mode":"reps","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda","prostowniki grzbietu"],"level":"początkujący","steps":["Ustaw sztangę suwnicy na wysokości barków i wejdź pod nią, opierając ją na górnej części pleców.","Stopy wysuń nieco przed sztangę, na szerokość barków.","Odblokuj sztangę obrotem nadgarstków i zejdź w przysiad.","Wypchnij się do góry. Po serii zablokuj sztangę."],"tips":["Prowadnica stabilizuje ruch, ale brzuch nadal musi być napięty.","Ustaw ograniczniki na bezpiecznej wysokości."]},{"id":"Split_Squat_with_Dumbbells","name":"Przysiad bułgarski z hantlami","en":"Split Squat with Dumbbells","group":"Czworogłowe uda","mode":"reps","equipment":"Hantle","primary":["czworogłowe uda"],"secondary":["pośladki","dwugłowe uda"],"level":"początkujący","steps":["Stań tyłem do ławki i oprzyj na niej grzbiet stopy tylnej nogi. Przednia stopa ok. pół metra do metra przed ławką.","Trzymaj hantle po bokach ciała.","Opuszczaj się, uginając przednie kolano, aż tylne kolano znajdzie się tuż nad podłogą.","Wypchnij się z pięty przedniej nogi do góry. Po serii zmień nogę."],"tips":["Przednie kolano podąża w kierunku palców i nie zapada się do środka.","Dłuższy krok to więcej pracy pośladków, krótszy to więcej czworogłowych."]},{"id":"Dumbbell_Lunges","name":"Wykroki z hantlami","en":"Dumbbell Lunges","group":"Czworogłowe uda","mode":"reps","equipment":"Hantle","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"początkujący","steps":["Stań prosto z hantlami po bokach.","Zrób duży krok do przodu i opuść ciało, aż oba kolana będą ugięte do ok. 90°.","Odepchnij się przednią nogą i wróć do pozycji wyjściowej.","Powtórz drugą nogą."],"tips":["Tułów wyprostowany.","Tylne kolano zatrzymaj tuż nad podłogą, nie uderzaj nim o nią."]},{"id":"Barbell_Walking_Lunge","name":"Wykroki chodzone ze sztangą","en":"Barbell Walking Lunge","group":"Czworogłowe uda","mode":"reps","equipment":"Sztanga","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"początkujący","steps":["Oprzyj sztangę na górnej części pleców, jak do przysiadu.","Zrób krok do przodu i opuść się, aż tylne kolano będzie tuż nad podłogą.","Wstań, przenosząc tylną nogę do przodu w kolejny wykrok.","Kontynuuj marsz, licząc powtórzenia na każdą nogę."],"tips":["Potrzebujesz wolnej przestrzeni przed sobą.","Utrzymuj stabilny, wyprostowany tułów."]},{"id":"Dumbbell_Rear_Lunge","name":"Wykroki w tył z hantlami","en":"Dumbbell Rear Lunge","group":"Czworogłowe uda","mode":"reps","equipment":"Hantle","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"średni","steps":["Stań prosto z hantlami po bokach.","Zrób krok w tył jedną nogą i opuść się, aż oba kolana będą ugięte do ok. 90°.","Wypchnij się przednią nogą z powrotem do pozycji wyjściowej.","Powtórz drugą nogą."],"tips":["Wykroki w tył są łagodniejsze dla kolan niż w przód.","Ciężar ciała na pięcie przedniej nogi."]},{"id":"Dumbbell_Step_Ups","name":"Wejścia na skrzynię z hantlami","en":"Dumbbell Step Ups","group":"Czworogłowe uda","mode":"reps","equipment":"Hantle","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"średni","steps":["Stań przed skrzynią lub ławką z hantlami po bokach.","Postaw całą stopę jednej nogi na skrzyni.","Wejdź na skrzynię, wypychając się nogą na podwyższeniu, a nie odbijając się dolną.","Zejdź kontrolowanie i powtórz. Po serii zmień nogę albo wykonuj naprzemiennie."],"tips":["Dobierz wysokość skrzyni tak, by kolano po postawieniu stopy było ugięte ok. 90°.","Tułów wyprostowany."]},{"id":"Leg_Extensions","name":"Prostowanie nóg na maszynie","en":"Leg Extensions","group":"Czworogłowe uda","mode":"reps","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":[],"level":"początkujący","steps":["Usiądź na maszynie, plecy przy oparciu, a wałek oprzyj nad kostkami. Kolana na wysokości osi obrotu maszyny.","Chwyć uchwyty po bokach siedziska.","Wyprostuj nogi w kolanach i na górze napnij uda.","Powoli opuść ciężar."],"tips":["Nie podrzucaj ciężaru.","Pośladki cały czas na siedzisku."]},{"id":"Romanian_Deadlift","name":"Rumuński martwy ciąg","en":"Romanian Deadlift","group":"Dwugłowe uda","mode":"reps","equipment":"Sztanga","primary":["dwugłowe uda"],"secondary":["łydki","pośladki","prostowniki grzbietu"],"level":"średni","steps":["Stań prosto ze sztangą trzymaną nachwytem na szerokość barków przed udami. Kolana lekko ugięte.","Cofaj biodra, opuszczając sztangę wzdłuż ud i piszczeli. Plecy pozostają proste.","Schodź, aż poczujesz mocne rozciągnięcie z tyłu ud (zwykle sztanga w połowie piszczeli).","Wróć do wyprostu, wypychając biodra do przodu."],"tips":["To ruch bioder, nie przysiad. Kolana prawie nieruchome.","Sztanga cały czas blisko nóg, plecy nie mogą się zaokrąglać."]},{"id":"Stiff-Legged_Dumbbell_Deadlift","name":"Martwy ciąg na prostych nogach z hantlami","en":"Stiff-Legged Dumbbell Deadlift","group":"Dwugłowe uda","mode":"reps","equipment":"Hantle","primary":["dwugłowe uda"],"secondary":["pośladki","prostowniki grzbietu"],"level":"początkujący","steps":["Stań prosto z hantlami przed udami, kolana lekko ugięte.","Pochylaj tułów, cofając biodra i opuszczając hantle wzdłuż nóg.","Zejdź do mocnego rozciągnięcia tyłu ud, z prostymi plecami.","Wróć do pozycji stojącej, napinając pośladki."],"tips":["Plecy proste przez cały ruch.","Zakres ruchu zależy od elastyczności. Nie zmuszaj się do dotykania podłogi."]},{"id":"Lying_Leg_Curls","name":"Uginanie nóg leżąc na maszynie","en":"Lying Leg Curls","group":"Dwugłowe uda","mode":"reps","equipment":"Maszyna","primary":["dwugłowe uda"],"secondary":[],"level":"początkujący","steps":["Połóż się przodem na maszynie, wałek oprzyj tuż nad piętami, kolana tuż za krawędzią ławki.","Chwyć uchwyty z przodu.","Ugnij nogi, przyciągając wałek jak najbliżej pośladków.","Powoli opuść, prawie do pełnego wyprostu."],"tips":["Biodra przyciśnięte do ławki.","Kontroluj fazę opuszczania."]},{"id":"Seated_Leg_Curl","name":"Uginanie nóg siedząc na maszynie","en":"Seated Leg Curl","group":"Dwugłowe uda","mode":"reps","equipment":"Maszyna","primary":["dwugłowe uda"],"secondary":[],"level":"początkujący","steps":["Usiądź na maszynie, dolny wałek oprzyj tuż nad piętami, a górny zablokuj na udach.","Chwyć uchwyty.","Ugnij nogi, przyciągając wałek pod siedzisko.","Powoli wróć do wyprostu."],"tips":["Plecy przy oparciu.","Pełny zakres ruchu bez szarpania."]},{"id":"Good_Morning","name":"Skłony ze sztangą na barkach (good morning)","en":"Good Morning","group":"Dwugłowe uda","mode":"reps","equipment":"Sztanga","primary":["dwugłowe uda"],"secondary":["brzuch","pośladki","prostowniki grzbietu"],"level":"średni","steps":["Oprzyj sztangę na górnej części pleców, jak do przysiadu. Stopy na szerokość bioder, kolana lekko ugięte.","Cofając biodra, pochylaj tułów do przodu z prostymi plecami.","Zejdź, aż tułów będzie prawie równoległy do podłogi albo poczujesz mocne rozciągnięcie tyłu ud.","Wróć do wyprostu, wypychając biodra do przodu."],"tips":["Zacznij od lekkiego ciężaru, bo ćwiczenie mocno obciąża dolny odcinek pleców.","Nigdy nie zaokrąglaj pleców."]},{"id":"Barbell_Hip_Thrust","name":"Wypychanie bioder ze sztangą (hip thrust)","en":"Barbell Hip Thrust","group":"Pośladki i biodra","mode":"reps","equipment":"Sztanga","primary":["pośladki"],"secondary":["łydki","dwugłowe uda"],"level":"średni","steps":["Usiądź na podłodze plecami przy ławce. Sztanga leży na biodrach, najlepiej na podkładce.","Oprzyj łopatki o ławkę, stopy postaw na podłodze na szerokość bioder.","Wypchnij biodra w górę, aż tułów i uda będą w jednej linii. Mocno napnij pośladki.","Powoli opuść biodra."],"tips":["Na górze nie przeprostowuj lędźwi, broda lekko przyciągnięta.","Na górze ruchu piszczele są mniej więcej pionowo."]},{"id":"Barbell_Glute_Bridge","name":"Mostek biodrowy ze sztangą","en":"Barbell Glute Bridge","group":"Pośladki i biodra","mode":"reps","equipment":"Sztanga","primary":["pośladki"],"secondary":["łydki","dwugłowe uda"],"level":"średni","steps":["Połóż się na plecach, ugnij kolana i postaw stopy blisko pośladków. Sztanga leży na biodrach.","Wypchnij biodra w górę, napinając pośladki, aż ciało od barków do kolan będzie w jednej linii.","Zatrzymaj na sekundę i powoli opuść."],"tips":["Mniejszy zakres ruchu niż w hip thruście i łatwiejsza pozycja wyjściowa.","Używaj podkładki na sztangę."]},{"id":"Single_Leg_Glute_Bridge","name":"Mostek biodrowy jednonóż","en":"Single Leg Glute Bridge","group":"Pośladki i biodra","mode":"reps","equipment":"Masa ciała","primary":["pośladki"],"secondary":["dwugłowe uda"],"level":"początkujący","steps":["Połóż się na plecach, ugnij jedną nogę, a drugą wyprostuj.","Wypchnij biodra w górę, odpychając się piętą nogi opartej o podłogę.","Zatrzymaj na górze, napinając pośladek, i powoli opuść.","Po serii zmień nogę."],"tips":["Biodra nie mogą opadać na jedną stronę.","Dobre ćwiczenie na rozgrzewkę albo do domu."]},{"id":"One-Legged_Cable_Kickback","name":"Odwodzenie nogi w tył na wyciągu","en":"One-Legged Cable Kickback","group":"Pośladki i biodra","mode":"reps","equipment":"Wyciąg","primary":["pośladki"],"secondary":["dwugłowe uda"],"level":"średni","steps":["Załóż mankiet na kostkę i przypnij go do wyciągu dolnego. Stań przodem do wyciągu i przytrzymaj się konstrukcji.","Lekko pochyl tułów do przodu.","Wyprostowaną nogę odwiedź do tyłu, napinając pośladek.","Powoli wróć. Po serii zmień nogę."],"tips":["Nie wyginaj lędźwi, ruch pochodzi z biodra.","Kontroluj powrót."]},{"id":"Thigh_Abductor","name":"Odwodzenie nóg na maszynie","en":"Thigh Abductor","group":"Pośladki i biodra","mode":"reps","equipment":"Maszyna","primary":["odwodziciele"],"secondary":["pośladki"],"level":"początkujący","steps":["Usiądź na maszynie, plecy przy oparciu, poduszki oprzyj o zewnętrzną stronę kolan.","Rozsuń nogi na boki tak szeroko, jak pozwala zakres ruchu.","Zatrzymaj na chwilę i powoli wróć."],"tips":["Wzmacnia pośladek średni, który stabilizuje kolana i biodra.","Bez szarpania."]},{"id":"Thigh_Adductor","name":"Przywodzenie nóg na maszynie","en":"Thigh Adductor","group":"Pośladki i biodra","mode":"reps","equipment":"Maszyna","primary":["przywodziciele"],"secondary":["pośladki","dwugłowe uda"],"level":"początkujący","steps":["Usiądź na maszynie, plecy przy oparciu, poduszki oprzyj o wewnętrzną stronę kolan.","Złącz nogi, ściskając poduszki.","Powoli wróć do rozstawienia nóg."],"tips":["Ustaw zakres ruchu tak, by nie czuć nadmiernego rozciągania w pachwinach.","Kontroluj fazę powrotu."]},{"id":"Standing_Calf_Raises","name":"Wspięcia na palce stojąc na maszynie","en":"Standing Calf Raises","group":"Łydki","mode":"reps","equipment":"Maszyna","primary":["łydki"],"secondary":[],"level":"początkujący","steps":["Wejdź pod poduszki maszyny. Przednią część stóp postaw na krawędzi podestu, pięty wiszą w powietrzu.","Kolana lekko ugięte, ale nieruchome.","Wspnij się jak najwyżej na palce i zatrzymaj na sekundę.","Opuść pięty jak najniżej, czując rozciągnięcie łydek."],"tips":["Pełny zakres ruchu jest ważniejszy niż ciężar.","Nie odbijaj się sprężyście na dole."]},{"id":"Seated_Calf_Raise","name":"Wspięcia na palce siedząc","en":"Seated Calf Raise","group":"Łydki","mode":"reps","equipment":"Maszyna","primary":["łydki"],"secondary":[],"level":"początkujący","steps":["Usiądź na maszynie, poduszkę oprzyj na udach tuż nad kolanami, przednią część stóp na podeście.","Zwolnij blokadę i opuść pięty jak najniżej.","Wspnij się na palce jak najwyżej i zatrzymaj na sekundę."],"tips":["Wersja siedząca mocniej angażuje mięsień płaszczkowaty.","Wolne tempo, pełny zakres."]},{"id":"Calf_Press_On_The_Leg_Press_Machine","name":"Wspięcia na palce na suwnicy","en":"Calf Press On The Leg Press Machine","group":"Łydki","mode":"reps","equipment":"Maszyna","primary":["łydki"],"secondary":[],"level":"początkujący","steps":["Usiądź na suwnicy i postaw przednią część stóp na dolnej krawędzi platformy.","Wyprostuj nogi (bez blokowania kolan) i zwolnij blokady.","Wypchnij platformę samymi palcami stóp, a potem powoli pozwól piętom się cofnąć."],"tips":["Nie zwalniaj blokad z ugiętymi nogami, bo stopy mogą się zsunąć.","Kolana pozostają nieruchome."]},{"id":"Plank","name":"Deska (plank)","en":"Plank","group":"Brzuch","mode":"time","equipment":"Masa ciała","primary":["brzuch"],"secondary":[],"level":"początkujący","steps":["Oprzyj przedramiona o podłogę, łokcie pod barkami. Wyprostuj nogi, opierając się na palcach.","Ciało w jednej linii od głowy do pięt.","Napnij brzuch i pośladki i utrzymaj pozycję przez zadany czas."],"tips":["Biodra nie mogą opadać ani unosić się wysoko.","Oddychaj spokojnie, nie wstrzymuj oddechu."]},{"id":"Side_Bridge","name":"Deska bokiem","en":"Side Bridge","group":"Brzuch","mode":"time","equipment":"Masa ciała","primary":["brzuch"],"secondary":["barki"],"level":"początkujący","steps":["Połóż się na boku i oprzyj na przedramieniu, łokieć pod barkiem.","Unieś biodra, aż ciało będzie w jednej linii.","Utrzymaj pozycję przez zadany czas, potem zmień stronę."],"tips":["Biodra wysoko, nie opadają w stronę podłogi.","Łatwiejsza wersja: oparcie na kolanie."]},{"id":"Crunches","name":"Brzuszki","en":"Crunches","group":"Brzuch","mode":"reps","equipment":"Masa ciała","primary":["brzuch"],"secondary":[],"level":"początkujący","steps":["Połóż się na plecach, ugnij kolana, stopy na podłodze. Dłonie przy skroniach lub na klatce.","Unieś łopatki od podłogi, zbliżając żebra do miednicy.","Zatrzymaj na chwilę i powoli opuść."],"tips":["Nie ciągnij głowy rękami.","Dolny odcinek pleców zostaje na podłodze."]},{"id":"Cable_Crunch","name":"Spięcia brzucha na wyciągu klęcząc (allahy)","en":"Cable Crunch","group":"Brzuch","mode":"reps","equipment":"Wyciąg","primary":["brzuch"],"secondary":[],"level":"początkujący","steps":["Załóż linę na wyciąg górny i uklęknij przed nim. Trzymaj linę przy głowie.","Biodra nieruchome, tułów lekko pochylony.","Zwiń tułów w dół, zbliżając łokcie do ud i napinając brzuch.","Powoli wróć do pozycji wyjściowej."],"tips":["Ruch to zwijanie kręgosłupa, a nie zginanie bioder.","Nie siadaj na piętach."]},{"id":"Ab_Crunch_Machine","name":"Spięcia brzucha na maszynie","en":"Ab Crunch Machine","group":"Brzuch","mode":"reps","equipment":"Maszyna","primary":["brzuch"],"secondary":[],"level":"średni","steps":["Usiądź na maszynie, chwyć uchwyty, stopy zablokuj pod wałkami.","Zwiń tułów do przodu, napinając brzuch.","Powoli wróć."],"tips":["Nie ciągnij rękami, pracuje brzuch.","Wybierz ciężar, który pozwoli na 12–20 powtórzeń."]},{"id":"Hanging_Leg_Raise","name":"Unoszenie nóg w zwisie na drążku","en":"Hanging Leg Raise","group":"Brzuch","mode":"reps","equipment":"Masa ciała","primary":["brzuch"],"secondary":[],"level":"zaawansowany","steps":["Zawiśnij na drążku nachwytem, ręce proste.","Unieś nogi (proste lub ugięte) przed siebie co najmniej do poziomu bioder.","Powoli opuść nogi bez bujania."],"tips":["Ugięte nogi to łatwiejszy wariant.","Na górze podwiń miednicę, aby mocniej zaangażować brzuch."]},{"id":"Knee_Hip_Raise_On_Parallel_Bars","name":"Unoszenie nóg w podporze na poręczach","en":"Knee/Hip Raise On Parallel Bars","group":"Brzuch","mode":"reps","equipment":"Masa ciała","primary":["brzuch"],"secondary":[],"level":"początkujący","steps":["Oprzyj przedramiona o poduszki stojaka, plecy przy oparciu, nogi zwisają.","Unieś nogi (proste lub ugięte w kolanach) do poziomu bioder lub wyżej.","Powoli opuść."],"tips":["Plecy przyciśnięte do oparcia.","Bez wymachów, kontroluj opuszczanie."]},{"id":"Reverse_Crunch","name":"Brzuszki odwrotne","en":"Reverse Crunch","group":"Brzuch","mode":"reps","equipment":"Masa ciała","primary":["brzuch"],"secondary":[],"level":"początkujący","steps":["Połóż się na plecach, ręce wzdłuż ciała, nogi ugięte i uniesione (uda pionowo).","Przyciągnij kolana do klatki, unosząc biodra od podłogi.","Powoli opuść biodra."],"tips":["Ruch wykonuje brzuch, nie rozmach nóg.","Dobra opcja na dolną część brzucha."]},{"id":"Russian_Twist","name":"Skręty tułowia w siadzie (russian twist)","en":"Russian Twist","group":"Brzuch","mode":"reps","equipment":"Masa ciała","primary":["brzuch"],"secondary":["prostowniki grzbietu"],"level":"średni","steps":["Usiądź na podłodze z ugiętymi kolanami i odchyl tułów do tyłu ok. 45°.","Trzymaj dłonie razem (albo talerz) przed klatką.","Skręcaj tułów naprzemiennie w prawo i w lewo."],"tips":["Plecy proste, ruch pochodzi z tułowia, nie tylko z rąk.","Uniesione stopy utrudniają ćwiczenie."]},{"id":"Ab_Roller","name":"Wyjścia kółkiem do brzucha (ab roller)","en":"Ab Roller","group":"Brzuch","mode":"reps","equipment":"Inne","primary":["brzuch"],"secondary":["barki"],"level":"średni","steps":["Uklęknij, chwyć kółko oburącz i postaw je przed kolanami.","Napnij brzuch i powoli tocz kółko do przodu, wydłużając ciało.","Zatrzymaj się, zanim biodra opadną, i przyciągnij kółko z powrotem do kolan."],"tips":["Lędźwie nie mogą się wyginać. Zakres ruchu dobierz do siły.","Zacznij od krótkich wyjść."]},{"id":"Dead_Bug","name":"Martwy robak (dead bug)","en":"Dead Bug","group":"Brzuch","mode":"reps","equipment":"Masa ciała","primary":["brzuch"],"secondary":[],"level":"początkujący","steps":["Połóż się na plecach, ręce wyprostowane w górę, nogi ugięte pod kątem 90° nad biodrami.","Dociśnij dolną część pleców do podłogi.","Jednocześnie opuść przeciwną rękę i nogę w stronę podłogi.","Wróć i powtórz drugą stroną."],"tips":["Lędźwie cały czas przyklejone do podłogi.","Wolne tempo, spokojny oddech."]},{"id":"Pallof_Press","name":"Wypychanie uchwytu wyciągu przed siebie (Pallof press)","en":"Pallof Press","group":"Brzuch","mode":"reps","equipment":"Wyciąg","primary":["brzuch"],"secondary":["klatka piersiowa","barki","triceps"],"level":"początkujący","steps":["Stań bokiem do wyciągu ustawionego na wysokości klatki i chwyć uchwyt oburącz przy klatce.","Odsuń się od wyciągu, aby linka była napięta. Stopy na szerokość barków.","Wypchnij uchwyt przed siebie i przytrzymaj, nie pozwalając wyciągowi skręcić tułowia.","Wróć do klatki. Po serii zmień stronę."],"tips":["Ćwiczenie uczy brzuch przeciwdziałać skrętom.","Biodra i barki skierowane do przodu."]},{"id":"Mountain_Climbers","name":"Wspinaczka (mountain climbers)","en":"Mountain Climbers","group":"Brzuch","mode":"time","equipment":"Masa ciała","primary":["czworogłowe uda"],"secondary":["klatka piersiowa","dwugłowe uda","barki"],"level":"początkujący","steps":["Przyjmij pozycję jak do pompki na prostych rękach.","Przyciągaj naprzemiennie kolana do klatki w szybkim tempie.","Kontynuuj przez zadany czas."],"tips":["Biodra nisko, w linii z barkami.","Dłonie pod barkami."]},{"id":"One-Arm_Kettlebell_Swings","name":"Swing kettlebell jednorącz","en":"One-Arm Kettlebell Swings","group":"Całe ciało","mode":"reps","equipment":"Kettlebell","primary":["dwugłowe uda"],"secondary":["łydki","pośladki","prostowniki grzbietu","barki"],"level":"średni","steps":["Stań w rozkroku nieco szerszym niż barki, kettlebell przed sobą. Chwyć go jedną ręką.","Cofnij biodra i przenieś kettlebell między nogami do tyłu.","Dynamicznie wypchnij biodra do przodu, posyłając kettlebell przed siebie do wysokości barków.","Pozwól mu opaść i płynnie przejdź do kolejnego powtórzenia. Po serii zmień rękę."],"tips":["Siła pochodzi z bioder, nie z ręki ani barku.","Plecy proste. To zawias biodrowy, a nie przysiad."]},{"id":"Farmers_Walk","name":"Spacer farmera","en":"Farmer's Walk","group":"Całe ciało","mode":"time","equipment":"Hantle","primary":["przedramiona"],"secondary":["brzuch","pośladki","dwugłowe uda","prostowniki grzbietu","czworogłowe uda","kaptury"],"level":"średni","steps":["Postaw ciężkie hantle lub kettlebelle po bokach. Przykucnij z prostymi plecami i chwyć je.","Wstań, napinając brzuch i ściągając łopatki.","Idź krótkimi, szybkimi krokami przez zadany czas lub dystans.","Odłóż ciężar, kucając z prostymi plecami."],"tips":["Wzmacnia chwyt, barki i mięśnie tułowia.","Nie przechylaj się na boki."]},{"id":"Battling_Ropes","name":"Liny bojowe (battle ropes)","en":"Battling Ropes","group":"Całe ciało","mode":"time","equipment":"Inne","primary":["barki"],"secondary":["klatka piersiowa","przedramiona"],"level":"początkujący","steps":["Chwyć końce liny i stań w lekkim przysiadzie z prostymi plecami.","Wykonuj naprzemienne lub jednoczesne fale rękami w szybkim tempie.","Kontynuuj przez zadany czas."],"tips":["Ruch pochodzi z barków i rąk, tułów stabilny.","Świetne do interwałów."]},{"id":"Running_Treadmill","name":"Bieg na bieżni","en":"Running, Treadmill","group":"Cardio","mode":"time","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"początkujący","steps":["Wejdź na bieżnię i zacznij od kilku minut marszu.","Stopniowo zwiększaj prędkość do docelowej.","Na koniec zwolnij do marszu na kilka minut."],"tips":["Lekkie nachylenie (ok. 1%) lepiej oddaje bieganie na zewnątrz.","Nie trzymaj się poręczy w trakcie biegu."]},{"id":"Bicycling_Stationary","name":"Rower stacjonarny","en":"Bicycling, Stationary","group":"Cardio","mode":"time","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"początkujący","steps":["Ustaw siodełko tak, aby noga w dolnym położeniu pedału była prawie wyprostowana.","Rozgrzej się kilka minut przy niskim oporze.","Pedałuj w zaplanowanym tempie i oporze przez zadany czas."],"tips":["Kolana nie uciekają na boki.","Dobra rozgrzewka przed treningiem nóg."]},{"id":"Rowing_Stationary","name":"Wioślarz (ergometr wioślarski)","en":"Rowing, Stationary","group":"Cardio","mode":"time","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["biceps","łydki","pośladki","dwugłowe uda","prostowniki grzbietu","środek pleców"],"level":"średni","steps":["Usiądź, zapnij stopy w paskach i chwyć uchwyt nachwytem.","Zaczynaj ruch od odepchnięcia nogami, potem odchyl tułów i przyciągnij uchwyt do dolnej części klatki.","Wracaj w odwrotnej kolejności: ręce, tułów, nogi."],"tips":["Nogi wykonują większość pracy, ręce kończą ruch.","Plecy proste przez cały czas."]},{"id":"Elliptical_Trainer","name":"Orbitrek","en":"Elliptical Trainer","group":"Cardio","mode":"time","equipment":"Maszyna","primary":["czworogłowe uda"],"secondary":["łydki","pośladki","dwugłowe uda"],"level":"średni","steps":["Wejdź na pedały i chwyć ruchome uchwyty.","Zacznij od niskiego oporu, potem dobierz opór i tempo do celu treningu.","Ćwicz przez zadany czas z wyprostowaną sylwetką."],"tips":["Łagodny dla stawów.","Nie opieraj się całym ciężarem na uchwytach."]},{"id":"Rope_Jumping","name":"Skakanka","en":"Rope Jumping","group":"Cardio","mode":"time","equipment":"Inne","primary":["czworogłowe uda"],"secondary":["łydki","dwugłowe uda"],"level":"średni","steps":["Dobierz długość skakanki: stojąc na jej środku, uchwyty powinny sięgać pach.","Kręć skakanką nadgarstkami, łokcie przy tułowiu.","Skacz nisko, lądując na przedniej części stóp."],"tips":["Krótkie, lekkie podskoki zamiast wysokich.","Dobra rozgrzewka albo interwały."]}]</script>

const SHARE_ABC = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';   // bez 0/O, 1/I/L – łatwo przepisać
const SHARE_RE = /^[2-9A-HJKMNP-Z]{6}$/;
const shareFmt = c => c.slice(0, 3) + '-' + c.slice(3);
const shareClean = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
const shareLink = c => location.origin + location.pathname + '?plan=' + c;
function shareNewCode(){ return [...crypto.getRandomValues(new Uint8Array(6))].map(x => SHARE_ABC[x % SHARE_ABC.length]).join(''); }
let SHARE_PENDING = null, shareBusy = false, shareKnown = null;
const shareSent = new Map();   // kod → treść ostatnio wysłana do bazy
try {
  const q = new URLSearchParams(location.search).get('plan');
  if (q){ SHARE_PENDING = shareClean(q); history.replaceState(null, '', location.pathname + location.hash); }
} catch {}
function sharePayload(p){
  const items = p.items.map(({id, ...it}) => it);
  const ids = new Set(items.map(i => i.exId));
  return clone({fid:FOLDER.id, from:FOLDER.name, plan:{name:p.name || '', items}, custom:S.custom.filter(c => ids.has(c.id)), updatedAt:Date.now()});
}
const shareKey = d => JSON.stringify([d.from, d.plan, d.custom]);
function shareSeen(){   // stan przyszedł z bazy – kody w nim są już zsynchronizowane
  if (!FOLDER) return;
  shareKnown = new Set();
  for (const p of S.plans) if (p.share){ shareKnown.add(p.share); shareSent.set(p.share, shareKey(sharePayload(p))); }
}
function syncShares(){
  if (!fireOn() || !store.ready) return;
  const now = new Set();
  for (const p of S.plans){
    if (!p.share || now.has(p.share)) continue;
    now.add(p.share);
    const d = sharePayload(p), k = shareKey(d);
    if (shareSent.get(p.share) === k) continue;
    shareSent.set(p.share, k);
    FB.setDoc(FB.doc(FB.db, 'shares', p.share), d).catch(() => shareSent.delete(p.share));
  }
  for (const c of shareKnown || []) if (!now.has(c)){ shareSent.delete(c); FB.deleteDoc(FB.doc(FB.db, 'shares', c)).catch(() => {}); }
  shareKnown = now;
}
// dane z cudzego kodu – nie ufamy im: tylko znane pola, rozsądne długości i limity
function shareSanitize(d){
  if (!d || typeof d !== 'object' || !d.plan || !Array.isArray(d.plan.items)) return null;
  const str = (v, n) => String(v ?? '').slice(0, n);
  const num = (v, a, b, def) => Number.isFinite(+v) && v !== null && v !== '' ? Math.min(b, Math.max(a, +v)) : def;
  const strs = v => Array.isArray(v) ? v.slice(0, 30).map(x => str(x, 300)) : [];
  const custom = (Array.isArray(d.custom) ? d.custom : []).filter(c => c && /^c_[a-z0-9]{1,30}$/.test(c.id)).slice(0, 60).map(c => ({
    id:c.id, name:str(c.name, 80) || 'Ćwiczenie', group:str(c.group, 40), equipment:str(c.equipment, 40), mode:c.mode === 'time' ? 'time' : 'reps',
    steps:strs(c.steps), tips:strs(c.tips), primary:strs(c.primary), secondary:strs(c.secondary), custom:true, level:str(c.level, 20)}));
  const items = d.plan.items.filter(it => it && typeof it.exId === 'string').slice(0, 60).map(it => ({
    exId:str(it.exId, 120), mode:it.mode === 'time' ? 'time' : 'reps',
    rest:num(it.rest, 0, LIM.sec, S.settings.restSet), restAfter:num(it.restAfter, 0, LIM.sec, S.settings.restEx), note:str(it.note, 500), ssNext:!!it.ssNext,
    sets:clampSets((Array.isArray(it.sets) ? it.sets : []).slice(0, MAX_SETS).filter(t => t && typeof t === 'object')
      .map(t => it.mode === 'time' ? {sec:num(t.sec, 0, LIM.sec, 30), kg:num(t.kg, 0, LIM.kg, null)} : {reps:num(t.reps, 0, LIM.reps, 10), kg:num(t.kg, 0, LIM.kg, null)}))}));
  if (!items.length) return null;
  return {from:str(d.from, 40), name:str(d.plan.name, 60), items, custom};
}

/* ---------- PIN folderu ----------
   folders/{id}.pin = true, gdy folder ma PIN; skrót PIN-u w folders/{id}/secret/pin (nikt go nie odczyta).
   Urządzenie dostaje dostęp, zapisując folders/{id}/members/{uid} z tym samym skrótem – reguły bazy porównują go z sekretem.
   Reset (zapomniany PIN): w konsoli Firebase usuń dokument secret/pin i pole pin w folderze – wtedy można ustawić nowy. */
const accKey = fid => `dz.acc.${fid}`;
async function pinHash(fid, pin){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`dziennik-silowni:${fid}:${pin}`));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function pinMode(s){
  if (s.del) return 'del';
  if (s.isNew) return 'new';
  const f = FOLDERS.find(x => x.id === s.id);
  if (f) return f.pin ? 'enter' : 'set';
  return store.foldersReady ? 'set' : 'wait';
}
function askPin(f, isNew=false){

}
async function requestFolder(f, skipCheck=false){
  if (!skipCheck && LS.get(accKey(f.id), false)){ openFolder(f); return; }
  if (!skipCheck && FB.uid){
    try {
      const m = await FB.getDoc(FB.doc(FB.db, 'folders', f.id, 'members', FB.uid));
      if (m.exists()){ LS.set(accKey(f.id), true); openFolder(f); return; }
    } catch {}
  }
  askPin(f);
}

  if (!store.foldersReady) h += `<div class="card muted">${store.fireError ? 'Nie udało się połączyć z bazą. Sprawdź połączenie z internetem.' : 'Wczytuję konta…'}</div>`;

async function initStore(){
  if (FIRE){
    render();
    try { await initFirebase(); }
    catch { store.fireError = true; render(); return; }
    watchFolders();
    if (FOLDER){ const f = FOLDER; if (LS.get(accKey(f.id), false)) openFolder(f); else { closeFolder(); render(); requestFolder(f); } }
    return;
  }
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]); } catch {}
  let id = null;
  try { id = user ? await user.id() : null; } catch {}
  if (!db || !id){ store.mode = 'local'; store.ready = true; render(); return; }
  store.mode = 'cloud'; store.db = db; store.uid = id;
  store.ref = db.doc('data/users/' + id + '/state');
  store.col = store.ref.collection('sessions');
  const slow = setTimeout(() => { store.slow = true; render(); }, 10000);
  const settle = () => { clearTimeout(slow); store.slow = false; };
  store.ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) settle();
    if (!snap.exists){
      if (!snap.metadata.fromCache){
        if (!store.ready && hasData(S) && !LS.get('dz.migState', false)){ LS.set('dz.migState', true); store.dirty = true; flush(); }
        store.ready = true; render();
      }
      return;
    }
    const first = !store.ready; store.ready = true;
    if (store.dirty || store.writing){ return; }
    const inc = normalize(snap.data());
    if (JSON.stringify(inc) !== JSON.stringify(S)){ S = inc; LS.set('dz.state', S); render(); }
    else if (first) render();
  }, () => { settle(); store.mode = 'local'; store.ready = true; toast('Synchronizacja niedostępna. Dane zapisują się w tej przeglądarce.'); render(); });
  store.col.orderBy('date', 'desc').limit(1000).onSnapshot(async snap => {
    if (snap.metadata.fromCache && snap.empty) return;
    const cloud = snap.docs.map(d => ({...d.data(), id:d.id}));
    if (!snap.metadata.fromCache && !LS.get('dz.migSess', false)){
      LS.set('dz.migSess', true);
      const ids = new Set(cloud.map(s => s.id));
      for (const s of SESS.filter(s => !ids.has(s.id))){ try { await store.col.doc(s.id).set(s); cloud.push(s); } catch {} }
    }
    cloud.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (JSON.stringify(cloud) === JSON.stringify(SESS)) return;
    SESS = cloud; LS.set('dz.sessions', SESS);
    render();
  }, () => {});
}

/* ---------- TRENING (start) ---------- */
// rekord z listy serii: na czas → najdłuższa; z ciężarem → najcięższa (przy remisie więcej powt.); bez ciężaru → najwięcej powt.
function setBest(sets, mode){
  let b = null;
  for (const t of sets || []){
    const v = mode === 'time' ? {sec:t.sec || 0} : {kg:t.kg || 0, reps:t.reps || 0};
    if (!b || recBetter(v, b, mode)) b = v;
  }
  return b && (mode === 'time' ? b.sec > 0 : (b.kg > 0 || b.reps > 0)) ? b : null;
}
function recBetter(a, b, mode){ return mode === 'time' ? a.sec > b.sec : a.kg > b.kg + 1e-9 || (Math.abs(a.kg - b.kg) < 1e-9 && a.reps > b.reps); }
function recText(r, mode){ return mode === 'time' ? fmtN(r.sec) + ' s' : r.kg ? fmtN(r.kg) + ' kg × ' + r.reps : r.reps + ' powt.'; }
// najlepszy wynik w ćwiczeniu z historii (opcjonalnie tylko treningi przed datą `before`, bez treningu `excludeId`)
function recordFor(exId, mode, before, excludeId){
  let b = null;
  for (const s of SESS){
    if (s.id === excludeId || (before && String(s.date) >= String(before))) continue;
    for (const x of s.ex || []){ if (x.exId !== exId || (x.mode === 'time') !== (mode === 'time')) continue; const r = setBest(x.sets, mode); if (r && (!b || recBetter(r, b, mode))) b = r; }
  }
  return b;
}
function lastFor(exId, excludeId){
  for (const s of SESS){ if (s.id === excludeId) continue; const x = (s.ex || []).find(e => e.exId === exId); if (x && x.sets && x.sets.length) return {date:s.date, mode:x.mode, sets:x.sets, note:x.note || ''}; }
  return null;
}

function setsSummary(it){
  const s = it.sets || []; if (!s.length) return 'brak serii';
  const same = (f) => s.every(x => x[f] === s[0][f]);
  let main;
  if (it.mode === 'time') main = same('sec') ? `${s.length} × ${s[0].sec ?? '–'} s` : s.map(x => (x.sec ?? '–')).join('/') + ' s';
  else main = same('reps') ? `${s.length} × ${s[0].reps ?? '–'}` : s.map(x => x.reps ?? '–').join('/');
  const kgs = s.map(x => x.kg).filter(v => v != null);
  if (kgs.length) main += ' · ' + (same('kg') ? fmtN(s[0].kg) : s.map(x => x.kg == null ? '–' : fmtN(x.kg)).join('/')) + ' kg';
  return main + ' · przerwa ' + fmtRest(it.rest ?? S.settings.restSet);
}

   Ćwiczenia z tej samej grupy zostają w kolejności wybranej przez użytkownika. */
const ORDER_TIERS = [
  [0, 'dynamiczne, na świeżo', 'One-Arm_Kettlebell_Swings'],

  [30, 'izolowane, duże partie', 'Dumbbell_Flyes Incline_Dumbbell_Flyes Cable_Crossover Butterfly Straight-Arm_Dumbbell_Pullover Straight-Arm_Pulldown Hyperextensions_Back_Extensions Side_Lateral_Raise Standing_Low-Pulley_Deltoid_Raise Front_Dumbbell_Raise Reverse_Flyes Reverse_Machine_Flyes Upright_Barbell_Row Leg_Extensions Lying_Leg_Curls Seated_Leg_Curl Single_Leg_Glute_Bridge One-Legged_Cable_Kickback Thigh_Abductor Thigh_Adductor'],
  [40, 'izolowane, małe partie', 'Barbell_Curl EZ-Bar_Curl Dumbbell_Alternate_Bicep_Curl Hammer_Curls Incline_Dumbbell_Curl Preacher_Curl Concentration_Curls Standing_Biceps_Cable_Curl Triceps_Pushdown Triceps_Pushdown_-_Rope_Attachment Cable_Rope_Overhead_Triceps_Extension EZ-Bar_Skullcrusher Standing_Dumbbell_Triceps_Extension Tricep_Dumbbell_Kickback Bench_Dips Standing_Calf_Raises Seated_Calf_Raise Calf_Press_On_The_Leg_Press_Machine Barbell_Shrug Dumbbell_Shrug'],
