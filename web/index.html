<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plan treningowy, baza ćwiczeń z opisem techniki, timer przerw i historia postępów.">
<meta name="theme-color" content="#E8EBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Siłownia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dziennik siłowni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Układ: aplikacja mobilna w jednej kolumnie (max 680 px) z dolnym paskiem zakładek;
   trening to pełnoekranowa nakładka z przyklejonym paskiem timera przerw. */
:root{
  --bg:#E8EBEE; --surface:#FFFFFF; --surface-2:#F2F4F6; --ink:#13171B; --ink-2:#434C55; --muted:#646D76; --line:#D2D7DC;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DDE6FB;
  --good:#15784A; --good-ink:#FFFFFF; --good-soft:#D7EFE2; --bad:#B42318; --bad-soft:#FBE2DE;
  --tb-bg:#13171B; --tb-ink:#F2F4F6; --tb-muted:#A3ACB5; --tb-line:#3A4148; --tb-warn:#F2C230; --tb-over:#2FA36B; --tb-over-ink:#06150D;
  --plate-25:#C8102E; --plate-20:#1D4ED8; --plate-15:#E5B000; --plate-10:#178A45; --plate-5:#F4F4F1; --plate-s:#3B4148;
  --scrim:rgba(10,14,18,.45);
  --body:#DCE1E6; --body-line:#BCC4CC; --muscle:#C3CBD3; --hl:#D7263D; --hl2:#F2A0AB;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --surface:#171B1F; --surface-2:#1F2429; --ink:#ECEFF2; --ink-2:#BCC4CB; --muted:#8C969F; --line:#2B3238;
  --accent:#7D9DFF; --accent-ink:#0A1024; --accent-soft:#1C2847;
  --good:#4CC386; --good-ink:#06150D; --good-soft:#12301F; --bad:#FF8B7B; --bad-soft:#3A1714;
  --tb-bg:#E6EAEE; --tb-ink:#101316; --tb-muted:#56606A; --tb-line:#C3CAD1; --tb-warn:#8A5A00; --tb-over:#4CC386; --tb-over-ink:#06150D;
  --plate-5:#E9E9E4; --plate-s:#59616A; --scrim:rgba(0,0,0,.6); --body:#2A3137; --body-line:#3A434B; --muscle:#3B444C; --hl:#FF4D62; --hl2:#8E3A46; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#171B1F; --surface-2:#1F2429; --ink:#ECEFF2; --ink-2:#BCC4CB; --muted:#8C969F; --line:#2B3238;
  --accent:#7D9DFF; --accent-ink:#0A1024; --accent-soft:#1C2847;
  --good:#4CC386; --good-ink:#06150D; --good-soft:#12301F; --bad:#FF8B7B; --bad-soft:#3A1714;
  --tb-bg:#E6EAEE; --tb-ink:#101316; --tb-muted:#56606A; --tb-line:#C3CAD1; --tb-warn:#8A5A00; --tb-over:#4CC386; --tb-over-ink:#06150D;
  --plate-5:#E9E9E4; --plate-s:#59616A; --scrim:rgba(0,0,0,.6); --body:#2A3137; --body-line:#3A434B; --muscle:#3B444C; --hl:#FF4D62; --hl2:#8E3A46; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}

/* pasek górny */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.appbar .wrap{display:flex;align-items:flex-end;gap:12px;padding-block:14px 10px}
.appbar .ttl{flex:1;min-width:0}
.brand{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.appbar h1{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
.iconbtn.sm{width:36px;height:36px;border-radius:9px}
.iconbtn.plain{border-color:transparent;background:transparent}
.who{display:inline-flex;align-items:center;gap:6px;max-width:42vw;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* zakładki */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;text-decoration:none}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* przyciski i pola */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.fill{background:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;padding:0 8px}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.field{display:grid;gap:6px}
.lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.input{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:96px;resize:vertical;line-height:1.4}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:42px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper b{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

/* sekcje, karty */
main{padding-block:2px 28px}
.sec-h{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 0;display:flex;align-items:baseline;gap:8px}
.sec-h .n{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:12px}
.empty h2{font-family:var(--f-display);font-size:26px;text-transform:uppercase;line-height:1;margin:0}
.empty p{margin:0;color:var(--ink-2);max-width:52ch}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

/* miniatury i animacja ruchu */
.thumb{display:block;width:60px;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:#fff;border:1px solid var(--line);flex:none}
.thumb img{display:block;width:100%;height:auto}
.thumb.ph{display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--muted)}
.media{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.media .frames{display:block;position:relative;aspect-ratio:3/2;overflow:hidden}
.media .frames img{position:absolute;left:0;top:0;width:100%;height:auto}
.media .frames img.b{transform:translateY(-50%);animation:frame 2.8s ease-in-out infinite}
@keyframes frame{0%,36%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
.media.paused .frames img.b{animation-play-state:paused}
.media .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.media .ctl button{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:rgba(19,23,27,.78);color:#fff;font-size:12.5px;font-weight:600}
.media .ph-big{aspect-ratio:3/2;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-family:var(--f-display);font-size:48px;font-weight:800}
@media (prefers-reduced-motion: reduce){
  .media .frames img.b{animation:none;opacity:0}
  .media.show-b .frames img.b{opacity:1}
}

/* lista ćwiczeń */
.exlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.exlist > :first-child, .exlist > :first-child .exrow{border-top:0}
.exrow .nm{font-weight:600;line-height:1.25}
.exrow .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted)}
.pickrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--line)}
.pickrow .exrow{border-top:0}
.pickrow.sel{background:var(--accent-soft)}
.pickrow .info{margin-right:8px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pickrow.sel .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* szczegóły ćwiczenia */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.ex-title{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;margin:0}
.h3{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;margin:6px 0 0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;color:var(--accent)}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.muscles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.muscles dt{color:var(--muted)} .muscles dd{margin:0;font-weight:600}
.bodymap{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 8px 6px}
.bodymap svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.bodymap .sil{fill:var(--body)} .bodymap .lb{stroke:var(--body);stroke-linecap:round;fill:none}
.bodymap .m{fill:var(--muscle);stroke:var(--body-line);stroke-width:.6}
.bodymap .m.p1{fill:var(--hl)} .bodymap .m.p2{fill:var(--hl2)}
.bodymap .sep{stroke:var(--body);stroke-width:1.4}
.bodymap text{fill:var(--muted);font:600 9px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* plany */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan-h{display:flex;align-items:center;gap:8px;padding:12px 14px}
.plan-h h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.dayrow .dn{font-weight:700}
.plan > .dayrow:first-child,.day > .item:first-child{border-top:0}
.plan-link{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.dayrow .dm{font-size:12.5px;color:var(--muted)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 14px}
.day-h{display:flex;gap:6px;align-items:center;padding-block:10px}
.day-h .input{font-weight:700}
.item{border-top:1px solid var(--line)}
.item-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;background:none;text-align:left}
.item-h .nm{font-weight:600;line-height:1.25}
.item-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.item-b{display:grid;gap:14px;padding:4px 0 16px}
.ptable{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.prow.head{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prow .input{text-align:center;font-variant-numeric:tabular-nums;padding:8px}
.prow .sn{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.rests{display:grid;gap:8px}
.rests > div{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oc{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.oc p{margin:0;color:var(--ink-2)}
.oc .row{flex-wrap:wrap}
.oc-h{display:flex;gap:8px;align-items:center;color:var(--accent)}
.oc-h b{color:var(--ink);font-size:15px}
.oc.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.oc.ok .oc-h{color:var(--good)}
.oc.mine{background:none;border:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 6px 6px 14px}
.oc-list{margin:0;padding:0;list-style:none;counter-reset:oc;display:grid;gap:2px;background:var(--surface);border-radius:10px;padding:4px 0}
.oc-list li{counter-increment:oc;display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:7px 10px}
.oc-list li::before{content:counter(oc) ".";grid-row:span 2;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;align-self:start}
.oc-list .nm{font-weight:600;line-height:1.25;grid-column:2}
.oc-list .osub{grid-column:2;font-size:12px;color:var(--muted)}
.oc-list .mv{grid-column:3;grid-row:1 / span 2;display:inline-flex;align-items:center;gap:1px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 6px 2px 2px;border-radius:999px}
.oc-list .mv .i{width:16px;height:16px}
.oc-list .mv.up{color:var(--good);background:var(--good-soft)}
.oc-list .mv.dn{color:var(--ink-2);background:var(--surface-2)}
.oc-list li.moved .nm{color:var(--ink)}
.oc-list li:not(.moved) .nm{color:var(--ink-2);font-weight:500}
.oc-why{margin:0;padding-left:18px;display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.oc-why b{color:var(--ink)}

/* trening na żywo */
.live{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px}
.live .t{flex:1;min-width:0}
.live b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;line-height:1.05}
.live .btn{background:var(--bg);color:var(--ink);border-color:transparent}
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.wo-h{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.wo-h .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.wo-t{flex:1;min-width:0}
.wo-t b{display:block;font-family:var(--f-display);font-size:23px;font-weight:800;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-t span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wo-list{padding-block:14px 12px}
.wo-end{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.wex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.wex.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.wex-h .nm{font-weight:700;line-height:1.2;background:none;border:0;padding:0;text-align:left}
.wex-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.wex.alldone .wex-h .nm{color:var(--muted)}
.last{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) 70px 64px 50px;gap:6px;align-items:center}
.srow.head{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.srow.head span:nth-child(n+3){text-align:center}
.srow .n{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.srow .tgt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow input{min-height:44px;width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px}
.srow input::placeholder{font-weight:500;font-size:13px;color:var(--muted)}
.srow.done input{background:var(--good-soft);border-color:transparent}
.chk{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.chk.run{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plates{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.plate{display:inline-grid;place-items:center;min-width:32px;height:22px;padding:0 5px;border-radius:4px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.p25{background:var(--plate-25)} .p20{background:var(--plate-20)} .p15{background:var(--plate-15);color:#1b1500} .p10{background:var(--plate-10)}
.p5{background:var(--plate-5);color:#1b1d20;box-shadow:inset 0 0 0 1px var(--line)} .ps{background:var(--plate-s)}
.wex-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wex-f .stepper{margin-left:auto;font-size:13px;color:var(--muted)}
.wex-f .stepper b{min-width:58px;color:var(--ink)}

/* pasek timera */
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--tb-bg);color:var(--tb-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tbar .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:10px 12px}
.tb-lbl{font-size:12.5px;font-weight:600;color:var(--tb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-time{font-weight:800;font-stretch:115%;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tbar.idle .tb-time{color:var(--tb-muted)}
.tbar.soon .tb-time{color:var(--tb-warn)}
.tbar.over{background:var(--tb-over);color:var(--tb-over-ink)}
.tbar.over .tb-lbl{color:var(--tb-over-ink)}
.tb-btns{display:flex;gap:6px}
.tbtn{min-width:50px;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--tb-line);background:transparent;color:inherit;font-weight:700;font-variant-numeric:tabular-nums}
.tbtn.main{background:var(--tb-ink);color:var(--tb-bg);border-color:var(--tb-ink)}
.tbar.over .tbtn{border-color:var(--tb-over-ink)}
.tbar.over .tbtn.main{background:var(--tb-over-ink);color:var(--tb-over)}
.tb-prog{grid-column:1/-1;height:4px;border-radius:2px;background:var(--tb-line);overflow:hidden}
.tb-prog i{display:block;height:100%;width:0;background:currentColor}

/* arkusz (bottom sheet) */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0;padding:0}
.sheet{position:relative;width:100%;max-width:680px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  display:grid;gap:14px;align-content:start}
.sheet-end{height:calc(6px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:8px;padding-block:14px 8px}
.sheet-h h2{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase}
.sheet-f{position:sticky;bottom:0;z-index:2;background:var(--surface);padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}

/* historia i wykresy */
.sess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.exlist > .sess:first-child{border-top:0}
.sess .d{font-weight:700}
.sess .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sess .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:540px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-weight:800;font-stretch:110%;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px}
.chart-card h3{margin:0 0 6px;font-size:14px;font-weight:700}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;max-width:100%}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart text.end{fill:var(--ink);font-weight:700;font-size:12px}
.chart .xh{stroke:var(--ink-2);stroke-width:1}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:2}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right}
.set-list{display:flex;flex-wrap:wrap;gap:6px}
.set-list span{font-size:13px;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
/* animacje ćwiczeń */
.media.anim{background:var(--surface-2);display:grid;overflow:visible;flex:none}
.anim-stage{display:block;aspect-ratio:320/214}
.anim-stage svg{display:block;width:100%;height:100%}
.anim-ctl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 8px 0}
.anim-ctl input[type=range]{width:100%;min-width:0;accent-color:var(--accent);height:32px}
.anim-ctl .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.anim-ph{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 12px 0;font-variant-numeric:tabular-nums}
.anim-ph b{color:var(--ink);font-weight:600}
.anim-note{margin:0;padding:4px 12px 10px;font-size:12px;color:var(--muted);line-height:1.4}
.anim-note i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--a-hl);vertical-align:-1px;margin-right:4px}
.thumb.at{background:var(--surface-2)}
.thumb.at svg{display:block;width:100%;height:100%}
/* kolory animacji ćwiczeń */
:root{
  --a-fig:#2B3138; --a-far:#8A939C; --a-ghost:#9AA3AC; --a-hl:#D7263D; --a-hlf:#EC8E9B;

}

  --a-fig:#E3E7EB; --a-far:#6D7680; --a-ghost:#58616A; --a-hl:#FF4D62; --a-hlf:#A43C4C;
  --a-metal:#AEB6BE; --a-plate:#AEB6BE; --a-hub:#2B3238; --a-pad:#4E5761; --a-leg:#3A424A;
  --a-mach:#242A30; --a-frame:#4A535C; --a-cable:#8C969F; --a-band:#FF9A2E; --a-floor:#343B42; --a-trail:#7D9DFF;
}}
:root[data-theme="dark"]{
  --a-fig:#E3E7EB; --a-far:#6D7680; --a-ghost:#58616A; --a-hl:#FF4D62; --a-hlf:#A43C4C;
  --a-metal:#AEB6BE; --a-plate:#AEB6BE; --a-hub:#2B3238; --a-pad:#4E5761; --a-leg:#3A424A;

<body>


<header class="appbar"><div class="wrap" id="appbar"></div></header>
<main id="view"></main>
<nav class="tabbar" aria-label="Zakładki"><div class="wrap" id="tabbar"></div></nav>
<div class="wo" id="workout" hidden></div>
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <button class="scrim" data-act="closeSheet" aria-label="Zamknij" tabindex="-1"></button>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>/* Animacje ćwiczeń: schematyczna postać w 3D rzutowana na płaszczyznę i rysowana jako SVG.
   Każde ćwiczenie = klatki kluczowe (kąty segmentów albo punkty docelowe dłoni/stóp) + sprzęt.
   API: ANIM.has(id), ANIM.svg(id, u, opt), ANIM.info(id, u), ANIM.dur(id), ANIM.thumb(id). */
const ANIM = (() => {
'use strict';
const RAD = Math.PI / 180;
const cos = d => Math.cos(d * RAD), sin = d => Math.sin(d * RAD);
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp = (a, b, t) => a + (b - a) * t;
const lerpA = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
function rot(v, k, deg){
  const c = cos(deg), s = sin(deg), kv = cross(k, v), d = dot(k, v) * (1 - c);
  return [v[0] * c + kv[0] * s + k[0] * d, v[1] * c + kv[1] * s + k[1] * d, v[2] * c + kv[2] * s + k[2] * d];
}
const X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
const WORLD = {F:X, T:Y, S:Z};
// Wymiary ciała (1 jednostka ≈ 1,1 cm).
const B = {lumbar:22, thor:28, neck:6, head:10.5, ua:28, fa:30, thigh:40, shank:38, toe:15, heel:5, sh:15, hp:9};
const SIDES = [['R', 1], ['L', -1]];

/* ---------- kinematyka ---------- */
function ik(base, target, l1, l2, pole){
  const d = sub(target, base); let dist = len(d);
  const dn = dist > 1e-6 ? mul(d, 1 / dist) : [0, -1, 0];
  dist = Math.min(l1 + l2 - 0.001, Math.max(Math.abs(l1 - l2) + 0.001, dist));
  let pp = sub(pole, mul(dn, dot(pole, dn)));
  if (len(pp) < 1e-6) pp = Math.abs(dn[1]) < 0.9 ? sub(Y, mul(dn, dn[1])) : sub(X, mul(dn, dn[0]));
  pp = unit(pp);
  const a = (l1 * l1 + dist * dist - l2 * l2) / (2 * dist);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  return {mid:add(add(base, mul(dn, a)), mul(pp, h)), end:add(base, mul(dn, dist))};
}
function dirOf(a, b, s, fr){
  const ca = cos(a), sa = sin(a), cb = cos(b), sb = sin(b);
  return add(add(mul(fr.F, cb * ca), mul(fr.T, cb * sa)), mul(fr.S, s * sb));
}
const DIRS = ['F', 'T', 'S', 'Fu', 'Tu', 'Su'];
const frameOf = (P, f) => f === 'u' ? {F:P.Fu, T:P.Tu, S:P.Su} : f === 't' ? {F:P.F, T:P.T, S:P.S} : WORLD;
function relPoint(P, spec, side, s){
  const v = spec.ik;
  if (!spec.rel) return v;
  if (spec.rel === 'sh') return add(P['sh' + side], v);
  if (spec.rel === 'hip') return add(P['hip' + side], v);
  const fr = frameOf(P, spec.rel), o = spec.rel === 'u' ? P.shC : P.hipC;
  return add(o, add(add(mul(fr.F, v[0]), mul(fr.T, v[1])), mul(fr.S, v[2])));
}
function poleOf(P, spec, isArm){
  if (!spec.pole) return isArm ? add(mul(P.Tu, -1), mul(P.Fu, -0.25)) : [1, 0.25, 0];
  if (!spec.prel) return spec.pole;
  const fr = frameOf(P, spec.prel), v = spec.pole;
  return add(add(mul(fr.F, v[0]), mul(fr.T, v[1])), mul(fr.S, v[2]));
}

function solve(p){
  const P = {};
  const hip = p.hip ? [...p.hip] : [0, 0, 0];
  let T = [cos(p.torso ?? 90), sin(p.torso ?? 90), 0], S = [...Z];
  let F = cross(T, S);
  if (p.lean){ T = rot(T, F, p.lean); S = rot(S, F, p.lean); }
  const mid = add(hip, mul(T, B.lumbar));
  const Tu = p.flex ? rot(T, S, -p.flex) : T;
  const Su = p.twist ? rot(S, Tu, -p.twist) : S;
  const Fu = cross(Tu, Su);
  const shC = add(mid, mul(Tu, B.thor));
  const up = mul(Tu, p.shrug || 0);
  Object.assign(P, {F, T, S, Fu, Tu, Su, hipC:hip, mid, shC});
  P.shR = add(add(shC, mul(Su, B.sh)), up); P.shL = add(sub(shC, mul(Su, B.sh)), up);
  P.midR = add(mid, mul(S, B.hp + 2)); P.midL = sub(mid, mul(S, B.hp + 2));
  P.hipR = add(hip, mul(Z, B.hp)); P.hipL = sub(hip, mul(Z, B.hp));
  const Tn = p.neck ? rot(Tu, Su, p.neck) : Tu;
  P.neckT = add(shC, mul(Tn, B.neck));
  P.head = add(P.neckT, mul(Tn, B.head * 0.85));
  P.face = add(P.head, mul(cross(Tn, Su), B.head));
  // Kończyny zadane kątami (przed obrotem całego ciała).
  const limbs = [];
  for (const [side, s] of SIDES){
    for (const kind of ['arm', 'leg']){
      const spec = p[kind + side]; if (!spec) continue;
      const isArm = kind === 'arm';
      const root = P[(isArm ? 'sh' : 'hip') + side];
      const l1 = isArm ? B.ua : B.thigh, l2 = isArm ? B.fa : B.shank;
      const fk = sp => {
        const fr = sp.rel === true || sp.rel === 'u' ? (isArm ? {F:Fu, T:Tu, S:Su} : {F, T, S}) : sp.rel === 't' ? {F, T, S} : WORLD;
        const m = add(root, mul(dirOf(sp.a, sp.b || 0, s, fr), l1));
        return [m, add(m, mul(dirOf(sp.a2 ?? sp.a, sp.b2 ?? sp.b ?? 0, s, fr), l2))];
      };
      if (spec.mix){
        spec.mix.forEach((sp, i) => { if (sp.ik === undefined) P['_e' + i + kind + side] = fk(sp)[1]; });
        limbs.push({side, s, kind, spec, isArm, l1, l2});
      } else if (spec.ik === undefined){
        const [m, e] = fk(spec);
        P[(isArm ? 'elb' : 'knee') + side] = m; P[(isArm ? 'grip' : 'ankle') + side] = e;
        if (!isArm) footOf(P, side, s, spec, null);
      } else limbs.push({side, s, kind, spec, isArm, l1, l2});
    }
  }
  // Obrót całej postaci wokół bioder.
  let R = null;
  if (p.rot){
    const [rx, ry, rz] = p.rot;
    R = v => { let w = v; if (rz) w = rot(w, Z, rz); if (rx) w = rot(w, X, rx); if (ry) w = rot(w, Y, ry); return w; };
    for (const k in P){ if (DIRS.includes(k)) P[k] = R(P[k]); else P[k] = add(hip, R(sub(P[k], hip))); }
  }
  // Zakotwiczenie wybranego punktu (np. stopy na podłodze).
  if (p.anchor){
    const {j, at} = p.anchor;
    let cur;
    if (j === 'ankles') cur = lerpA(P.ankleR, P.ankleL, 0.5);
    else if (j === 'low'){ const m = Math.min(...['toeR', 'toeL', 'heelR', 'heelL'].filter(k => P[k]).map(k => P[k][1])); cur = [0, m, 0]; }
    else cur = P[j];
    const off = j === 'low' ? [0, at[1] - cur[1], 0] : [at[0] - cur[0], at[1] - cur[1], at.length > 2 ? at[2] - cur[2] : 0];
    for (const k in P) if (!DIRS.includes(k)) P[k] = add(P[k], off);
  }
  // Kończyny prowadzone do punktu (IK) albo mieszane między dwiema klatkami.
  for (const L of limbs){
    const {side, s, kind, spec, isArm, l1, l2} = L;
    const root = P[(isArm ? 'sh' : 'hip') + side];
    let target, pole;
    if (spec.mix){
      const ends = spec.mix.map((sp, i) => sp.ik === undefined ? P['_e' + i + kind + side] : relPoint(P, sp, side, s));
      target = lerpA(ends[0], ends[1], spec.t);
      const poles = spec.mix.map(sp => sp.ik === undefined ? null : poleOf(P, sp, isArm));
      pole = poles[0] && poles[1] ? lerpA(poles[0], poles[1], spec.t) : poles[0] || poles[1];
    } else { target = relPoint(P, spec, side, s); pole = poleOf(P, spec, isArm); }
    const r = ik(root, target, l1, l2, pole);
    P[(isArm ? 'elb' : 'knee') + side] = r.mid; P[(isArm ? 'grip' : 'ankle') + side] = r.end;
    if (!isArm) footOf(P, side, s, spec, R);
  }
  for (const k in P) if (k[0] === '_') delete P[k];
  return P;
}
function footOf(P, side, s, spec, R){
  let d = dirOf(spec.f || 0, spec.fb ?? 6, s, WORLD);
  if (R) d = R(d);

    props:(P, t, K) => { const out = [K.box([4, 6, 0], [140, 12, 40], 0, 'a-env', {d:-260}), K.line([62, 10, 0], [56, 140, 0], 6, 'a-fr', {d:-250}), K.box([56, 144, 0], [12, 14, 40], 0, 'a-mach', {d:-245})];
      for (const s of ['R', 'L']){ const sg = s === 'R' ? 1 : -1, a = P['ankle' + s], g = P['grip' + s];

}
