  [51, 'brzuch', 'Crunches Reverse_Crunch Russian_Twist Dead_Bug Pallof_Press'],
  [52, 'brzuch, izometria', 'Plank Side_Bridge'],
  [60, 'kondycja', 'Battling_Ropes Farmers_Walk Mountain_Climbers'],
  [70, 'cardio', 'Running_Treadmill Bicycling_Stationary Rowing_Stationary Elliptical_Trainer Rope_Jumping'],
];
const ORD = new Map(); const ORD_LABEL = new Map();
for (const [o, label, ids] of ORDER_TIERS){ if (!ORD_LABEL.has(o)) ORD_LABEL.set(o, label); for (const id of ids.split(' ')) ORD.set(id, o); }
function exOrd(e){
  if (ORD.has(e.id)) return ORD.get(e.id);
  // Własne ćwiczenia: zgadujemy po grupie, sprzęcie i nazwie.
  const n = norm(e.name);
  if (e.group === 'Cardio') return 70;
  if (e.group === 'Całe ciało') return 60;
  if (e.group === 'Brzuch') return e.mode === 'time' ? 52 : 51;
  if (['Biceps','Triceps','Łydki'].includes(e.group)) return /wyciskanie|pompki|porecz|dips/.test(n) ? 28 : 40;
  if (/rozpietk|unoszenie|prostowanie|uginanie|wspiecia|odwodzenie|przywodzenie|szrugs|kickback|face ?pull|rotacja|izolow/.test(n)) return 30;
  if (e.equipment === 'Maszyna' || e.equipment === 'Wyciąg') return 25;
  if (e.equipment === 'Sztanga' && /przysiad|martwy|wyciskanie|wioslowanie/.test(n)) return 10;
  return 20;
}
const ordLabel = o => ORD_LABEL.get(o) || '';
const orderSig = p => p.items.map(i => i.id).join(',');
function suggestOrder(p){
  const keyed = p.items.map((it, i) => ({it, i, o:exOrd(getEx(it.exId))}));
  const sorted = [...keyed].sort((a, b) => a.o - b.o || a.i - b.i);
  return {sorted, changed:sorted.some((x, k) => x.i !== k)};
}
function vOrderHint(p){
  if (p.items.length < 2) return '';
  const {sorted, changed} = suggestOrder(p);
  const why = ui.orderWhy ? `<ul class="oc-why">
      <li><b>Najcięższe wielostawowe na początku.</b> Przysiad, martwy ciąg i wyciskania wymagają najwięcej siły i techniki. Na świeżo podniesiesz więcej i zrobisz to bezpieczniej.</li>
      <li><b>Wolne ciężary przed maszynami.</b> Sztanga i hantle angażują mięśnie stabilizujące, które męczą się najszybciej. Maszyna prowadzi ruch, więc dobrze sprawdza się później.</li>
      <li><b>Wielostawowe przed izolowanymi, duże partie przed małymi.</b> Zmęczony biceps osłabi wiosłowanie, a zmęczony triceps wyciskanie. Odwrotnie to nie działa.</li>
      <li><b>Brzuch pod koniec.</b> Mięśnie brzucha stabilizują tułów w ciężkich ćwiczeniach. Zmęczone zwiększają ryzyko kontuzji kręgosłupa.</li>
      <li><b>Cardio na końcu.</b> Nie zabiera siły do ćwiczeń z ciężarem. Krótka rozgrzewka (5–10 minut) na początku jest jak najbardziej w porządku.</li>
    </ul>` : '';
  const whyBtn = `<button class="btn sm ghost" data-act="orderWhy" aria-expanded="${!!ui.orderWhy}">${ui.orderWhy ? 'Ukryj wyjaśnienie' : 'Dlaczego tak?'}</button>`;
  if (!changed){
    const core = sorted.some(x => x.o >= 50 && x.o < 60), cardio = sorted.some(x => x.o >= 60);
    const tail = core && cardio ? ', brzuch i cardio na końcu' : core ? ', brzuch na końcu' : cardio ? ', kondycja i cardio na końcu' : '';
    return `<div class="oc ok"><div class="oc-h">${svg('check','i s')}<b>Kolejność jest optymalna</b></div>

  }
  if (p.orderOk === orderSig(p)) return `<div class="oc mine"><span class="small muted">Zostawiasz własną kolejność ćwiczeń.</span><button class="btn sm ghost" data-act="orderShow" data-plan="${p.id}">Pokaż sugestię</button></div>`;
  let list = '';
  sorted.forEach((x, k) => {
    const d = x.i - k;
    const mv = d > 0 ? `<span class="mv up" aria-label="w górę o ${d}">${svg('up','i s')}${d}</span>` : d < 0 ? `<span class="mv dn" aria-label="w dół o ${-d}">${svg('down','i s')}${-d}</span>` : '';
    list += `<li class="${d ? 'moved' : ''}"><span class="nm">${esc(getEx(x.it.exId).name)}</span><span class="osub">${esc(ordLabel(x.o))}</span>${mv}</li>`;
  });
  return `<div class="oc"><div class="oc-h">${svg('<path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M13 6h8M13 11h6M13 16h4"/>','i s')}<b>Sugerowana kolejność</b></div>
    <p class="small">Tak ułożony trening pozwoli dźwigać więcej przy mniejszym ryzyku kontuzji.</p>
    <ol class="oc-list">${list}</ol>
    <div class="row"><button class="btn primary sm" data-act="orderApply" data-plan="${p.id}">Ułóż w tej kolejności</button><button class="btn sm ghost" data-act="orderKeep" data-plan="${p.id}">Zostaw moją</button>${whyBtn}</div>${why}</div>`;
}

/* ---------- ĆWICZENIA ---------- */
function allEx(){ return [...EX, ...S.custom]; }
// dodatkowe hasła do wyszukiwarki (inne nazwy, po angielsku)
const EX_ALIAS = {Lying_Leg_Curls:'prone leg curl leg curl', 'Lying_T-Bar_Row':'chest supported t-bar row podparcie'};
function filterEx(q, group, equip){
  const nq = norm(q).trim();
  return allEx().filter(e => (!group || e.group === group) && (!equip || e.equipment === equip) &&
    (!nq || norm([e.name, e.en, e.group, e.equipment, EX_ALIAS[e.id] || '', ...(e.primary || [])].join(' ')).includes(nq)));
}
function groupedRows(list, rowFn){
  let h = '';
  for (const g of GROUPS){
    const items = list.filter(e => e.group === g).sort((a, b) => ORDER(a) - ORDER(b));
    if (!items.length) continue;
    h += `<h2 class="sec-h">${esc(g)} <span class="n">${items.length}</span></h2><div class="exlist">${items.map(rowFn).join('')}</div>`;
  }
  return h || `<p class="muted" style="margin-top:16px">Brak ćwiczeń pasujących do wyszukiwania.</p>`;
}
const ORDER = e => { const k = EX.indexOf(EXMAP.get(e.id)); return k < 0 ? 1e6 + S.custom.indexOf(e) : k; };
const exMeta = e => [e.equipment, (e.primary || []).join(', ')].filter(Boolean).join(' · ');
function vExercises(){
  return `<div class="wrap stack">
    <div class="search">${svg('search','i s')}<input class="input" id="exq" type="search" placeholder="Szukaj, np. wiosłowanie, sztanga, łydki" data-bind="exq" value="${esc(ui.exQ)}" aria-label="Szukaj ćwiczenia"></div>
    <div class="chips" role="group" aria-label="Partia mięśniowa">${['', ...GROUPS].map(g => `<button class="chip" data-act="exGroup" data-g="${esc(g)}" aria-pressed="${ui.exGroup === g}">${g || 'Wszystkie'}</button>`).join('')}</div>
    <div class="row"><select class="input" id="exeq" data-bind="exeq" aria-label="Sprzęt" style="flex:1;min-width:0"><option value="">Każdy sprzęt</option>${EQUIPS.map(q => `<option ${ui.exEquip === q ? 'selected' : ''}>${q}</option>`).join('')}</select>
      <button class="btn" data-act="customNew">${svg('plus','i s')}Własne</button></div>
    <div id="exlist"></div></div>`;
}
function fillExList(){
  const el = $('#exlist'); if (!el) return;
  el.innerHTML = groupedRows(filterEx(ui.exQ, ui.exGroup, ui.exEquip), e =>
    `<button class="exrow" data-act="exOpen" data-id="${esc(e.id)}">${thumb(e.id)}<span><span class="nm">${esc(e.name)}</span><span class="meta" style="display:block">${esc(exMeta(e))}</span></span>${svg('chev','i s chev')}</button>`);

// Odtwarzacz animacji w karcie ćwiczenia: jedna pętla, działa tylko gdy karta jest otwarta.
const AP = {id:null, el:null, u:0, playing:false, slow:false, raf:0, last:0, drawn:0};
function animMount(){
  const fig = $('#sheet [data-anim]');
  if (!fig){ animStop(); return; }
  AP.id = fig.dataset.anim; AP.el = fig; AP.u = 0; AP.playing = !reduced; AP.slow = false; AP.last = performance.now();
  const r = fig.querySelector('input[type=range]');
  r.addEventListener('input', () => { AP.u = r.value / 1000; animSetPlaying(false); animDraw(); });
  animDraw();
  if (!AP.raf) AP.raf = requestAnimationFrame(animTick);
}
function animStop(){ if (AP.raf) cancelAnimationFrame(AP.raf); AP.raf = 0; AP.id = null; AP.el = null; }
function animSetPlaying(on){
  AP.playing = on; AP.last = performance.now();
  const b = AP.el && AP.el.querySelector('[data-act="animPlay"]');
  if (b){ b.innerHTML = svg(on ? 'pause' : 'play', 'i s'); b.setAttribute('aria-label', on ? 'Zatrzymaj' : 'Odtwórz'); }
}
function animDraw(){
  if (!AP.el || !AP.el.isConnected){ animStop(); return; }
  AP.el.querySelector('.anim-stage').innerHTML = ANIM.svg(AP.id, AP.u);
  const inf = ANIM.info(AP.id, AP.u);
  AP.el.querySelector('.anim-lbl').textContent = inf.label;
  AP.el.querySelector('.anim-pct').textContent = inf.cyc ? '' : inf.pct + '% zakresu ruchu';
  const r = AP.el.querySelector('input[type=range]'); if (document.activeElement !== r) r.value = Math.round((((AP.u % 1) + 1) % 1) * 1000);
}
function animTick(now){
  AP.raf = 0;
  if (!AP.el || !AP.el.isConnected){ animStop(); return; }
  if (AP.playing && !document.hidden){
    const dt = Math.min(0.1, (now - AP.last) / 1000); AP.last = now;
    AP.u = (AP.u + dt / (ANIM.dur(AP.id) * (AP.slow ? 2.2 : 1))) % 1;
    if (now - AP.drawn > 30){ AP.drawn = now; animDraw(); }
  } else AP.last = now;
  AP.raf = requestAnimationFrame(animTick);
}

// Odtwarzacz filmu YouTube w karcie ćwiczenia: bez dźwięku, w pętli, z suwakiem i tempem.
// Bez internetu (albo gdy YouTube się nie wczyta) karta wraca do animacji.
let ytBroken = false, ytApi = null;
const YP = {el:null, p:null, ready:false, dur:0, drag:false, raf:0};
function ytLoadApi(){
  if (window.YT && YT.Player) return Promise.resolve();
  if (ytApi) return ytApi;
  ytApi = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => rej(new Error('yt'));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error('yt-timeout')), 12000);
  }).catch(e => { ytApi = null; throw e; });
  return ytApi;
}
const ytFmt = t => Math.max(0, t).toFixed(1).replace('.', ',') + ' s';
function ytMount(){
  const fig = $('#sheet [data-yt]');
  if (!fig){ ytStop(); return; }
  if (YP.el === fig) return;
  ytStop();
  YP.el = fig;
  const r = fig.querySelector('input[type=range]');
  const seek = final => { if (!YP.ready || !(YP.dur > 0)) return; const t = YP.dur * r.value / 1000; YP.p.seekTo(t, final); fig.querySelector('.yt-time').textContent = ytFmt(t); };
  r.addEventListener('pointerdown', () => { YP.drag = true; if (YP.ready) YP.p.pauseVideo(); });
  r.addEventListener('input', () => { YP.drag = true; if (YP.ready) YP.p.pauseVideo(); seek(false); });
  r.addEventListener('change', () => { seek(true); YP.drag = false; });
  if (!navigator.onLine){ ytFallback(fig); return; }
  ytLoadApi().then(() => {
    if (YP.el !== fig || !fig.isConnected) return;
    YP.p = new YT.Player(fig.querySelector('.yt-frame'), {
      host: 'https://www.youtube-nocookie.com', videoId: fig.dataset.yt,
      playerVars: {autoplay: 0, mute: 1, controls: 0, playsinline: 1, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0, origin: location.origin},
      events: {
        onReady: () => {
          if (YP.el !== fig) return;
          YP.ready = true; YP.dur = YP.p.getDuration() || 0; YP.p.mute();
          fig.querySelectorAll('[disabled]').forEach(x => x.disabled = false);
          if (!reduced) YP.p.playVideo();
          if (!YP.raf) YP.raf = requestAnimationFrame(ytTick);
        },
        onStateChange: ev => {
          if (YP.el !== fig) return;
          if (ev.data === 1){ fig.classList.add('on'); if (!YP.dur) YP.dur = YP.p.getDuration() || 0; }
          if (ev.data === 0){ YP.p.seekTo(0, true); YP.p.playVideo(); }
          const on = ev.data === 1 || ev.data === 3, b = fig.querySelector('.anim-ctl [data-act="ytToggle"]');
          b.innerHTML = svg(on ? 'pause' : 'play', 'i s'); b.setAttribute('aria-label', on ? 'Zatrzymaj' : 'Odtwórz');
        },
        onError: () => { if (YP.el === fig) ytFallback(fig); },
      },
    });
  }).catch(() => { ytBroken = true; if (YP.el === fig) ytFallback(fig); });
}
function ytFallback(fig){
  const id = fig.dataset.ex;
  ytStop();
  if (!fig.isConnected) return;
  fig.outerHTML = animFigure(id);
  animMount();
}
function ytStop(){
  if (YP.raf) cancelAnimationFrame(YP.raf);
  if (YP.p) try { YP.p.destroy(); } catch (e) {}
  YP.el = null; YP.p = null; YP.ready = false; YP.dur = 0; YP.drag = false; YP.raf = 0;
}
function ytTick(){
  YP.raf = 0;
  if (!YP.el || !YP.el.isConnected){ ytStop(); return; }
  if (YP.ready && !YP.drag && YP.dur > 0){
    const t = YP.p.getCurrentTime() || 0, r = YP.el.querySelector('input[type=range]');
    if (document.activeElement !== r) r.value = Math.round(Math.min(1, t / YP.dur) * 1000);
    YP.el.querySelector('.yt-time').textContent = ytFmt(t);
  }
  YP.raf = requestAnimationFrame(ytTick);
}
function ytToggle(){ if (!YP.ready) return; const st = YP.p.getPlayerState(); (st === 1 || st === 3) ? YP.p.pauseVideo() : YP.p.playVideo(); }

/* ---------- mapa mięśni (sylwetka z przodu i z tyłu) ---------- */
// nasze nazwy mięśni → obszary manekina (sufiks F/B = tylko przód / tylko tył)
const MUSCLE_REGIONS = {
  'klatka piersiowa':['chest'], 'barki':['delts'], 'biceps':['biceps'], 'triceps':['triceps'], 'przedramiona':['forearm'],
  'brzuch':['abs','obliques'], 'czworogłowe uda':['quads'], 'przywodziciele':['adductors'], 'odwodziciele':['abductors'],
  'pośladki':['glutes','abductors'], 'dwugłowe uda':['hamstrings'], 'łydki':['calves'], 'najszerszy grzbietu':['lats'],
  'środek pleców':['midback','trapsB'], 'prostowniki grzbietu':['erectors'], 'kaptury':['traps'], 'szyja':['neck'],
};
const GROUP_MUSCLES = {'Klatka piersiowa':['klatka piersiowa'], 'Plecy':['najszerszy grzbietu','środek pleców'], 'Barki':['barki'],
  'Biceps':['biceps'], 'Triceps':['triceps'], 'Czworogłowe uda':['czworogłowe uda'], 'Dwugłowe uda':['dwugłowe uda'],
  'Pośladki i biodra':['pośladki'], 'Łydki':['łydki'], 'Brzuch':['brzuch']};
function musclesOf(e){
  const primary = (e.primary || []).length ? e.primary : (GROUP_MUSCLES[e.group] || []);
  return {primary, secondary:e.secondary || []};
}
// Szczegółowe mięśnie ćwiczenia: z tabeli MUSCLE_EX, a dla ćwiczeń własnych przeliczone z ogólnych nazw.
function exMuscles(e){
  if (typeof MUSCLE_EX !== 'undefined' && MUSCLE_EX[e.id]) return MUSCLE_EX[e.id];
  const {primary, secondary} = musclesOf(e);
  const conv = list => [...new Set(list.flatMap(m => (typeof MUSCLE_COARSE !== 'undefined' && MUSCLE_COARSE[m]) || []))];
  return {p:conv(primary), s:conv(secondary)};
}
// Manekin 3D (obracany) jest dostępny w wersji webowej: window.M3D = {js, glb}. W innym razie płaski manekin.
const has3D = (() => { try { return !!(window.M3D && document.createElement('canvas').getContext('webgl')); } catch (e) { return false; } })();
let bmPref = (() => { try { return localStorage.getItem('bmMode') || '3d'; } catch (e) { return '3d'; } })();
function bodyMap(e){
  if (typeof BODYMAP === 'undefined') return '';
  const m = exMuscles(e);
  if (!m.p.length && !m.s.length) return '';
  const label = [m.p.length ? 'główne: ' + m.p.map(muscleName).join(', ') : '', m.s.length ? 'pomocnicze: ' + m.s.map(muscleName).join(', ') : ''].filter(Boolean).join('; ');

  if (!has3D) return `<figure class="bodymap" style="margin:0" role="img" aria-label="Pracujące mięśnie, ${esc(label)}">${bodyMapFigs(m)}${legend}</figure>`;

const BM3 = {v:null, host:null, mod:null};
function bm3dStop(){ if (BM3.v) try { BM3.v.dispose(); } catch (e) {} BM3.v = null; BM3.host = null; }
function bm3dMount(){
  const fig = topSheet() ? $('#sheet .bm-has3d') : $('#view .bm-has3d'), host = fig && fig.querySelector('.bm3d-host');
  if (!host || fig.querySelector('.bm3d').hidden){ bm3dStop(); return; }

  bm3dStop(); BM3.host = host;
  const msg = fig.querySelector('.bm3d-msg'), week = !!fig.dataset.week, e = week ? null : getEx(fig.dataset.ex);
  (BM3.mod ? Promise.resolve(BM3.mod) : import(window.M3D.js)).then(mod => {
    BM3.mod = mod;
    if (BM3.host !== host || !host.isConnected) return;
    BM3.v = mod.mount(host, {url:window.M3D.glb, groups:MUSCLE_GROUPS, spin:false, touch:'pan-y', dist:4.1,
      onReady:() => { msg.hidden = true; }, onError:() => { bm3dFallback(fig); }});

function sessVol(s){ return (s.ex || []).reduce((a, x) => a + (x.sets || []).reduce((b, t) => b + (x.mode === 'time' ? 0 : (t.kg || 0) * (t.reps || 0)), 0), 0); }
function sessSets(s){ return (s.ex || []).reduce((a, x) => a + (x.sets || []).length, 0); }
function sessRow(s){
  const title = s.dayName || s.planName || 'Trening', sub = s.planName && s.planName !== title ? s.planName : '';
  return `<button class="sess" data-act="sessOpen" data-id="${esc(s.id)}"><span><span class="d" style="display:block">${esc(title)} · ${fmtDate(s.date, {weekday:'short', day:'numeric', month:'short'})}</span>

const wkExpand = list => list.flatMap(k => (typeof MUSCLE_GROUPS !== 'undefined' && MUSCLE_GROUPS[k]) || [k]);

/* ---------- zamiennik ćwiczenia: te same mięśnie główne ---------- */
function swapCandidates(exId, n = 6){
  const m0 = exMuscles(getEx(exId)), P0 = new Set(wkExpand(m0.p)), S0 = new Set(wkExpand(m0.s)), g0 = getEx(exId).group, cardio = g0 === 'Cardio';
  const out = [];
  for (const e of EX){
    if (e.id === exId || (e.group === 'Cardio') !== cardio) continue;
    const m = exMuscles(e), P = wkExpand(m.p), Q = wkExpand(m.s);
    const hit = P.filter(k => P0.has(k)).length; if (!hit) continue;
    const score = hit * 3 + Q.filter(k => P0.has(k) || S0.has(k)).length * .5 - P.filter(k => !P0.has(k)).length + (e.group === g0 ? 1 : 0);
    out.push({e, score});
  }
  return out.sort((a, b) => b.score - a.score).slice(0, n).map(o => o.e);

/* ---------- pokrycie programu: wszystkie plany razem (każdy plan raz w tygodniu) ---------- */
function planGroupSets(items){
  const g = WK_GROUPS.map(([name, keys, f]) => ({name, keys, f:f || 1, sets:0, prim:0}));
  for (const it of items){
    const m = exMuscles(getEx(it.exId)), P = new Set(wkExpand(m.p)), Q = new Set(wkExpand(m.s)), n = (it.sets || []).length;
    for (const q of g){ const w = q.keys.some(k => P.has(k)) ? 1 : q.keys.some(k => Q.has(k)) ? .5 : 0; q.sets += w * n; if (w === 1) q.prim += n; }
  }
  return g;
}
function programFactor(){ const n = S.plans.filter(p => p.items.length).length; return n ? perWeek() / n : 1; }
function programSets(){ const f = programFactor(); return planGroupSets(S.plans.flatMap(p => p.items)).map(q => ({...q, sets:Math.round(q.sets * f * 2) / 2, target:Math.round(wkTarget() * q.f)})); }

/* ---------- podpowiedź kolejnych ćwiczeń przy układaniu planu ----------
   Plan na partie (np. klatka + triceps): brakujące części tych samych partii (góra klatki, głowa długa tricepsa…).
   Plan całego ciała (4+ obszary): najsłabiej pokryte partie całego ciała. Pusty plan: podstawowe wielostawowe. */
const WK_FAMILY = {'Klatka – góra':'klatka', 'Klatka – środek i dół':'klatka', 'Barki – przód':'barki', 'Barki – bok':'barki', 'Barki – tył':'barki',
  'Najszerszy grzbietu':'plecy', 'Środek pleców':'plecy', 'Kaptury':'plecy', 'Prostowniki grzbietu':'plecy', 'Biceps':'biceps', 'Triceps':'triceps', 'Przedramiona':'biceps',
  'Brzuch':'brzuch', 'Czworogłowe uda':'nogi', 'Dwugłowe uda':'nogi', 'Pośladki':'nogi', 'Przywodziciele':'nogi', 'Łydki':'nogi'};
function planNext(p, n = 3){
  const have = new Set(p.items.map(i => i.exId));
  if (!p.items.length) return ['Barbell_Squat', 'Barbell_Bench_Press_-_Medium_Grip', 'Bent_Over_Barbell_Row'].map(id => ({e:getEx(id), why:'podstawa planu'}));
  const g = planGroupSets(p.items);
  const prim = new Set(); for (const it of p.items){ const P = new Set(wkExpand(exMuscles(getEx(it.exId)).p)); for (const q of g) if (q.keys.some(k => P.has(k))) prim.add(WK_FAMILY[q.name]); }

  cand.sort((a, b) => a.sets - b.sets);
  const out = [];

    const e = wkSuggest(q, 8).find(x => !have.has(x.id) && !out.some(o => o.e.id === x.id));

/* ---------- ocena planu: jakie partie pracują i czy czegoś brakuje ----------
   Serie na jeden trening, liczone jak na mapie tygodnia (mięsień główny 1, pomocniczy 0,5).

const coTyg = f => { const k = Math.round(10 / f) / 10; return 'co ' + fmtN(k) + ' ' + (Number.isInteger(k) ? pl(k, 'tydzień', 'tygodnie', 'tygodni') : 'tygodnia'); };

/* ---------- tempo progresu i zastój ----------

  const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + fmtN(Math.abs(v));
  const lines = [];

  if (prR.length >= 2){
    const a = val(prR[0]), tail = prR.slice(Math.max(1, prR.length - 2)), b = Math.max(...tail.map(val));
    const days = Math.max(1, Math.round((new Date(prR[prR.length - 1].date) - new Date(prR[0].date)) / 864e5));
    const d = Math.round((b - a) * 10) / 10;
    const rate = days >= 28 && d ? ` (ok. ${sgn(Math.round(d / days * 30.4 * 10) / 10)} ${unit}/mies.)` : '';
    lines.push(`<p><b class="${d > 0 ? 'tp-up' : d < 0 ? 'tp-down' : ''}">${d ? sgn(d) + ' ' + unit : 'Bez zmian'}</b> ${what} w ${fmtSpan(days)}${d ? ` · z ${fmtN(a)} do ${fmtN(b)} ${unit}` : ''}${rate}</p>`);
  }
  // zastój: ile treningów minęło od ostatniego rekordu (liczone na całej historii)
  let best = -Infinity, lastRec = 0;
  pr.forEach((p, i) => { const v = val(p); if (v > best + 1e-9){ best = v; lastRec = i; } });
  const since = pr.length - 1 - lastRec, stall = pr.length >= 4 && since >= 3;
  if (stall){
    const tip = time ? 'Spróbuj dodać serię albo wydłużać czas o 5 s co trening.'
      : weighted ? 'Spróbuj dokładać powtórzenie przy tym samym ciężarze, zmienić zakres powtórzeń albo zrobić lżejszy tydzień i wtedy wrócić do ciężaru.'
      : 'Spróbuj dodać serię, wolniej opuszczać albo przejść na trudniejszą wersję ćwiczenia.';
    lines.push(`<p><b class="tp-warn">Bez rekordu od ${since} ${pl(since, 'treningu', 'treningów', 'treningów')}</b> (ostatni ${fmtDate(pr[lastRec].date, {day:'numeric', month:'short'})}). ${tip}</p>`);
  } else if (since === 0 && pr.length >= 2){
    lines.push(`<p><b class="tp-up">Rekord na ostatnim treningu</b> · ${fmtN(val(pr[pr.length - 1]))} ${unit}</p>`);
  }
  return lines.length ? `<section class="card tempo${stall ? ' stall' : ''}">${lines.join('')}</section>` : '';
}

/* ---------- wykresy (SVG rysowane do szerokości kontenera) ---------- */
const CHARTS = new Map(); let chartSeq = 0;

function niceTicks(lo, hi, count){

function drawChart(host, spec){

  s += ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + '</g>';
  s += ticks.map(t => `<text x="${m.l - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmtTick(t)}</text>`).join('');
  const maxLabels = Math.max(2, Math.floor(iw / 72)); const idx = [];

// wykres masy: oś X według dat (dni bez pomiaru zostają przerwą), kropki = pomiary, linia = średnia 7-dniowa

    tip.style.left = Math.min(Math.max(x, 70), W - 70) + 'px'; tip.style.top = Math.max(y, 40) + 'px';

}

  summary(s){
    const x = SESS.find(q => q.id === s.id); if (!x) return sheetHead('Podsumowanie') + '<p class="muted">Brak treningu.</p>';
    const best = sets => sets.reduce((a, t) => { const kg = t.kg || 0, r = t.reps || 0; return kg > a.kg || (kg === a.kg && r > a.reps) ? {kg, reps:r} : a; }, {kg:0, reps:0});
    let up = 0, rows = '', recs = 0;
    for (const e of x.ex || []){
      const prev = lastFor(e.exId, x.id), name = getEx(e.exId).missing ? e.name : getEx(e.exId).name;
      const recNow = setBest(e.sets, e.mode), recOld = recordFor(e.exId, e.mode, x.date, x.id);
      const isRec = recNow && recOld && recBetter(recNow, recOld, e.mode); if (isRec) recs++;
      let cmp = '<span class="cmp new">pierwszy raz</span>';
      if (prev){
        if (e.mode === 'time'){ const a = Math.max(...e.sets.map(t => t.sec || 0)), b = Math.max(...prev.sets.map(t => t.sec || 0)); cmp = a > b ? `<span class="cmp up">+${a - b} s</span>` : a < b ? `<span class="cmp down">−${b - a} s</span>` : '<span class="cmp eq">bez zmian</span>'; if (a > b) up++; }
        else {
          const A = best(e.sets), B = best(prev.sets);
          const totA = e.sets.reduce((q, t) => q + (t.reps || 0), 0), totB = prev.sets.reduce((q, t) => q + (t.reps || 0), 0);
          if (A.kg > B.kg){ cmp = `<span class="cmp up">+${fmtN(Math.round((A.kg - B.kg) * 100) / 100)} kg</span>`; up++; }
          else if (A.kg < B.kg) cmp = `<span class="cmp down">−${fmtN(Math.round((B.kg - A.kg) * 100) / 100)} kg</span>`;
          else if (totA > totB){ cmp = `<span class="cmp up">+${totA - totB} powt.</span>`; up++; }
          else if (totA < totB) cmp = `<span class="cmp down">−${totB - totA} powt.</span>`;
          else cmp = '<span class="cmp eq">bez zmian</span>';
        }
      }
      const sets = e.sets.map(t => e.mode === 'time' ? fmtN(t.sec) + ' s' : (t.kg ? fmtN(t.kg) + '×' : '') + (t.reps ?? 0)).join(' · ');
      rows += `<div class="sum-row"><div><b>${esc(name)}</b><span>${esc(sets)}</span>${isRec ? `<span class="rec">Nowy rekord: ${esc(recText(recNow, e.mode))} (było ${esc(recText(recOld, e.mode))})</span>` : ''}</div>${cmp}</div>`;
    }
    const n = (x.ex || []).length;
    return sheetHead('Trening zapisany') + `<p class="sum-lead">${up ? `Lepiej niż ostatnio w ${up} z ${n} ${pl(n, 'ćwiczenia', 'ćwiczeń', 'ćwiczeń')}. Dobra robota!` : 'Trening zapisany. Porównanie z poprzednim razem poniżej.'}${recs ? ` <b class="rec">${recs === 1 ? 'Nowy rekord!' : `Nowe rekordy: ${recs}!`}</b>` : ''}</p>
      <div class="tiles"><div class="tile"><div class="l">Czas</div><div class="v">${fmtDur(x.dur || 0)}</div></div><div class="tile"><div class="l">Serie</div><div class="v">${sessSets(x)}</div></div>
      <div class="tile"><div class="l">Objętość</div><div class="v">${fmtN(Math.round(sessVol(x)))} <small>kg</small></div></div><div class="tile"><div class="l">Ćwiczenia</div><div class="v">${n}</div></div></div>
      <h3 class="h3">W porównaniu z poprzednim razem</h3><div class="sum-list">${rows}</div>
      <div class="sheet-f"><button class="btn primary" data-act="closeSheet">Gotowe</button></div>`;
  },

function updateTimer(){

  const T = ACTIVE.timer; const now = Date.now();
  let state, label, time, frac = 0;
  if (!T){ state = 'idle'; label = 'Przerwa ruszy po odhaczeniu serii'; time = '0:00'; if (!S.settings.autoRest) label = 'Przerwa: uruchom ręcznie'; }
  else {
    const rem = (T.endsAt - now) / 1000;
    if (T.kind === 'work'){ state = 'work'; label = 'Seria w toku · ' + getEx(ACTIVE.ex[T.i]?.exId).name; time = fmtClock(Math.ceil(rem)); frac = 1 - rem / T.total; }
    else if (rem > 0){ state = rem <= 10 ? 'soon' : 'rest'; label = T.label; time = fmtClock(Math.ceil(rem)); frac = 1 - rem / T.total; }
    else { state = 'over'; label = 'Koniec przerwy. Czas na serię!'; time = '+' + fmtClock(-rem); frac = 1; }
  }
  bar.className = 'tbar ' + state;
  $('#tb-lbl').textContent = label; $('#tb-time').textContent = time; $('#tb-fill').style.width = Math.min(100, Math.max(0, frac * 100)) + '%';
  const cat = state === 'soon' ? 'rest' : state;
  if (cat !== tbState){
    tbState = cat;
    $('#tb-btns').innerHTML = cat === 'idle' ? `<button class="tbtn main" data-act="tbStart">Start przerwy</button>`
      : cat === 'rest' ? `<button class="tbtn" data-act="tbAdj" data-d="-15" aria-label="Skróć o 15 sekund">−15</button><button class="tbtn" data-act="tbAdj" data-d="15" aria-label="Wydłuż o 15 sekund">+15</button><button class="tbtn main" data-act="tbSkip">Pomiń</button>`
      : cat === 'work' ? `<button class="tbtn main" data-act="stopWork">Zakończ serię</button>`
      : `<button class="tbtn main" data-act="tbSkip">OK</button>`;
  }
}
function startTimer(kind, sec, label, focus, extra={}){
  if (!(sec > 0)){ ACTIVE.timer = null; return; }
  ACTIVE.timer = {kind, total:sec, endsAt:Date.now() + sec * 1000, label, focus, fired:false, ...extra};
}
function nextUndone(after){ let k = ACTIVE.ex.findIndex((x, n) => n > after && exOpen(x)); if (k < 0) k = ACTIVE.ex.findIndex(x => exOpen(x)); return k; }
function afterSetDone(i){
  const x = ACTIVE.ex[i]; ACTIVE.focusKey = null; ACTIVE.lastSetAt = Date.now();
  if (ui.wOpen && !exOpen(x)) delete ui.wOpen[x.key];
  const sp = ssPos(ACTIVE.ex, i);
  if (sp){   // superseria: następne ćwiczenie z grupy bez przerwy, przerwa dopiero po całej rundzie
    const round = x.sets.filter(s => s.done).length;
    for (let d = 1; d < sp.n; d++){
      const k = sp.a + (i - sp.a + d) % sp.n, y = ACTIVE.ex[k];
      if (y.sets.filter(s => s.done).length < round && exOpen(y)){ ACTIVE.timer = null; ACTIVE.focusKey = y.key; ui.ssJump = y.key; toast('Superseria · teraz: ' + getEx(y.exId).name); return; }
    }
    const first = [...Array(sp.n).keys()].map(d => sp.a + d).find(k => exOpen(ACTIVE.ex[k]));
    if (first != null){ if (S.settings.autoRest) startTimer('rest', x.rest, 'Przerwa po rundzie superserii', first); else { ACTIVE.timer = null; ACTIVE.focusKey = ACTIVE.ex[first].key; } return; }
    const k = nextUndone(sp.b);
    if (k < 0 || (k >= sp.a && k <= sp.b)){ ACTIVE.timer = null; allDoneAsk(); return; }
    if (S.settings.autoRest) startTimer('rest', x.restAfter, 'Przerwa · następne: ' + getEx(ACTIVE.ex[k].exId).name, k); else ACTIVE.timer = null;
    return;
  }
  if (x.sets.some(s => !s.done)){ if (S.settings.autoRest) startTimer('rest', x.rest, 'Przerwa między seriami', i); else ACTIVE.timer = null; return; }
  const k = nextUndone(i);
  if (k < 0){ ACTIVE.timer = null; allDoneAsk(); return; }
  if (S.settings.autoRest) startTimer('rest', x.restAfter, 'Przerwa · następne: ' + getEx(ACTIVE.ex[k].exId).name, k); else ACTIVE.timer = null;
}
// wszystkie serie odhaczone: od razu pytamy o zakończenie (arkusz „Zakończ trening”; zamknięcie go = trenujesz dalej)
function allDoneAsk(){
  if (!ui.showWorkout || topSheet()){ toast('Wszystkie serie zrobione. Zakończ trening, żeby go zapisać.'); return; }
  setTimeout(() => { if (ACTIVE && ui.showWorkout && !topSheet()) openSheet({type:'finish', upd:false, auto:true}); }, 0);
}
let AC = null;
function audioUnlock(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch {} }
function alarm(){
  try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch {}
  if (!S.settings.sound || !AC) return;
  try {
    const t0 = AC.currentTime;
    for (let k = 0; k < 3; k++){
      const o = AC.createOscillator(), g = AC.createGain(), at = t0 + k * 0.3;
      o.type = 'sine'; o.frequency.value = k === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.45, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.24);
      o.connect(g).connect(AC.destination); o.start(at); o.stop(at + 0.26);
    }
  } catch {}
}
function onTimerEnd(T){
  alarm();
  if (T.kind === 'work'){
    const s = ACTIVE.ex[T.i]?.sets[T.j];
    if (s){ s.sec = T.total; s.done = true; }
    afterSetDone(T.i); saveActive(); renderWorkout(); return;
  }
  saveActive();
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (ui.showWorkout && !typing){ const x = ACTIVE.ex[T.focus]; const c = x && $('#wex-' + x.key); if (c) c.scrollIntoView({behavior:reduced ? 'auto' : 'smooth', block:'start'}); }
}
// trening bez żadnej serii od 2 godzin uznajemy za zapomniany: pytamy o zakończenie (raz na każdą przerwę w aktywności)
const STALE_MS = 2 * 3600e3;
const activeLast = () => ACTIVE ? (ACTIVE.lastSetAt || ACTIVE.startedAt) : 0;
const isStale = () => !!ACTIVE && Date.now() - activeLast() > STALE_MS;
function staleCheck(){
  if (!isStale() || ui.staleAsked === activeLast() || topSheet() || (FIRE && !FOLDER)) return;
  ui.staleAsked = activeLast(); render(); openSheet({type:'finish', upd:false, stale:true});
}
function tick(){
  if (!ACTIVE) return;
  staleCheck();
  const el = fmtClock((Date.now() - ACTIVE.startedAt) / 1000);
  $$('[data-elapsed]').forEach(e => { e.textContent = el; });
  const T = ACTIVE.timer;
  if (T && !T.fired && Date.now() >= T.endsAt){ T.fired = true; onTimerEnd(T); }
  if (ui.showWorkout) updateTimer();
}
setInterval(tick, 250);
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} }
function releaseWake(){ try { wake && wake.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushActive(); if (document.visibilityState === 'visible'){ if (ACTIVE && ui.showWorkout) requestWake(); tick(); } });

function startWorkoutFrom(p){
  const name = p.name || 'Trening';
  ACTIVE = {id:uid(), folder:FOLDER ? FOLDER.id : null, planId:p.id, dayId:p.id, planName:name, dayName:name, startedAt:Date.now(), timer:null,
    ex:p.items.map(it => { const last = lastFor(it.exId); return {key:uid(), itemId:it.id, exId:it.exId, mode:it.mode, ssNext:!!it.ssNext, rest:it.rest ?? S.settings.restSet, restAfter:it.restAfter ?? S.settings.restEx, note:it.note || '',
      sets:it.sets.map((s, j) => ({tReps:s.reps ?? null, tKg:s.kg ?? null, tSec:s.sec ?? null, reps:s.reps ?? null, sec:s.sec ?? null, kg:s.kg ?? (last && last.sets[j] ? last.sets[j].kg ?? null : null), done:false}))}; })};
  saveActive(); ui.showWorkout = true; ui.wMenu = null; audioUnlock(); requestWake(); render(); renderWorkout();
}
function newWorkoutEx(exId){
  const ex = getEx(exId); const t = ex.mode === 'time'; const last = lastFor(exId);
  return {key:uid(), itemId:null, exId, mode:t ? 'time' : 'reps', rest:S.settings.restSet, restAfter:S.settings.restEx, note:'',
    sets:Array.from({length:3}, (_, j) => ({tReps:null, tKg:null, tSec:null, reps:t ? null : (last && last.sets[j] ? last.sets[j].reps ?? 10 : 10), sec:t ? 30 : null, kg:last && last.sets[j] ? last.sets[j].kg ?? null : null, done:false}))};
}
function buildSession(){
  const ex = ACTIVE.ex.map(x => ({exId:x.exId, name:getEx(x.exId).name, mode:x.mode, ...(x.wnote ? {note:x.wnote} : {}),
    sets:x.sets.filter(s => s.done).map(s => x.mode === 'time' ? {sec:s.sec ?? 0, kg:s.kg ?? null} : {reps:s.reps ?? 0, kg:s.kg ?? null, ...(s.rir != null ? {rir:s.rir} : {})})})).filter(x => x.sets.length);
  // zawieszony trening: czas liczony do ostatniej serii, a nie do chwili zapisania (np. kilka dni później)
  const end = isStale() ? (ACTIVE.lastSetAt || ACTIVE.startedAt + STALE_MS) : Date.now();
  return {id:ACTIVE.id, date:new Date(ACTIVE.startedAt).toISOString(), dur:Math.max(0, Math.round((end - ACTIVE.startedAt) / 1000)),
    planId:ACTIVE.planId || null, planName:ACTIVE.planName || '', dayId:ACTIVE.dayId || null, dayName:ACTIVE.dayName || 'Trening', ex};
}
function endWorkout(){ const fid = ACTIVE && (ACTIVE.folder || FOLDER?.id); ACTIVE = null; saveActive(); dropRemoteActive(fid); ui.showWorkout = false; releaseWake(); sheets.length = 0; renderSheet(); render(); }

  importAsk(){

    if (!d || d.app !== 'dziennik-silowni' || !d.state){ toast('To nie wygląda na kopię danych z tej aplikacji.'); return; }
    if (d.diet && !dietCanEdit()) return;
    confirmBox('Przywrócić dane z kopii?', 'Plany, własne ćwiczenia i ustawienia zostaną zastąpione kopią. Treningi, dni diety, „Moje produkty” i pomiary masy ciała z kopii zostaną dodane do obecnych (istniejące zostają). Cele diety (zwykłe i treningowe) oraz profil kalkulatora zostaną zastąpione, jeśli kopia je ma.', 'Przywróć', async () => {
      S = normalize(d.state); S.plans.forEach(p => { delete p.share; }); commit();   // kody udostępnień zostają przy oryginałach

        }
      }

async function scanStart(){
  const s = topSheet(); if (!s || s.type !== 'dietScan' || s.busy) return;
  const seq = scanSeq, st = t => { const el = $('#scan-st'); if (el && seq === scanSeq) el.textContent = t; };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ st('Ta przeglądarka nie udostępnia aparatu. Wpisz cyfry kodu poniżej.'); return; }
  st('Uruchamiam aparat…');
  let stream, ZX;
  try {
    [stream, ZX] = await Promise.all([
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false}),
      loadZX().catch(() => null)]);
  } catch (e){
    st(e && e.name === 'NotAllowedError' ? 'Brak zgody na aparat. Zezwól na niego w ustawieniach przeglądarki albo wpisz cyfry kodu poniżej.' : 'Nie udało się uruchomić aparatu. Wpisz cyfry kodu poniżej.'); return;
  }
  if (seq !== scanSeq || topSheet() !== s){ stream.getTracks().forEach(t => t.stop()); return; }
  const v = $('#scan-v'); if (!v){ stream.getTracks().forEach(t => t.stop()); return; }
  const me = SCAN = {stream, t:0}; v.srcObject = stream; v.muted = true; v.setAttribute('playsinline', ''); v.play().catch(() => {});
  if (!ZX){ st('Aparat działa, ale nie udało się wczytać czytnika kodów (brak internetu?). Wpisz cyfry kodu poniżej.'); return; }
  let dec; try { dec = zxDecoder(ZX); } catch { st('Czytnik kodów nie działa w tej przeglądarce. Wpisz cyfry kodu poniżej.'); return; }
  st('Skieruj aparat na kod kreskowy.');
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
  const tick = () => {
    if (SCAN !== me) return;
    if (v.readyState >= 2 && v.videoWidth){
      const w = Math.min(v.videoWidth, 960); cv.width = w; cv.height = Math.round(w * v.videoHeight / v.videoWidth); cx.drawImage(v, 0, 0, cv.width, cv.height);
      const txt = dec(cv), ean = txt && normEan(txt, false);
      if (ean){ scanLookup(ean, false); return; }
    }
    me.t = setTimeout(tick, 150);
  };
  tick();
}
async function scanLookup(raw, strict){
  const s = topSheet(); if (!s || s.type !== 'dietScan' || s.busy) return;
  const st = t => { const el = $('#scan-st'); if (el) el.textContent = t; };
  const ean = normEan(raw, strict);
  if (!ean){ st('Kod ma złą liczbę cyfr albo cyfrę kontrolną – sprawdź cyfry (8, 12 lub 13).'); return; }
  s.busy = true; scanStop(); st('Szukam produktu ' + ean + '…');
  const btn = $('[data-act="scanGo"]'); if (btn) btn.disabled = true;
  try { await scanResolve(s, ean); }
  catch { st('Nie udało się wyszukać produktu. Spróbuj ponownie.'); }
  finally { s.busy = false; if (btn) btn.disabled = false; }
}
// kolejność: Moje produkty (pole ean) → wspólna baza → Open Food Facts → ręczne wpisanie
async function scanResolve(s, ean){
  const meal = s.meal, day = s.day, alive = () => topSheet() === s;
  const go = fn => { if (alive()){ sheets.pop(); fn(); } };   // zamknij skaner, otwórz następny arkusz
  const m = DIET.mine.find(p => p.ean === ean || p.id === ean);
  if (m) return go(() => openDietQty({meal, pid:m.id, day}));
  const sh = await sharedGet(ean); if (!alive()) return;
  if (sh){ SCAN_CACHE.set(ean, sh); return go(() => openDietQty({meal, pid:ean, day})); }
  const o = await offGet(ean); if (!alive()) return;
  const manual = (note, f, off) => go(() => openSheet({type:'dietProd', id:null, ean, scan:true, off, meal, day, scanNote:note, f}));
  const blank = {n:'', brand:'', u:'g', k:'', b:'', w:'', t:'', f:'', pg:'', po:''};
  if (o === 'err') return manual(`Nie udało się połączyć z Open Food Facts (brak internetu?). Możesz wpisać wartości z etykiety – kod ${ean} zostanie zapamiętany.`, blank, false);
  if (!o) return manual(`Nie znalazłem kodu ${ean}. Wpisz wartości z etykiety – następnym razem produkt znajdzie się po skanie.`, blank, false);
  const p = offToProd(ean, o);
  if (prodOk(p)){
    const c = cleanProd(p); SCAN_CACHE.set(ean, c); SHARED_NEW.set(ean, 'off');
    return go(() => openDietQty({meal, pid:ean, day}));
  }
  const fx = x => x == null ? '' : fmtN(x);
  manual('Open Food Facts nie ma pełnych albo poprawnych wartości odżywczych tego produktu – uzupełnij je z etykiety.',
    {n:p.n, brand:p.brand, u:p.u, k:fx(p.k), b:fx(p.b), w:fx(p.w), t:fx(p.t), f:fx(p.f), pg:p.pg ? fmtN(p.pg) : '', po:p.po}, true);
}
document.addEventListener('visibilitychange', () => {   // aparat nie działa w tle
  if (document.visibilityState === 'hidden'){ if (SCAN){ scanStop(); const el = $('#scan-st'); if (el) el.textContent = 'Aparat wyłączony. Wróć do aplikacji, a włączy się sam.'; } }
  else { const s = topSheet(); if (s && s.type === 'dietScan' && !s.busy && !SCAN) scanStart(); }
});

  const s = {type:'dietQty', meal:'sn', pid:null, entry:null, entryId:null, g:null, q:null, mode:'g', day:dietKey(), ...o}, b = qtyBase(s);
  if (s.entry){ s.g = s.entry.g; if (s.entry.q && b.pg){ s.mode = 'q'; s.q = s.entry.q; } }
  else if (b && b.pg){ s.mode = 'q'; s.q = 1; s.g = r1(b.pg); }
  else s.g = 100;
  openSheet(s);
}

});

/* ---------- kalkulator zapotrzebowania (etap 3.2): arkusz otwierany z „Dziennych celów” ---------- */
const PAL_TXT = {1.2:['1,2', 'Praca siedząca, bez treningów'], 1.375:['1,375', '1–3 treningi w tygodniu'], 1.55:['1,55', '3–5 treningów w tygodniu'], 1.725:['1,725', '6–7 treningów lub praca fizyczna'], 1.9:['1,9', 'Bardzo ciężka praca + treningi']};
const CALC_GOALS = {red:'Redukcja', utr:'Utrzymanie', masa:'Masa'};
const r5 = v => Math.round(v / 5) * 5, r10 = v => Math.round(v / 10) * 10;
function calcWeight(){   // skąd bierzemy masę: średnia 7 dni z dziś, inaczej ostatni pomiar, inaczej pole w arkuszu
  const a = wtAvg7(dietToday()); if (a != null) return {kg:a, txt:`z średniej 7 dni: ${fmtKg(a)} kg`};
  const d = wtDays(); if (d.length){ const k = d[d.length - 1]; return {kg:DIET.wt[k], txt:`z ostatniego pomiaru (${fmtDate(keyToDate(k), {day:'numeric', month:'short'})}): ${fmtKg(DIET.wt[k])} kg`}; }
  return null;
}
// Mifflin-St Jeor (1990); białko Morton i in. 2018, Helms i in. 2014; tłuszcz 25% kcal, min 0,6 g/kg; węgle = reszta
function calcNeeds(p, kg){
  const age = new Date().getFullYear() - p.by, h = p.h;
  const bmr = 10 * kg + 6.25 * h - 5 * age + (p.sex === 'm' ? 5 : -161), tdee = bmr * p.pal;
  let kcal = r10(tdee * (p.goal === 'red' ? 0.8 : p.goal === 'masa' ? 1.1 : 1)); const floor = Math.ceil(bmr / 10) * 10, floored = kcal < floor; if (floored) kcal = floor;
  const bmi = kg / ((h / 100) ** 2), ref = 25 * (h / 100) ** 2, high = bmi >= 30, pk = high ? ref : kg;
  const b = r5(pk * (p.goal === 'red' ? 2.2 : 1.8)), t = r5(Math.max(kcal * 0.25 / 9, 0.6 * kg)), w = Math.max(0, r5((kcal - 4 * b - 9 * t) / 4));
  return {bmr, tdee, kcal, b, w, t, floored, high, ref};
}
function calcRead(s){   // → {p, kg} gdy wszystko poprawne, inaczej {err}
  const f = s.f, yr = new Date().getFullYear(), by = num(f.by), h = num(f.h), kg = s.wt ? s.wt.kg : num(f.kg);
  if (by != null && (!Number.isInteger(by) || yr - by < 14 || yr - by > 100)) return {err:'Rok urodzenia: wiek od 14 do 100 lat.'};
  if (h != null && (h < 120 || h > 230)) return {err:'Wzrost: od 120 do 230 cm.'};
  if (!s.wt && kg != null && (kg < WT_MIN || kg > WT_MAX)) return {err:`Masa: od ${WT_MIN} do ${WT_MAX} kg.`};
  if (!f.sex || by == null || h == null || kg == null || !f.pal || !f.goal) return {err:'Uzupełnij wszystkie pola, żeby zobaczyć wynik.', incomplete:true};
  return {p:{sex:f.sex, by, h:Math.round(h), pal:+f.pal, goal:f.goal}, kg};
}
SHEETS.dietCalc = s => {
  const f = s.f, chip = (k, v, lbl) => `<button class="chip" data-act="dcSet" data-k="${k}" data-v="${v}" aria-pressed="${String(f[k]) === String(v)}">${lbl}</button>`;
  return sheetHead('Kalkulator zapotrzebowania') + `
    <div class="field"><span class="lbl">Płeć</span><div class="chips" role="group" aria-label="Płeć">${chip('sex', 'm', 'Mężczyzna')}${chip('sex', 'k', 'Kobieta')}</div></div>
    <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="field" style="flex:1;min-width:0"><label class="lbl" for="dc-by">Rok urodzenia</label><input class="input" id="dc-by" inputmode="numeric" data-bind="dc" data-f="by" value="${esc(f.by)}" placeholder="np. 1998" autocomplete="off"></div>
    <div class="field" style="flex:1;min-width:0"><label class="lbl" for="dc-h">Wzrost (cm)</label><input class="input" id="dc-h" inputmode="numeric" data-bind="dc" data-f="h" value="${esc(f.h)}" placeholder="np. 180" autocomplete="off"></div></div>
    ${s.wt ? `<p class="note">Masa ciała ${esc(s.wt.txt)}.</p>` : `<div class="field"><label class="lbl" for="dc-kg">Masa ciała (kg)</label><input class="input" id="dc-kg" inputmode="decimal" data-bind="dc" data-f="kg" value="${esc(f.kg)}" placeholder="np. 75,4" autocomplete="off"><span class="note">Zapiszę ją jako pomiar na dziś.</span></div>`}
    <div class="field"><span class="lbl">Aktywność</span><div class="dc-pal" role="group" aria-label="Aktywność">${PALS.map(v => `<button data-act="dcSet" data-k="pal" data-v="${v}" aria-pressed="${+f.pal === v}">${PAL_TXT[v][0]} <small>${PAL_TXT[v][1]}</small></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Cel</span><div class="chips" role="group" aria-label="Cel">${PROF_GOALS.map(g => chip('goal', g, CALC_GOALS[g])).join('')}</div></div>
    <div class="dc-out" id="dc-out" aria-live="polite"></div>
    <div class="sheet-f"><button class="btn" data-act="closeSheet">Anuluj</button><button class="btn primary" data-act="dcApply" id="dc-apply" disabled>Ustaw jako cele</button></div>`;
};
function calcOut(){
  const s = topSheet(), el = $('#dc-out'); if (!s || s.type !== 'dietCalc' || !el) return;
  const r = calcRead(s), btn = $('#dc-apply'); if (btn) btn.disabled = !r.p;
  if (!r.p){ el.innerHTML = `<p class="note"${r.incomplete ? '' : ' style="color:var(--bad);font-weight:600"'}>${esc(r.err)}</p>`; return; }
  const n = calcNeeds(r.p, r.kg), tile = (l, v, u) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}${u ? ` <small>${u}</small>` : ''}</div></div>`;
  const pc = (g, c) => Math.round(g * c / n.kcal * 100), mac = (l, g, c) => tile(l, fmtN(g), `g · ${pc(g, c)}%`);
  el.innerHTML = `<div class="tiles">${tile('Podstawowa przemiana (BMR)', fmtN(Math.round(n.bmr)), 'kcal')}${tile('Zapotrzebowanie (TDEE)', fmtN(Math.round(n.tdee)), 'kcal')}</div>
    <div class="tiles" style="grid-template-columns:minmax(0,1fr)">${tile(`Cel: ${CALC_GOALS[r.p.goal].toLowerCase()}`, fmtN(n.kcal), 'kcal dziennie')}</div>
    <div class="dc-mac">${mac('Białko', n.b, 4)}${mac('Węgle', n.w, 4)}${mac('Tłuszcz', n.t, 9)}</div>
    ${n.floored ? '<p class="note">Nie schodź poniżej podstawowej przemiany materii – cel ustawiony na jej poziomie.</p>' : ''}
    ${n.high ? `<p class="note">BMI ≥ 30: białko liczone od masy dla BMI 25 (${fmtN(r1(n.ref))} kg).</p>` : ''}
    ${n.w < 50 ? `<p class="note" style="color:var(--bad);font-weight:600">Mało węglowodanów (${fmtN(n.w)} g). Rozważ wyższy cel kalorii.</p>` : ''}
    <p class="note">To punkt startu – po 2–3 tygodniach skoryguj o trend wagi.</p>
    <p class="dc-src">Źródła: Mifflin i in. 1990 (BMR); Morton i in. 2018, Helms i in. 2014, ISSN 2017 (białko); tłuszcz 25% kcal, min. 0,6 g/kg.</p>`;
}
function calcSaveProf(){
  const s = topSheet(); if (!s || s.type !== 'dietCalc') return;
  const f = s.f, p = cleanProf({sex:f.sex, by:num(f.by), h:num(f.h), pal:f.pal, goal:f.goal});
  if (p && JSON.stringify(p) !== JSON.stringify(DIET.prof)){ DIET.prof = p; persistDiet([], [], false, false, [], [], true); }
}
Object.assign(ACT, {
  dietCalc(){
    if (!dietCanEdit()) return;
    const p = DIET.prof || {}, w = calcWeight();
    openSheet({type:'dietCalc', wt:w, f:{sex:p.sex || '', by:p.by != null ? String(p.by) : '', h:p.h != null ? String(p.h) : '', pal:p.pal != null ? String(p.pal) : '', goal:p.goal || '', kg:''}});
  },
  dcSet(el){
    const s = topSheet(); if (!s) return; s.f[el.dataset.k] = el.dataset.v;
    $$(`[data-act="dcSet"][data-k="${el.dataset.k}"]`, $('#sheet')).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === el.dataset.v));
    calcOut();
  },
  dcApply(){
    const s = topSheet(); if (!s || s.type !== 'dietCalc' || !dietCanEdit()) return;
    const r = calcRead(s); if (!r.p) return;
    const n = calcNeeds(r.p, r.kg), today = dietToday(), wp = [], below = sheets[sheets.length - 2], isT = !!(below && below.type === 'dietGoals' && below.tab === 't');   // kalkulator wypełnia tylko aktywną zakładkę
    if (!s.wt){ DIET.wt[today] = r1(r.kg); wp.push(today); }   // masa wpisana w arkuszu = pomiar na dziś
    if (isT) DIET.goalsT = {k:n.kcal, b:n.b, w:n.w, t:n.t}; else DIET.goals = {k:n.kcal, b:n.b, w:n.w, t:n.t};
    DIET.prof = cleanProf(r.p);
    persistDiet([], [], !isT, false, wp, [], true, isT);
    sheets.pop(); const under = topSheet();
    if (under && under.type === 'dietGoals') Object.assign(isT ? under.fT : under.f, {k:fmtN(n.kcal), b:fmtN(n.b), w:fmtN(n.w), t:fmtN(n.t)});
    renderSheet(); render(); toast('Cele ustawione z kalkulatora.');
  },
});
Object.assign(BIND, { dc(t){ const s = topSheet(); if (!s) return; s.f[t.dataset.f] = t.value; calcOut(); } });

/* ---------- masa ciała: arkusze i akcje (karta i wykres przy wykresach historii) ---------- */
SHEETS.wtAdd = s => {
  const today = dietToday(), d = s.f.d, has = DIET.wt[d] != null, days = wtDays(), last = days.length ? DIET.wt[days[days.length - 1]] : null;
  return sheetHead(has && s.edit ? 'Edytuj pomiar' : 'Dodaj pomiar') + `
    <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="field" style="flex:1.3;min-width:0"><label class="lbl" for="wt-d">Data</label><input class="input" id="wt-d" type="date" max="${today}" value="${esc(d)}" data-bind="wtf" data-f="d"></div>
    <div class="field" style="flex:1;min-width:0"><label class="lbl" for="wt-kg">Masa (kg)</label><input class="input" id="wt-kg" inputmode="decimal" data-bind="wtf" data-f="kg" value="${esc(s.f.kg)}" placeholder="${last != null ? esc(fmtKg(last)) : 'np. 75,4'}" autocomplete="off" autofocus></div></div>
    <p class="note" id="wt-hint" aria-live="polite">${has ? `Na ten dzień jest już pomiar: ${fmtKg(DIET.wt[d])} kg. Zapis go zastąpi.` : 'Jeden pomiar na dzień. Najlepiej rano, po toalecie.'}</p>
    ${s.err ? `<p role="alert" style="margin:0;color:var(--bad);font-weight:600">${esc(s.err)}</p>` : ''}
    <div class="sheet-f"><button class="btn danger" data-act="wtDel" id="wt-del" style="flex:none" ${has ? '' : 'hidden'}>Usuń</button><button class="btn primary" data-act="wtSave">Zapisz</button></div>`;
};
function wtHint(){
  const s = topSheet(); if (!s || s.type !== 'wtAdd') return;
  const v = DIET.wt[s.f.d], el = $('#wt-hint'), del = $('#wt-del');
  if (el) el.textContent = v != null ? `Na ten dzień jest już pomiar: ${fmtKg(v)} kg. Zapis go zastąpi.` : 'Jeden pomiar na dzień. Najlepiej rano, po toalecie.';
  if (del) del.hidden = v == null;
}
SHEETS.wtList = () => {
  const days = wtDays().reverse(), show = days.slice(0, 120);
  return sheetHead('Pomiary masy ciała') + (days.length ? `<div class="exlist">${show.map((k, i) => {
    const v = DIET.wt[k], prev = days[i + 1], d = prev ? r1(v - DIET.wt[prev]) : null;
    return `<button class="wt-row" data-act="wtAdd" data-d="${k}"><span>${esc(fmtDate(keyToDate(k), {weekday:'short', day:'numeric', month:'short', year:'numeric'}))}</span><b>${fmtKg(v)} kg</b><span class="small muted">${d ? (d > 0 ? '+' : '') + fmtKg(d) : ''}</span></button>`;
  }).join('')}</div>${days.length > show.length ? `<p class="note">Pokazuję ${show.length} ostatnich z ${days.length} pomiarów.</p>` : ''}` : '<p class="note">Brak pomiarów.</p>') +
  `<div class="sheet-f"><button class="btn primary" data-act="wtAdd" data-d="">${svg('plus','i s')}Waga</button></div>`;
};
Object.assign(ACT, {
  wtRange(el){ ui.wtRange = el.dataset.v; render(); },
  wtList(){ openSheet({type:'wtList'}); },
  wtAdd(el){
    if (!dietCanEdit()) return;
    const d = el && el.dataset.d && dayKeyOk(el.dataset.d) ? el.dataset.d : dietToday(), v = DIET.wt[d];
    openSheet({type:'wtAdd', edit:v != null, f:{d, kg:v != null ? fmtKg(v) : ''}});
  },
  wtSave(){
    const s = topSheet(); if (!s || !dietCanEdit()) return;
    const d = s.f.d, kg = num(s.f.kg);
    if (!dayKeyOk(d) || d > dietToday()){ s.err = 'Wybierz datę – nie później niż dziś.'; renderSheet(); return; }
    if (kg == null || kg < WT_MIN || kg > WT_MAX){ s.err = `Masa: od ${WT_MIN} do ${WT_MAX} kg.`; renderSheet(); return; }
    DIET.wt[d] = r1(kg); persistDiet([], [], false, false, [d]);
    sheets.pop(); renderSheet(); render(); toast('Zapisano pomiar.');
  },
  wtDel(){
    const s = topSheet(); if (!s || !dietCanEdit()) return; const d = s.f.d; if (DIET.wt[d] == null) return;
    confirmBox('Usunąć pomiar?', `${fmtDate(keyToDate(d), {day:'numeric', month:'long', year:'numeric'})}: ${fmtKg(DIET.wt[d])} kg.`, 'Usuń', () => {
      delete DIET.wt[d]; persistDiet([], [], false, false, [], [d]); sheets.pop(); render(); toast('Usunięto pomiar.');
    });
  },
});
Object.assign(BIND, { wtf(t){ const s = topSheet(); if (!s) return; s.f[t.dataset.f] = t.value; if (t.dataset.f === 'd') wtHint(); } });

function route(){
  const h = location.hash.replace('#', '');
  ui.tab = TABS.some(t => t.id === h) ? h : 'trening';
  if (ui.tab !== 'plany') ui.openItem = null;
  render(); scrollTo(0, 0);
}
addEventListener('hashchange', route);
ui.showWorkout = !!ACTIVE;
route();
initStore();
</script>

<script>
if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
