function groupedRows(list, rowFn){

    h += `<h2 class="sec-h">${esc(g)} <span class="n">${items.length}</span></h2><div class="exlist">${items.map(rowFn).join('')}</div>`;

}

// Odtwarzacz animacji w karcie ćwiczenia: jedna pętla, działa tylko gdy karta jest otwarta.
const AP = {id:null, el:null, u:0, playing:false, slow:false, raf:0, last:0, drawn:0};
function animMount(){
  const fig = $('#sheet [data-anim]');
  if (!fig){ animStop(); return; }
  AP.id = fig.dataset.anim; AP.el = fig; AP.u = 0; AP.playing = !reduced; AP.slow = false; AP.last = performance.now();
  const r = fig.querySelector('input[type=range]');
  r.addEventListener('input', () => { AP.u = r.value / 1000; animSetPlaying(false); animDraw(); });
  animDraw();
  if (!AP.raf) AP.raf = requestAnimationFrame(animTick);
}
function animStop(){ if (AP.raf) cancelAnimationFrame(AP.raf); AP.raf = 0; AP.id = null; AP.el = null; }
function animSetPlaying(on){
  AP.playing = on; AP.last = performance.now();
  const b = AP.el && AP.el.querySelector('[data-act="animPlay"]');
  if (b){ b.innerHTML = svg(on ? 'pause' : 'play', 'i s'); b.setAttribute('aria-label', on ? 'Zatrzymaj' : 'Odtwórz'); }
}
function animDraw(){
  if (!AP.el || !AP.el.isConnected){ animStop(); return; }
  AP.el.querySelector('.anim-stage').innerHTML = ANIM.svg(AP.id, AP.u);
  const inf = ANIM.info(AP.id, AP.u);
  AP.el.querySelector('.anim-lbl').textContent = inf.label;
  AP.el.querySelector('.anim-pct').textContent = inf.cyc ? '' : inf.pct + '% zakresu ruchu';
  const r = AP.el.querySelector('input[type=range]'); if (document.activeElement !== r) r.value = Math.round((((AP.u % 1) + 1) % 1) * 1000);
}
function animTick(now){
  AP.raf = 0;
  if (!AP.el || !AP.el.isConnected){ animStop(); return; }
  if (AP.playing && !document.hidden){
    const dt = Math.min(0.1, (now - AP.last) / 1000); AP.last = now;
    AP.u = (AP.u + dt / (ANIM.dur(AP.id) * (AP.slow ? 2.2 : 1))) % 1;
    if (now - AP.drawn > 30){ AP.drawn = now; animDraw(); }
  } else AP.last = now;
  AP.raf = requestAnimationFrame(animTick);
}

function sessVol(s){ return (s.ex || []).reduce((a, x) => a + (x.sets || []).reduce((b, t) => b + (x.mode === 'time' ? 0 : (t.kg || 0) * (t.reps || 0)), 0), 0); }

    <span class="m">${esc(sub)}${sub ? ' · ' : ''}${fmtDur(s.dur || 0)} · ${sessSets(s)} ${pl(sessSets(s),'seria','serie','serii')}</span></span>
    <span class="v">${v ? fmtN(Math.round(v)) + ' kg' : ''}</span></button>`;
}
function progress(exId){
  const out = [];

    const x = (s.ex || []).find(e => e.exId === exId); if (!x || !x.sets || !x.sets.length) continue;
    if (x.mode === 'time'){ out.push({date:s.date, mode:'time', best:Math.max(...x.sets.map(t => t.sec || 0)), total:x.sets.reduce((a, t) => a + (t.sec || 0), 0), sets:x.sets}); continue; }
    let bestKg = -1, bestReps = 0, e1 = 0, vol = 0, reps = 0, maxReps = 0;
    for (const t of x.sets){ const kg = t.kg || 0, r = t.reps || 0; vol += kg * r; reps += r; maxReps = Math.max(maxReps, r);

      if (kg > 0 && r > 0) e1 = Math.max(e1, kg * (1 + r / 30)); }

}
function vHistory(){

    h += `<div class="empty"><h2>Jeszcze pusto</h2><p>Po zapisaniu pierwszego treningu zobaczysz tu jego przebieg, a w zakładce Postępy wykresy ciężarów dla każdego ćwiczenia.</p></div>`;
    return `<div class="wrap stack">${h}</div>`;
  }
  if (ui.hist === 'treningi'){
    let month = '';
    let list = '';
    for (const s of SESS){
      const m = fmtDate(s.date, {month:'long', year:'numeric'});
      if (m !== month){ if (list) h += `<div class="exlist">${list}</div>`; list = ''; month = m; h += `<h2 class="sec-h">${esc(m)}</h2>`; }

    }

  }
  const done = [...new Set(SESS.flatMap(s => (s.ex || []).map(x => x.exId)))];
  if (!ui.progEx || !done.includes(ui.progEx)) ui.progEx = done[0];
  const opts = done.map(id => ({id, name:getEx(id).name})).sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  h += `<div class="field"><label class="lbl" for="progex">Ćwiczenie</label><select class="input" id="progex" data-bind="progEx">${opts.map(o => `<option value="${esc(o.id)}" ${o.id === ui.progEx ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select></div>`;
  const pr = progress(ui.progEx);
  if (!pr.length) return `<div class="wrap stack">${h}</div>`;
  const tile = (l, v, u='') => `<div class="tile"><div class="l">${l}</div><div class="v">${v}${u ? ` <small>${u}</small>` : ''}</div></div>`;
  const time = pr[0].mode === 'time';
  const weighted = !time && pr.some(p => p.bestKg > 0);
  if (time){
    h += `<div class="tiles">${tile('Najdłuższa seria', fmtN(Math.max(...pr.map(p => p.best))), 's')}${tile('Ostatnio', fmtN(pr[pr.length - 1].best), 's')}${tile('Treningi', pr.length)}${tile('Łącznie', fmtClock(pr.reduce((a, p) => a + p.total, 0)))}</div>`;
  } else if (weighted){

    h += `<div class="tiles">${tile('Najcięższa seria', fmtN(best.bestKg), 'kg × ' + best.bestReps)}${tile('Szacowany max (1RM)', fmtN(Math.round(Math.max(...pr.map(p => p.e1)) * 2) / 2), 'kg')}${tile('Najwięcej powt.', Math.max(...pr.map(p => p.maxReps)))}${tile('Treningi', pr.length)}</div>`;
  } else {
    h += `<div class="tiles">${tile('Najwięcej powt. w serii', Math.max(...pr.map(p => p.maxReps)))}${tile('Ostatnio łącznie', pr[pr.length - 1].reps, 'powt.')}${tile('Treningi', pr.length)}${tile('Rekord łącznie', Math.max(...pr.map(p => p.reps)), 'powt.')}</div>`;
  }
  if (pr.length < 2){
    h += `<p class="note">Wykres pojawi się po drugim treningu z tym ćwiczeniem.</p>`;
  } else if (time){
    h += chartCard('Najdłuższa seria (s)', {type:'line', unit:'s', pts:pr.map(p => ({x:p.date, y:p.best}))});
  } else if (weighted){
    h += chartCard('Najcięższa seria (kg)', {type:'line', unit:'kg', pts:pr.map(p => ({x:p.date, y:p.bestKg, sub:`× ${p.bestReps} powt.`}))});
    h += chartCard('Objętość: kg × powtórzenia', {type:'bar', unit:'kg', pts:pr.map(p => ({x:p.date, y:Math.round(p.vol)}))});
  } else {
    h += chartCard('Suma powtórzeń na treningu', {type:'bar', unit:'powt.', pts:pr.map(p => ({x:p.date, y:p.reps}))});
  }
  const rows = [...pr].reverse().slice(0, 12).map(p => `<tr><td>${fmtDate(p.date, {day:'numeric', month:'short', year:'2-digit'})}</td><td>${p.sets.map(t => time ? fmtN(t.sec) + ' s' : (t.kg ? fmtN(t.kg) + '×' : '') + (t.reps ?? 0)).join(', ')}</td><td>${time ? fmtClock(p.total) : weighted ? fmtN(Math.round(p.vol)) : p.reps}</td></tr>`).join('');
  h += `<div class="tbl"><table><thead><tr><th>Data</th><th>Serie</th><th>${time ? 'Łącznie' : weighted ? 'Objętość' : 'Powt.'}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  return `<div class="wrap stack">${h}</div>`;
}

/* ---------- wykresy (SVG rysowane do szerokości kontenera) ---------- */
const CHARTS = new Map(); let chartSeq = 0;
function chartCard(title, spec){ const id = 'c' + (++chartSeq); CHARTS.set(id, spec); return `<section class="chart-card"><h3>${esc(title)}</h3><div class="chart" data-chart="${id}" role="img" aria-label="${esc(title)}"></div></section>`; }
function niceTicks(lo, hi, count){
  const span = hi - lo || 1; const raw = span / count; const mag = 10 ** Math.floor(Math.log10(raw)); const nr = raw / mag;
  const step = (nr < 1.5 ? 1 : nr < 3 ? 2 : nr < 7 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; const out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}
const fmtTick = v => Math.abs(v) >= 10000 ? fmtN(Math.round(v / 100) / 10) + ' tys.' : fmtN(v);
function drawCharts(){ $$('[data-chart]').forEach(h => { const s = CHARTS.get(h.dataset.chart); if (s) drawChart(h, s); }); }
function drawChart(host, spec){
  const W = Math.max(260, Math.floor(host.clientWidth || 320)), H = 196, m = {l:46, r:16, t:22, b:26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.pts.length, ys = spec.pts.map(p => p.y);
  let lo = spec.type === 'bar' ? 0 : Math.min(...ys), hi = Math.max(...ys);
  if (spec.type !== 'bar'){ const pad = (hi - lo) * 0.2 || Math.max(1, hi * 0.1); lo = Math.max(0, lo - pad); hi += pad; }
  if (hi <= lo) hi = lo + 1;
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const band = iw / n;
  const X = i => spec.type === 'bar' ? m.l + (i + 0.5) * band : (n === 1 ? m.l + iw / 2 : m.l + i * iw / (n - 1));
  const Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><g class="grid">`;
  s += ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + '</g>';
  s += ticks.map(t => `<text x="${m.l - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmtTick(t)}</text>`).join('');
  const maxLabels = Math.max(2, Math.floor(iw / 72)); const idx = [];
  if (n <= maxLabels) for (let i = 0; i < n; i++) idx.push(i); else for (let k = 0; k < maxLabels; k++) idx.push(Math.round(k * (n - 1) / (maxLabels - 1)));
  s += [...new Set(idx)].map(i => { const anc = spec.type === 'bar' || n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'; return `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${anc}">${fmtDate(spec.pts[i].x)}</text>`; }).join('');
  s += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/>`;
  if (spec.type === 'bar'){
    const bw = Math.max(4, Math.min(24, band - 2)), base = Y(y0);
    spec.pts.forEach((p, i) => {
      const x = X(i) - bw / 2, y = Y(p.y), r = Math.min(4, bw / 2, base - y);
      if (base - y < 0.5) return;
      s += `<path fill="var(--accent)" d="M${x.toFixed(1)},${base.toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + r).toFixed(1)}V${base.toFixed(1)}Z"/>`;
    });
  } else {
    const d = spec.pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += spec.pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  }
  const li = n - 1, ly = Y(spec.pts[li].y), bwEnd = spec.type === 'bar' ? Math.max(4, Math.min(24, band - 2)) / 2 : 0;
  s += `<text class="end" x="${Math.min(X(li) + bwEnd, W - 2).toFixed(1)}" y="${(ly - 9 < m.t - 6 ? ly + 18 : ly - 9).toFixed(1)}" text-anchor="end">${fmtTick(spec.pts[li].y)}</text>`;
  s += `<circle class="hl" r="6" fill="none" stroke="var(--ink)" stroke-width="2" visibility="hidden"/></svg><div class="ctip" hidden></div>`;
  host.innerHTML = s;
  const tip = $('.ctip', host), xh = $('.xh', host), hl = $('.hl', host);
  const show = e => {
    const r = host.getBoundingClientRect(); const px = e.clientX - r.left;
    let i = 0, best = Infinity; for (let k = 0; k < n; k++){ const dd = Math.abs(X(k) - px); if (dd < best){ best = dd; i = k; } }
    const p = spec.pts[i], x = X(i), y = Y(p.y);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    if (spec.type !== 'bar'){ hl.setAttribute('cx', x); hl.setAttribute('cy', y); hl.setAttribute('visibility', 'visible'); }
    tip.hidden = false; tip.innerHTML = `<b>${fmtN(p.y)} ${esc(spec.unit)}</b>${p.sub ? ' ' + esc(p.sub) : ''}<br>${fmtDate(p.x, {weekday:'short', day:'numeric', month:'short'})}`;
    tip.style.left = Math.min(Math.max(x, 70), W - 70) + 'px'; tip.style.top = Math.max(y, 40) + 'px';
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); hl.setAttribute('visibility', 'hidden'); };
  host.onpointermove = show; host.onpointerdown = show; host.onpointerleave = hide;
}

        const snap = await FB.getDocs(FB.collection(FB.db, 'folders', f.id, 'sessions'));
        await Promise.all([...new Set([...ids, ...snap.docs.map(d => d.id)])].map(id => FB.deleteDoc(FB.doc(FB.db, 'folders', f.id, 'sessions', id))));
        await FB.deleteDoc(FB.doc(FB.db, 'folders', f.id, 'data', 'state'));
        await FB.deleteDoc(FB.doc(FB.db, 'folders', f.id));
        LS.del(`dz.f.${f.id}.state`); LS.del(`dz.f.${f.id}.sessions`);
        toast('Usunięto folder.');
      } catch { toast('Nie udało się usunąć wszystkiego. Spróbuj ponownie z internetem.'); }
    });
  },
  closeSheet(){ closeSheet(); },
  confirmOk(){ const s = topSheet(); sheets.pop(); s.run(); renderSheet(); },
  /* plany */
  newPlan(){ const p = {id:uid(), name:nextPlanName(), items:[]}; S.plans.push(p); ui.planId = p.id; ui.openItem = null; location.hash = 'plany'; commit(); setTimeout(() => $('#pn-' + p.id)?.select(), 50); },
  loadSample(){ S.plans.push(...samplePlans()); commit(); toast('Dodano plany „FBW A” i „FBW B”. Dopasuj ciężary w edycji planu.'); },
  planMove(el){ const p = planById(el.dataset.plan); move(S.plans, S.plans.indexOf(p), +el.dataset.dir); commit(); },
  editPlan(el){ ui.planId = el.dataset.plan; ui.openItem = null; if (ui.tab !== 'plany') location.hash = 'plany'; else render(); scrollTo(0, 0); },
  closePlan(){ ui.planId = null; render(); },
  planDel(el){ const p = planById(el.dataset.plan); confirmBox('Usunąć plan?', `Plan „${p.name || 'bez nazwy'}” zniknie. Historia treningów zostanie.`, 'Usuń plan', () => { S.plans = S.plans.filter(x => x !== p); ui.planId = null; commit(); }); },
  toggleItem(el){ ui.openItem = ui.openItem === el.dataset.item ? null : el.dataset.item; render(); },
  itemMode(el){ const {it} = itemRef(el); const m = el.dataset.mode; if (it.mode === m) return; it.mode = m; it.sets = it.sets.map(s => m === 'time' ? {sec:30, kg:s.kg ?? null} : {reps:10, kg:s.kg ?? null}); commit(); },
  psetAdd(el){ const {it} = itemRef(el); const l = it.sets[it.sets.length - 1]; it.sets.push(l ? {...l} : it.mode === 'time' ? {sec:30, kg:null} : {reps:10, kg:null}); commit(); },
  psetDel(el){ const {it} = itemRef(el); if (it.sets.length <= 1){ toast('Ćwiczenie musi mieć co najmniej jedną serię.'); return; } it.sets.splice(+el.dataset.i, 1); commit(); },
  restStep(el){ const {it} = itemRef(el); const f = el.dataset.f; it[f] = Math.max(0, Math.min(600, (it[f] ?? 0) + +el.dataset.d)); commit(); },
  itemMove(el){ const {p, it} = itemRef(el); move(p.items, p.items.indexOf(it), +el.dataset.dir); commit(); },
  orderApply(el){ const p = planById(el.dataset.plan); if (!p) return; p.items = suggestOrder(p).sorted.map(x => x.it); delete p.orderOk; commit(); toast('Ułożono ćwiczenia w sugerowanej kolejności'); },
  orderKeep(el){ const p = planById(el.dataset.plan); if (!p) return; p.orderOk = orderSig(p); commit(); },
  orderShow(el){ const p = planById(el.dataset.plan); if (!p) return; delete p.orderOk; commit(); },
  orderWhy(){ ui.orderWhy = !ui.orderWhy; render(); },
  itemDel(el){ const {p, it} = itemRef(el); confirmBox('Usunąć ćwiczenie z planu?', getEx(it.exId).name, 'Usuń', () => { p.items = p.items.filter(x => x !== it); commit(); }); },
  pickForPlan(el){ openSheet({type:'pick', target:{kind:'plan', plan:el.dataset.plan}, q:'', group:'', sel:[]}); },
  pickToggle(el){ const s = topSheet(); const id = el.dataset.id; s.sel = s.sel.includes(id) ? s.sel.filter(x => x !== id) : [...s.sel, id]; const row = el.closest('.pickrow'); row.classList.toggle('sel'); el.setAttribute('aria-pressed', s.sel.includes(id)); const b = $('#pickAddBtn'); b.disabled = !s.sel.length; b.textContent = 'Dodaj' + (s.sel.length ? ' (' + s.sel.length + ')' : ''); },
  pickGroup(el){ const s = topSheet(); s.group = el.dataset.g; $$('.chip', $('#sheet')).forEach(c => c.setAttribute('aria-pressed', c.dataset.g === s.group)); fillPickList(); },
  pickAdd(){
    const s = topSheet(); if (!s.sel.length) return;
    if (s.target.kind === 'plan'){ const p = planById(s.target.plan); s.sel.forEach(id => p.items.push(newItem(id))); sheets.pop(); renderSheet(); commit(); toast(`Dodano ${s.sel.length} ${pl(s.sel.length,'ćwiczenie','ćwiczenia','ćwiczeń')}.`); }
    else { s.sel.forEach(id => ACTIVE.ex.push(newWorkoutEx(id))); saveActive(); sheets.pop(); renderSheet(); renderWorkout(); }
  },
  /* ćwiczenia */
  exGroup(el){ ui.exGroup = el.dataset.g; render(); },
  exOpen(el){ openSheet({type:'ex', id:el.dataset.id}); },
  exInfo(el){ openSheet({type:'ex', id:el.dataset.id, noAdd:true}); },
  animPlay(){ animSetPlaying(!AP.playing); },
  animSlow(el){ AP.slow = !AP.slow; el.setAttribute('aria-pressed', AP.slow); },
  mediaToggle(el){ const f = el.closest('.media'); if (reduced){ const on = f.classList.toggle('show-b'); el.textContent = on ? 'Pokaż początek ruchu' : 'Pokaż koniec ruchu'; } else { const p = f.classList.toggle('paused'); el.textContent = p ? 'Odtwórz' : 'Zatrzymaj'; } },
  exAddToPlan(el){ openSheet({type:'addToPlan', id:el.dataset.id}); },
  addToPlanGo(el){ const p = planById(el.dataset.plan); p.items.push(newItem(el.dataset.id)); persist(); sheets.length = 0; renderSheet(); render(); toast(`Dodano do: ${p.name || 'Plan bez nazwy'}`); },
  newPlanWith(el){ const p = {id:uid(), name:nextPlanName(), items:[newItem(el.dataset.id)]}; S.plans.push(p); persist(); sheets.length = 0; renderSheet(); ui.planId = p.id; location.hash = 'plany'; render(); },
  customNew(){ openSheet({type:'custom', f:{name:'', group:ui.exGroup || GROUPS[0], equipment:'Maszyna', mode:'reps', steps:'', tips:''}}); },
  customEdit(el){ const e = getEx(el.dataset.id); sheets.pop(); openSheet({type:'custom', editId:e.id, f:{name:e.name, group:e.group, equipment:e.equipment, mode:e.mode, steps:(e.steps || []).join('\n'), tips:(e.tips || []).join('\n')}}); },
  cfMode(el){ const s = topSheet(); s.f.mode = el.dataset.mode; $$('[data-act="cfMode"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === s.f.mode)); },
  customSave(){
    const s = topSheet(); const f = s.f; if (!f.name.trim()){ toast('Wpisz nazwę ćwiczenia.'); $('#cf-name')?.focus(); return; }
    const lines = t => String(t || '').split('\n').map(x => x.trim()).filter(Boolean);
    const data = {name:f.name.trim(), group:f.group, equipment:f.equipment, mode:f.mode, steps:lines(f.steps), tips:lines(f.tips), primary:[], secondary:[], custom:true, level:''};
    if (s.editId){ Object.assign(S.custom.find(c => c.id === s.editId), data); }
    else S.custom.push({id:'c_' + uid(), ...data});
    sheets.pop(); renderSheet(); commit(); toast('Zapisano ćwiczenie.');
  },
  customDel(el){ const id = el.dataset.id; confirmBox('Usunąć własne ćwiczenie?', 'Zniknie też ze wszystkich planów. Historia treningów zostanie.', 'Usuń', () => { S.custom = S.custom.filter(c => c.id !== id); S.plans.forEach(p => { p.items = p.items.filter(i => i.exId !== id); }); sheets.length = 0; commit(); }); },
  /* historia */
  hist(el){ ui.hist = el.dataset.v; render(); },
  sessOpen(el){ openSheet({type:'session', id:el.dataset.id}); },
  sessDel(el){ const id = el.dataset.id; confirmBox('Usunąć trening z historii?', 'Tej operacji nie można cofnąć.', 'Usuń', async () => { sheets.length = 0; renderSheet(); await deleteSession(id); render(); }); },
  /* ustawienia */
  setStep(el){ const f = el.dataset.f; S.settings[f] = Math.max(0, Math.min(600, S.settings[f] + +el.dataset.d)); persist(); renderSheet(); },
  exportCopy(){
    const data = JSON.stringify({app:'dziennik-silowni', v:1, exported:new Date().toISOString(), state:S, sessions:SESS});
    const ta = $('#exp'); ta.value = data; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); toast('Zaznaczyłem dane. Skopiuj je ręcznie.'); };
    try { navigator.clipboard.writeText(data).then(() => toast('Skopiowano dane do schowka.'), fallback); } catch { fallback(); }
  },
  importAsk(){
    let d; try { d = JSON.parse($('#imp').value); } catch { toast('To nie wygląda na kopię danych z tej aplikacji.'); return; }
    if (!d || d.app !== 'dziennik-silowni' || !d.state){ toast('To nie wygląda na kopię danych z tej aplikacji.'); return; }
    confirmBox('Przywrócić dane z kopii?', 'Plany, własne ćwiczenia i ustawienia zostaną zastąpione kopią. Treningi z kopii zostaną dodane do historii.', 'Przywróć', async () => {
      S = normalize(d.state); commit();
      const have = new Set(SESS.map(s => s.id));
      for (const s of (d.sessions || []).filter(s => s && s.id && !have.has(s.id))) await saveSession(s);
      sheets.length = 0; renderSheet(); render(); toast('Przywrócono dane.');
    }, false);
  },
  /* trening */
  startPlan(el){
    const p = planById(el.dataset.plan);
    if (!p || !p.items.length){ toast('Najpierw dodaj ćwiczenia do tego planu.'); return; }
    audioUnlock();
    if (ACTIVE) confirmBox('Masz trening w toku', `„${ACTIVE.dayName}” nie jest zapisany. Rozpocząć nowy trening i odrzucić tamten?`, 'Odrzuć i zacznij nowy', () => { ACTIVE = null; startWorkoutFrom(p); });
    else startWorkoutFrom(p);
  },
  openWorkout(){ ui.showWorkout = true; audioUnlock(); requestWake(); renderWorkout(); },
  minWorkout(){ ui.showWorkout = false; releaseWake(); renderWorkout(); render(); },
  finishOpen(){ openSheet({type:'finish', upd:false}); },
  finishSave(){
    const s = buildSession(); if (!s.ex.length) return;
    const upd = $('#fin-upd')?.checked; const p = planById(ACTIVE.planId);
    if (upd && p){
      for (const x of ACTIVE.ex){ const it = p.items.find(i => i.id === x.itemId); const done = x.sets.filter(q => q.done); if (!it || !done.length) continue;
        it.mode = x.mode; it.rest = x.rest; it.sets = done.map(q => x.mode === 'time' ? {sec:q.sec ?? 30, kg:q.kg ?? null} : {reps:q.reps ?? 10, kg:q.kg ?? null}); }
      persist();
    }
    saveSession(s); endWorkout(); toast('Trening zapisany.');
  },
  discardAsk(){ confirmBox('Odrzucić trening?', 'Wpisane serie nie zostaną zapisane w historii.', 'Odrzuć trening', () => { endWorkout(); toast('Trening odrzucony.'); }); },
  toggleSet(el){
    audioUnlock(); const i = +el.dataset.i, j = +el.dataset.j; const x = ACTIVE.ex[i], s = x.sets[j];
    s.done = !s.done;
    if (s.done){
      if (x.mode !== 'time' && s.reps == null && s.tReps != null) s.reps = s.tReps;
      afterSetDone(i);
    } else if (ACTIVE.timer && ACTIVE.timer.kind === 'rest' && ACTIVE.timer.focus === i) ACTIVE.timer = null;
    saveActive(); renderWorkout();
  },
  startWork(el){
    audioUnlock(); const i = +el.dataset.i, j = +el.dataset.j; const s = ACTIVE.ex[i].sets[j];
    const sec = s.sec ?? s.tSec ?? 30; s.sec = sec;
    startTimer('work', sec, 'Seria w toku', i, {i, j}); saveActive(); renderWorkout();
  },
  stopWork(){
    const T = ACTIVE.timer; if (!T || T.kind !== 'work') return;
    const s = ACTIVE.ex[T.i].sets[T.j]; s.sec = Math.max(1, Math.round((Date.now() - (T.endsAt - T.total * 1000)) / 1000)); s.done = true;
    T.fired = true; afterSetDone(T.i); saveActive(); renderWorkout();
  },
  wAddSet(el){ const x = ACTIVE.ex[+el.dataset.i]; const l = x.sets[x.sets.length - 1] || {}; x.sets.push({tReps:l.tReps ?? null, tKg:l.tKg ?? null, tSec:l.tSec ?? null, reps:l.reps ?? null, kg:l.kg ?? null, sec:l.sec ?? null, done:false}); saveActive(); renderWorkout(); },
  wDelSet(el){ const x = ACTIVE.ex[+el.dataset.i]; if (x.sets.length <= 1) return; let k = -1; for (let n = x.sets.length - 1; n >= 0; n--) if (!x.sets[n].done){ k = n; break; } x.sets.splice(k < 0 ? x.sets.length - 1 : k, 1); saveActive(); renderWorkout(); },
  wRest(el){ const x = ACTIVE.ex[+el.dataset.i]; x.rest = Math.max(0, Math.min(600, x.rest + +el.dataset.d)); saveActive(); renderWorkout(); },
  wMenu(el){ const k = ACTIVE.ex[+el.dataset.i].key; ui.wMenu = ui.wMenu === k ? null : k; renderWorkout(); },
  wMove(el){ const i = +el.dataset.i, T = ACTIVE.timer;
    const fKey = T && T.focus != null ? ACTIVE.ex[T.focus]?.key : null, wKey = T && T.kind === 'work' ? ACTIVE.ex[T.i]?.key : null;
    move(ACTIVE.ex, i, +el.dataset.dir);
    if (fKey) T.focus = ACTIVE.ex.findIndex(x => x.key === fKey); if (wKey) T.i = ACTIVE.ex.findIndex(x => x.key === wKey);
    saveActive(); renderWorkout(); },
  wDelEx(el){ const i = +el.dataset.i; const x = ACTIVE.ex[i]; confirmBox('Usunąć ćwiczenie z treningu?', getEx(x.exId).name + ' zniknie z dzisiejszego treningu. Plan się nie zmieni.', 'Usuń', () => { ACTIVE.ex.splice(i, 1); ACTIVE.timer = null; ui.wMenu = null; saveActive(); renderWorkout(); }); },
  wAddEx(){ openSheet({type:'pick', target:{kind:'workout'}, q:'', group:'', sel:[]}); },
  tbStart(){ audioUnlock(); const i = Math.max(0, curIndex()); const x = ACTIVE.ex[i]; startTimer('rest', x ? x.rest : S.settings.restSet, 'Przerwa między seriami', i); saveActive(); updateTimer(); },
  tbAdj(el){ const T = ACTIVE.timer; if (!T) return; T.endsAt += +el.dataset.d * 1000; T.total = Math.max(1, T.total + +el.dataset.d); if (T.endsAt <= Date.now()){ T.fired = true; ACTIVE.timer = null; } saveActive(); updateTimer(); },
  tbSkip(){ const T = ACTIVE.timer; ACTIVE.timer = null; saveActive(); renderWorkout(); if (T){ const x = ACTIVE.ex[T.focus]; const c = x && $('#wex-' + x.key); if (c) c.scrollIntoView({behavior:reduced ? 'auto' : 'smooth', block:'start'}); } },
};
const BIND = {
  exq(t){ ui.exQ = t.value; fillExList(); },
  exeq(t){ ui.exEquip = t.value; fillExList(); },
  pickq(t){ topSheet().q = t.value; fillPickList(); },
  planName(t){ const p = planById(t.dataset.plan); if (p){ p.name = t.value; persist(); } },
  pset(t){ const {it} = itemRef(t); if (!it) return; it.sets[+t.dataset.i][t.dataset.f] = num(t.value); persist();
    const m = $(`.item-h[data-item="${it.id}"] .meta`); if (m) m.textContent = setsSummary(it); },
  note(t){ const {it} = itemRef(t); if (it){ it.note = t.value; persist(); } },
  wset(t){ const i = +t.dataset.i; const s = ACTIVE?.ex[i]?.sets[+t.dataset.j]; if (!s) return; s[t.dataset.f] = num(t.value); saveActive();
    if (t.dataset.f === 'kg'){ const p = $(`[data-plates="${i}"]`); if (p) p.outerHTML = platesHTML(i); } },
  progEx(t){ ui.progEx = t.value; render(); },
  setting(t){ const f = t.dataset.f; S.settings[f] = t.type === 'checkbox' ? t.checked : num(t.value); persist(); },
  cf(t){ topSheet().f[t.dataset.f] = t.value; },
  finUpd(t){ topSheet().upd = t.checked; },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (fn){ e.preventDefault(); fn(t, e); }
});
const onBind = e => { const t = e.target; if (t.dataset && t.dataset.bind && BIND[t.dataset.bind]){ if (e.type === 'change' && t.type !== 'checkbox' && t.tagName !== 'SELECT') return; if (e.type === 'input' && (t.type === 'checkbox' || t.tagName === 'SELECT')) return; BIND[t.dataset.bind](t, e); } };
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && topSheet()) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.id === 'newfolder'){ e.preventDefault(); ACT.folderCreate(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'rnfolder'){ e.preventDefault(); ACT.folderRename(); }
});

function route(){
  const h = location.hash.replace('#', '');
  ui.tab = TABS.some(t => t.id === h) ? h : 'trening';
  if (ui.tab !== 'plany') ui.openItem = null;
  render(); scrollTo(0, 0);
}
addEventListener('hashchange', route);
ui.showWorkout = !!ACTIVE;
route();
initStore();
</script>

<script>
if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
