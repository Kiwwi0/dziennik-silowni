<title>Dziennik siłowni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Układ: aplikacja mobilna w jednej kolumnie (max 680 px) z dolnym paskiem zakładek;
   trening to pełnoekranowa nakładka z przyklejonym paskiem timera przerw. */
:root{
  --bg:#E8EBEE; --surface:#FFFFFF; --surface-2:#F2F4F6; --ink:#13171B; --ink-2:#434C55; --muted:#646D76; --line:#D2D7DC;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DDE6FB;
  --good:#15784A; --good-ink:#FFFFFF; --good-soft:#D7EFE2; --bad:#B42318; --bad-soft:#FBE2DE; --warn:#8F5200; --warn-soft:#FCEBCB;
  --tb-bg:#13171B; --tb-ink:#F2F4F6; --tb-muted:#A3ACB5; --tb-line:#3A4148; --tb-warn:#F2C230; --tb-over:#2FA36B; --tb-over-ink:#06150D;
  --plate-25:#C8102E; --plate-20:#1D4ED8; --plate-15:#E5B000; --plate-10:#178A45; --plate-5:#F4F4F1; --plate-s:#3B4148;
  --scrim:rgba(10,14,18,.45);
  --body:#DCE1E6; --body-line:#BCC4CC; --muscle:#C3CBD3; --hl:#E11D2E; --hl2:#F49AA0; --bm-muscle:#3E444B; --bm-skin:#B9C0C7; --wk-low:#8FD3AE;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --surface:#171B1F; --surface-2:#1F2429; --ink:#ECEFF2; --ink-2:#BCC4CB; --muted:#8C969F; --line:#2B3238;
  --accent:#7D9DFF; --accent-ink:#0A1024; --accent-soft:#1C2847;
  --good:#4CC386; --good-ink:#06150D; --good-soft:#12301F; --bad:#FF8B7B; --bad-soft:#3A1714; --warn:#F2B654; --warn-soft:#382912;
  --tb-bg:#E6EAEE; --tb-ink:#101316; --tb-muted:#56606A; --tb-line:#C3CAD1; --tb-warn:#8A5A00; --tb-over:#4CC386; --tb-over-ink:#06150D;
  --plate-5:#E9E9E4; --plate-s:#59616A; --scrim:rgba(0,0,0,.6); --body:#2A3137; --body-line:#3A434B; --muscle:#3B444C; --hl:#EF2B3C; --hl2:#F49AA0; --bm-muscle:#5A626B; --bm-skin:#7C858E; --wk-low:#2F6B4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#171B1F; --surface-2:#1F2429; --ink:#ECEFF2; --ink-2:#BCC4CB; --muted:#8C969F; --line:#2B3238;
  --accent:#7D9DFF; --accent-ink:#0A1024; --accent-soft:#1C2847;
  --good:#4CC386; --good-ink:#06150D; --good-soft:#12301F; --bad:#FF8B7B; --bad-soft:#3A1714; --warn:#F2B654; --warn-soft:#382912;
  --tb-bg:#E6EAEE; --tb-ink:#101316; --tb-muted:#56606A; --tb-line:#C3CAD1; --tb-warn:#8A5A00; --tb-over:#4CC386; --tb-over-ink:#06150D;
  --plate-5:#E9E9E4; --plate-s:#59616A; --scrim:rgba(0,0,0,.6); --body:#2A3137; --body-line:#3A434B; --muscle:#3B444C; --hl:#EF2B3C; --hl2:#F49AA0; --bm-muscle:#5A626B; --bm-skin:#7C858E; --wk-low:#2F6B4C; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}

/* pasek górny */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.appbar .wrap{display:flex;align-items:flex-end;gap:12px;padding-block:14px 10px}
.appbar .ttl{flex:1;min-width:0}
.brand{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.appbar h1{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
.iconbtn.sm{width:36px;height:36px;border-radius:9px}
.iconbtn.plain{border-color:transparent;background:transparent}
.who{display:inline-flex;align-items:center;gap:6px;max-width:42vw;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* zakładki */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;text-decoration:none}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* przyciski i pola */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.fill{background:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;padding:0 8px}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.field{display:grid;gap:6px}
.lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.input{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:96px;resize:vertical;line-height:1.4}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:42px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper b{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

/* sekcje, karty */
main{padding-block:2px 28px}
.sec-h{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 0;display:flex;align-items:baseline;gap:8px}
.sec-h .n{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:12px}
.empty h2{font-family:var(--f-display);font-size:26px;text-transform:uppercase;line-height:1;margin:0}
.empty p{margin:0;color:var(--ink-2);max-width:52ch}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

/* miniatury i animacja ruchu */
.thumb{display:block;width:60px;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:#fff;border:1px solid var(--line);flex:none}
.thumb img{display:block;width:100%;height:auto}
.thumb.ph{display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--muted)}
.media{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.media .frames{display:block;position:relative;aspect-ratio:3/2;overflow:hidden}
.media .frames img{position:absolute;left:0;top:0;width:100%;height:auto}
.media .frames img.b{transform:translateY(-50%);animation:frame 2.8s ease-in-out infinite}
@keyframes frame{0%,36%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
.media.paused .frames img.b{animation-play-state:paused}
.media .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.media .ctl button{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:rgba(19,23,27,.78);color:#fff;font-size:12.5px;font-weight:600}
.media .ph-big{aspect-ratio:3/2;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-family:var(--f-display);font-size:48px;font-weight:800}
@media (prefers-reduced-motion: reduce){
  .media .frames img.b{animation:none;opacity:0}
  .media.show-b .frames img.b{opacity:1}
}

/* lista ćwiczeń */
.exlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.exlist > :first-child, .exlist > :first-child .exrow{border-top:0}
.exrow .nm{font-weight:600;line-height:1.25}
.exrow .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted)}
.pickrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--line)}
.pickrow .exrow{border-top:0}
.pickrow.sel{background:var(--accent-soft)}
.pickrow .info{margin-right:8px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pickrow.sel .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* szczegóły ćwiczenia */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.ex-title{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;margin:0}
.h3{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;margin:6px 0 0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;color:var(--accent)}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.muscles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.muscles dt{color:var(--muted)} .muscles dd{margin:0;font-weight:600}
.bodymap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px 8px}
.bodymap.bm-has3d{display:grid;gap:8px}
.bm-seg{display:inline-flex;justify-self:center;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface-2)}
.bm-seg button{min-height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);cursor:pointer}
.bm-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.bm3d{position:relative;display:grid;gap:6px}
.bm3d-host{display:block;height:min(58vh,440px);min-height:340px;cursor:grab}
.bm3d-host canvas{display:block}
.bm3d-msg{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.bm3d-bar{display:flex;gap:6px;justify-content:center}
.bm3d-hint{font-size:12px;color:var(--muted);text-align:center}
.bm-figs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:400px;margin:0 auto}
.bm-fig{display:grid;gap:2px;justify-items:center}
.bm-fig svg{display:block;width:100%;height:auto}
.bm-cap{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bodymap .ol{fill:var(--surface);stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
.bodymap .k{fill:var(--bm-skin)}
.bodymap .m{fill:var(--bm-muscle)}
.bodymap .m.p1{fill:var(--hl)} .bodymap .m.p2{fill:var(--hl2)}
.bodymap .sp{stroke:var(--surface);stroke-width:6}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* plany */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan-h{display:flex;align-items:center;gap:8px;padding:12px 14px}
.plan-h h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.dayrow .dn{font-weight:700}
.plan > .dayrow:first-child,.day > .item:first-child{border-top:0}
.plan-link{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.dayrow .dm{font-size:12.5px;color:var(--muted)}
/* przesuń w lewo, żeby usunąć plan */
.sw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.plan > .sw:first-child{border-top:0}
.sw > .plan-link{position:relative;z-index:1;border-top:0;background:var(--surface);touch-action:pan-y;transition:transform .2s ease}
.sw.drag > .plan-link{transition:none}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--bad);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sw-del .i{stroke:#fff}
@media (prefers-reduced-motion: reduce){.sw > .plan-link{transition:none}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 14px}
.day-h{display:flex;gap:6px;align-items:center;padding-block:10px}
.day-h .input{font-weight:700}
.item{border-top:1px solid var(--line)}
.item.ss{box-shadow:inset 4px 0 0 var(--accent);padding-left:8px}
.item.ss:not(.ss-a){border-top:1px dashed var(--line)}
.ss-lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:10px 0 0}
.item-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;background:none;text-align:left}
.item-h .nm{font-weight:600;line-height:1.25}
.item-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.item-b{display:grid;gap:14px;padding:4px 0 16px}
.ptable{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.prow.head{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prow .input{text-align:center;font-variant-numeric:tabular-nums;padding:8px}
.prow .sn{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.rests{display:grid;gap:8px}
.rests > div{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oc{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.oc p{margin:0;color:var(--ink-2)}
.oc .row{flex-wrap:wrap}
.oc-h{display:flex;gap:8px;align-items:center;color:var(--accent)}
.oc-h b{color:var(--ink);font-size:15px}
.oc.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.oc.ok .oc-h{color:var(--good)}
.oc.mine{background:none;border:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 6px 6px 14px}
.oc-list{margin:0;padding:0;list-style:none;counter-reset:oc;display:grid;gap:2px;background:var(--surface);border-radius:10px;padding:4px 0}
.oc-list li{counter-increment:oc;display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:7px 10px}
.oc-list li::before{content:counter(oc) ".";grid-row:span 2;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;align-self:start}
.oc-list .nm{font-weight:600;line-height:1.25;grid-column:2}
.oc-list .osub{grid-column:2;font-size:12px;color:var(--muted)}
.oc-list .mv{grid-column:3;grid-row:1 / span 2;display:inline-flex;align-items:center;gap:1px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 6px 2px 2px;border-radius:999px}
.oc-list .mv .i{width:16px;height:16px}
.oc-list .mv.up{color:var(--good);background:var(--good-soft)}
.oc-list .mv.dn{color:var(--ink-2);background:var(--surface-2)}
.oc-list li.moved .nm{color:var(--ink)}
.oc-list li:not(.moved) .nm{color:var(--ink-2);font-weight:500}
.oc-why{margin:0;padding-left:18px;display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.oc-why b{color:var(--ink)}

/* trening na żywo */
.live{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px}
.live .t{flex:1;min-width:0}
.live b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;line-height:1.05}
.live .btn{background:var(--bg);color:var(--ink);border-color:transparent}
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.wo-h{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.wo-h .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.wo-t{flex:1;min-width:0}
.wo-t b{display:block;font-family:var(--f-display);font-size:23px;font-weight:800;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-t span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  FOLDER = null; LS.del('dz.folder'); S = blankState(); SESS = []; ui.planId = null; shareKnown = null; shareSent.clear();
}
function openFolder(f){
  if (unsubState) unsubState(); if (unsubSess) unsubSess();
  FOLDER = {id:f.id, name:f.name}; LS.set('dz.folder', FOLDER);
  S = normalize(LS.get(lsKey('state'), null)); SESS = sortSess(LS.get(lsKey('sessions'), []));
  store.ready = false; store.dirty = false; ui.planId = null; ui.openItem = null; shareKnown = null; shareSent.clear();
  const fid = f.id;
  unsubState = FB.onSnapshot(FB.doc(FB.db, 'folders', fid, 'data', 'state'), snap => {
    if (!FOLDER || FOLDER.id !== fid) return;
    if (!snap.exists()){
      if (!snap.metadata.fromCache){ store.ready = true; shareSeen(); render(); maybeMoveLocalData(); }
      return;
    }
    const first = !store.ready; store.ready = true;
    if (store.dirty) return;
    const inc = normalize(snap.data());
    if (JSON.stringify(inc) !== JSON.stringify(S)){ S = inc; LS.set(lsKey('state'), S); shareSeen(); render(); }
    else if (first){ shareSeen(); render(); }
    if (first && topSheet() && topSheet().type === 'shareImp') renderSheet();
  }, err => {
    if (err && err.code === 'permission-denied' && FOLDER && FOLDER.id === fid){
      LS.del(accKey(fid)); const f = FOLDER; closeFolder(); render(); requestFolder(f, true);
    } else toast('Nie udało się wczytać planów z bazy.');
  });
  unsubSess = FB.onSnapshot(FB.query(FB.collection(FB.db, 'folders', fid, 'sessions'), FB.orderBy('date', 'desc'), FB.limit(1000)), snap => {
    if (!FOLDER || FOLDER.id !== fid) return;
    if (snap.metadata.fromCache && snap.empty && SESS.length) return;
    const list = sortSess(snap.docs.filter(d => d.id !== ACTIVE_DOC).map(d => ({...d.data(), id:d.id})));
    if (JSON.stringify(list) === JSON.stringify(SESS)) return;
    SESS = list; LS.set(lsKey('sessions'), SESS); render();
  }, () => {});
  watchActive(fid);
  render();
  if (SHARE_PENDING){ const c = SHARE_PENDING; SHARE_PENDING = null; setTimeout(() => openShareImport(c), 300); }
}
/* ---------- udostępnianie planów kodem: shares/{KOD} ----------
   Kod powstaje dopiero po „Udostępnij” i zostaje przy planie (p.share). Dokument trzyma kopię planu i użyte w nim własne
   ćwiczenia; aktualizuje się po każdej zmianie planu (syncShares w flush), znika po „Przestań udostępniać”, usunięciu planu
   albo konta. Odczyt: każdy, kto zna dokładny kod (bez listy kodów). Zapis: tylko urządzenia z dostępem do konta (reguły). */
const SHARE_ABC = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';   // bez 0/O, 1/I/L – łatwo przepisać
const SHARE_RE = /^[2-9A-HJKMNP-Z]{6}$/;
const shareFmt = c => c.slice(0, 3) + '-' + c.slice(3);
const shareClean = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
const shareLink = c => location.origin + location.pathname + '?plan=' + c;
function shareNewCode(){ return [...crypto.getRandomValues(new Uint8Array(6))].map(x => SHARE_ABC[x % SHARE_ABC.length]).join(''); }
let SHARE_PENDING = null, shareBusy = false, shareKnown = null;
const shareSent = new Map();   // kod → treść ostatnio wysłana do bazy
try {
  const q = new URLSearchParams(location.search).get('plan');
  if (q){ SHARE_PENDING = shareClean(q); history.replaceState(null, '', location.pathname + location.hash); }
} catch {}
function sharePayload(p){
  const items = p.items.map(({id, ...it}) => it);
  const ids = new Set(items.map(i => i.exId));
  return clone({fid:FOLDER.id, from:FOLDER.name, plan:{name:p.name || '', items}, custom:S.custom.filter(c => ids.has(c.id)), updatedAt:Date.now()});
}
const shareKey = d => JSON.stringify([d.from, d.plan, d.custom]);
function shareSeen(){   // stan przyszedł z bazy – kody w nim są już zsynchronizowane
  if (!FOLDER) return;
  shareKnown = new Set();
  for (const p of S.plans) if (p.share){ shareKnown.add(p.share); shareSent.set(p.share, shareKey(sharePayload(p))); }
}
function syncShares(){
  if (!fireOn() || !store.ready) return;
  const now = new Set();
  for (const p of S.plans){
    if (!p.share || now.has(p.share)) continue;
    now.add(p.share);
    const d = sharePayload(p), k = shareKey(d);
    if (shareSent.get(p.share) === k) continue;
    shareSent.set(p.share, k);
    FB.setDoc(FB.doc(FB.db, 'shares', p.share), d).catch(() => shareSent.delete(p.share));
  }
  for (const c of shareKnown || []) if (!now.has(c)){ shareSent.delete(c); FB.deleteDoc(FB.doc(FB.db, 'shares', c)).catch(() => {}); }
  shareKnown = now;
}
// dane z cudzego kodu – nie ufamy im: tylko znane pola, rozsądne długości i limity
function shareSanitize(d){
  if (!d || typeof d !== 'object' || !d.plan || !Array.isArray(d.plan.items)) return null;
  const str = (v, n) => String(v ?? '').slice(0, n);
  const num = (v, a, b, def) => Number.isFinite(+v) && v !== null && v !== '' ? Math.min(b, Math.max(a, +v)) : def;
  const strs = v => Array.isArray(v) ? v.slice(0, 30).map(x => str(x, 300)) : [];
  const custom = (Array.isArray(d.custom) ? d.custom : []).filter(c => c && /^c_[a-z0-9]{1,30}$/.test(c.id)).slice(0, 60).map(c => ({
    id:c.id, name:str(c.name, 80) || 'Ćwiczenie', group:str(c.group, 40), equipment:str(c.equipment, 40), mode:c.mode === 'time' ? 'time' : 'reps',
    steps:strs(c.steps), tips:strs(c.tips), primary:strs(c.primary), secondary:strs(c.secondary), custom:true, level:str(c.level, 20)}));
  const items = d.plan.items.filter(it => it && typeof it.exId === 'string').slice(0, 60).map(it => ({
    exId:str(it.exId, 120), mode:it.mode === 'time' ? 'time' : 'reps',
    rest:num(it.rest, 0, LIM.sec, S.settings.restSet), restAfter:num(it.restAfter, 0, LIM.sec, S.settings.restEx), note:str(it.note, 500), ssNext:!!it.ssNext,
    sets:clampSets((Array.isArray(it.sets) ? it.sets : []).slice(0, MAX_SETS).filter(t => t && typeof t === 'object')
      .map(t => it.mode === 'time' ? {sec:num(t.sec, 0, LIM.sec, 30), kg:num(t.kg, 0, LIM.kg, null)} : {reps:num(t.reps, 0, LIM.reps, 10), kg:num(t.kg, 0, LIM.kg, null)}))}));
  if (!items.length) return null;
  return {from:str(d.from, 40), name:str(d.plan.name, 60), items, custom};
}
function shareExName(d, id){
  const c = d.custom.find(x => x.id === id) || S.custom.find(x => x.id === id);
  return c ? c.name : EXMAP.has(id) ? getEx(id).name : 'Nieznane ćwiczenie';
}

/* ---------- PIN folderu ----------
   folders/{id}.pin = true, gdy folder ma PIN; skrót PIN-u w folders/{id}/secret/pin (nikt go nie odczyta).
   Urządzenie dostaje dostęp, zapisując folders/{id}/members/{uid} z tym samym skrótem – reguły bazy porównują go z sekretem.
   Reset (zapomniany PIN): w konsoli Firebase usuń dokument secret/pin i pole pin w folderze – wtedy można ustawić nowy. */
const accKey = fid => `dz.acc.${fid}`;
async function pinHash(fid, pin){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`dziennik-silowni:${fid}:${pin}`));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function pinMode(s){
  if (s.del) return 'del';
  if (s.isNew) return 'new';
  const f = FOLDERS.find(x => x.id === s.id);
  if (f) return f.pin ? 'enter' : 'set';
  return store.foldersReady ? 'set' : 'wait';
}
function askPin(f, isNew=false){
  sheets.length = 0; openSheet({type:'pin', id:f.id, name:f.name, isNew, err:'', busy:false});
  setTimeout(() => $('#pin1')?.focus(), 80);
}
async function requestFolder(f, skipCheck=false){
  if (!skipCheck && LS.get(accKey(f.id), false)){ openFolder(f); return; }
  if (!skipCheck && FB.uid){
    try {
      const m = await FB.getDoc(FB.doc(FB.db, 'folders', f.id, 'members', FB.uid));
      if (m.exists()){ LS.set(accKey(f.id), true); openFolder(f); return; }
    } catch {}
  }
  askPin(f);
}
const withTimeout = (p, ms=12000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]);
function maybeMoveLocalData(){
  if (LS.get('dz.movedLocal', false) || hasData(S) || SESS.length) return;
  const st = normalize(LS.get('dz.state', null)), ss = LS.get('dz.sessions', []) || [];

    LS.set('dz.movedLocal', true);
    S = st; persist(); sortSess(ss).forEach(x => saveSession(x)); render(); toast('Przeniesiono dane do konta.');
  }, false);
}

const newFolderField = () => `<div class="field"><label class="lbl" for="newfolder">Nowa osoba</label><div class="row" style="flex-wrap:nowrap"><input class="input" id="newfolder" maxlength="40" placeholder="Imię, np. Olek" autocomplete="off"><button class="btn primary" data-act="folderCreate">Dodaj</button></div></div>`;
async function initStore(){
  if (FIRE){
    render();
    try { await initFirebase(); }
    catch { store.fireError = true; render(); return; }
    watchFolders();
    if (FOLDER){ const f = FOLDER; if (LS.get(accKey(f.id), false)) openFolder(f); else { closeFolder(); render(); requestFolder(f); } }
    return;
  }
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]); } catch {}
  let id = null;
  try { id = user ? await user.id() : null; } catch {}
  if (!db || !id){ store.mode = 'local'; store.ready = true; render(); return; }
  store.mode = 'cloud'; store.db = db; store.uid = id;
  store.ref = db.doc('data/users/' + id + '/state');
  store.col = store.ref.collection('sessions');
  const slow = setTimeout(() => { store.slow = true; render(); }, 10000);
  const settle = () => { clearTimeout(slow); store.slow = false; };
  store.ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) settle();
    if (!snap.exists){
      if (!snap.metadata.fromCache){
        if (!store.ready && hasData(S) && !LS.get('dz.migState', false)){ LS.set('dz.migState', true); store.dirty = true; flush(); }
        store.ready = true; render();
      }
      return;
    }
    const first = !store.ready; store.ready = true;
    if (store.dirty || store.writing){ return; }
    const inc = normalize(snap.data());
    if (JSON.stringify(inc) !== JSON.stringify(S)){ S = inc; LS.set('dz.state', S); render(); }
    else if (first) render();
  }, () => { settle(); store.mode = 'local'; store.ready = true; toast('Synchronizacja niedostępna. Dane zapisują się w tej przeglądarce.'); render(); });
  store.col.orderBy('date', 'desc').limit(1000).onSnapshot(async snap => {
    if (snap.metadata.fromCache && snap.empty) return;
    const cloud = snap.docs.map(d => ({...d.data(), id:d.id}));
    if (!snap.metadata.fromCache && !LS.get('dz.migSess', false)){
      LS.set('dz.migSess', true);
      const ids = new Set(cloud.map(s => s.id));
      for (const s of SESS.filter(s => !ids.has(s.id))){ try { await store.col.doc(s.id).set(s); cloud.push(s); } catch {} }
    }
    cloud.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (JSON.stringify(cloud) === JSON.stringify(SESS)) return;
    SESS = cloud; LS.set('dz.sessions', SESS);
    render();
  }, () => {});
}

/* ---------- TRENING (start) ---------- */
// rekord z listy serii: na czas → najdłuższa; z ciężarem → najcięższa (przy remisie więcej powt.); bez ciężaru → najwięcej powt.
function setBest(sets, mode){
  let b = null;
  for (const t of sets || []){
    const v = mode === 'time' ? {sec:t.sec || 0} : {kg:t.kg || 0, reps:t.reps || 0};
    if (!b || recBetter(v, b, mode)) b = v;
  }
  return b && (mode === 'time' ? b.sec > 0 : (b.kg > 0 || b.reps > 0)) ? b : null;
}
function recBetter(a, b, mode){ return mode === 'time' ? a.sec > b.sec : a.kg > b.kg + 1e-9 || (Math.abs(a.kg - b.kg) < 1e-9 && a.reps > b.reps); }
function recText(r, mode){ return mode === 'time' ? fmtN(r.sec) + ' s' : r.kg ? fmtN(r.kg) + ' kg × ' + r.reps : r.reps + ' powt.'; }
// najlepszy wynik w ćwiczeniu z historii (opcjonalnie tylko treningi przed datą `before`, bez treningu `excludeId`)
function recordFor(exId, mode, before, excludeId){
  let b = null;
  for (const s of SESS){
    if (s.id === excludeId || (before && String(s.date) >= String(before))) continue;
    for (const x of s.ex || []){ if (x.exId !== exId || (x.mode === 'time') !== (mode === 'time')) continue; const r = setBest(x.sets, mode); if (r && (!b || recBetter(r, b, mode))) b = r; }
  }
  return b;
}
function lastFor(exId, excludeId){
  for (const s of SESS){ if (s.id === excludeId) continue; const x = (s.ex || []).find(e => e.exId === exId); if (x && x.sets && x.sets.length) return {date:s.date, mode:x.mode, sets:x.sets, note:x.note || ''}; }
  return null;
}
function lastDone(planId){ return SESS.find(s => s.planId === planId || s.dayId === planId); }

/* ---------- PLANY ---------- */
function setsSummary(it){
  const s = it.sets || []; if (!s.length) return 'brak serii';
  const same = (f) => s.every(x => x[f] === s[0][f]);
  let main;
  if (it.mode === 'time') main = same('sec') ? `${s.length} × ${s[0].sec ?? '–'} s` : s.map(x => (x.sec ?? '–')).join('/') + ' s';
  else main = same('reps') ? `${s.length} × ${s[0].reps ?? '–'}` : s.map(x => x.reps ?? '–').join('/');
  const kgs = s.map(x => x.kg).filter(v => v != null);
  if (kgs.length) main += ' · ' + (same('kg') ? fmtN(s[0].kg) : s.map(x => x.kg == null ? '–' : fmtN(x.kg)).join('/')) + ' kg';
  return main + ' · przerwa ' + fmtRest(it.rest ?? S.settings.restSet);
}

/* ---------- sugerowana kolejność ćwiczeń ----------

const ORDER_TIERS = [

  [30, 'izolowane, duże partie', 'Dumbbell_Flyes Incline_Dumbbell_Flyes Cable_Crossover Butterfly Straight-Arm_Dumbbell_Pullover Straight-Arm_Pulldown Hyperextensions_Back_Extensions Side_Lateral_Raise Standing_Low-Pulley_Deltoid_Raise Front_Dumbbell_Raise Reverse_Flyes Reverse_Machine_Flyes Upright_Barbell_Row Leg_Extensions Lying_Leg_Curls Seated_Leg_Curl Single_Leg_Glute_Bridge One-Legged_Cable_Kickback Thigh_Abductor Thigh_Adductor'],
  [40, 'izolowane, małe partie', 'Barbell_Curl EZ-Bar_Curl Dumbbell_Alternate_Bicep_Curl Hammer_Curls Incline_Dumbbell_Curl Preacher_Curl Concentration_Curls Standing_Biceps_Cable_Curl Triceps_Pushdown Triceps_Pushdown_-_Rope_Attachment Cable_Rope_Overhead_Triceps_Extension EZ-Bar_Skullcrusher Standing_Dumbbell_Triceps_Extension Tricep_Dumbbell_Kickback Bench_Dips Standing_Calf_Raises Seated_Calf_Raise Calf_Press_On_The_Leg_Press_Machine Barbell_Shrug Dumbbell_Shrug'],
  [42, 'tylne barki i rotatory', 'Face_Pull Band_Pull_Apart External_Rotation_with_Cable'],
  [50, 'brzuch', 'Hanging_Leg_Raise Knee_Hip_Raise_On_Parallel_Bars Ab_Roller Cable_Crunch Ab_Crunch_Machine'],
  [51, 'brzuch', 'Crunches Reverse_Crunch Russian_Twist Dead_Bug Pallof_Press'],
  [52, 'brzuch, izometria', 'Plank Side_Bridge'],
  [60, 'kondycja', 'Battling_Ropes Farmers_Walk Mountain_Climbers'],
  [70, 'cardio', 'Running_Treadmill Bicycling_Stationary Rowing_Stationary Elliptical_Trainer Rope_Jumping'],
];
const ORD = new Map(); const ORD_LABEL = new Map();
for (const [o, label, ids] of ORDER_TIERS){ if (!ORD_LABEL.has(o)) ORD_LABEL.set(o, label); for (const id of ids.split(' ')) ORD.set(id, o); }
function exOrd(e){
  if (ORD.has(e.id)) return ORD.get(e.id);
  // Własne ćwiczenia: zgadujemy po grupie, sprzęcie i nazwie.
  const n = norm(e.name);
  if (e.group === 'Cardio') return 70;
  if (e.group === 'Całe ciało') return 60;
  if (e.group === 'Brzuch') return e.mode === 'time' ? 52 : 51;
  if (['Biceps','Triceps','Łydki'].includes(e.group)) return /wyciskanie|pompki|porecz|dips/.test(n) ? 28 : 40;
  if (/rozpietk|unoszenie|prostowanie|uginanie|wspiecia|odwodzenie|przywodzenie|szrugs|kickback|face ?pull|rotacja|izolow/.test(n)) return 30;
  if (e.equipment === 'Maszyna' || e.equipment === 'Wyciąg') return 25;
  if (e.equipment === 'Sztanga' && /przysiad|martwy|wyciskanie|wioslowanie/.test(n)) return 10;
  return 20;
}
const ordLabel = o => ORD_LABEL.get(o) || '';
const orderSig = p => p.items.map(i => i.id).join(',');
function suggestOrder(p){
  const keyed = p.items.map((it, i) => ({it, i, o:exOrd(getEx(it.exId))}));
  const sorted = [...keyed].sort((a, b) => a.o - b.o || a.i - b.i);
  return {sorted, changed:sorted.some((x, k) => x.i !== k)};
}
function vOrderHint(p){
  if (p.items.length < 2) return '';
  const {sorted, changed} = suggestOrder(p);
  const why = ui.orderWhy ? `<ul class="oc-why">
      <li><b>Najcięższe wielostawowe na początku.</b> Przysiad, martwy ciąg i wyciskania wymagają najwięcej siły i techniki. Na świeżo podniesiesz więcej i zrobisz to bezpieczniej.</li>
      <li><b>Wolne ciężary przed maszynami.</b> Sztanga i hantle angażują mięśnie stabilizujące, które męczą się najszybciej. Maszyna prowadzi ruch, więc dobrze sprawdza się później.</li>
      <li><b>Wielostawowe przed izolowanymi, duże partie przed małymi.</b> Zmęczony biceps osłabi wiosłowanie, a zmęczony triceps wyciskanie. Odwrotnie to nie działa.</li>
      <li><b>Brzuch pod koniec.</b> Mięśnie brzucha stabilizują tułów w ciężkich ćwiczeniach. Zmęczone zwiększają ryzyko kontuzji kręgosłupa.</li>
      <li><b>Cardio na końcu.</b> Nie zabiera siły do ćwiczeń z ciężarem. Krótka rozgrzewka (5–10 minut) na początku jest jak najbardziej w porządku.</li>
    </ul>` : '';
  const whyBtn = `<button class="btn sm ghost" data-act="orderWhy" aria-expanded="${!!ui.orderWhy}">${ui.orderWhy ? 'Ukryj wyjaśnienie' : 'Dlaczego tak?'}</button>`;
  if (!changed){
    const core = sorted.some(x => x.o >= 50 && x.o < 60), cardio = sorted.some(x => x.o >= 60);
    const tail = core && cardio ? ', brzuch i cardio na końcu' : core ? ', brzuch na końcu' : cardio ? ', kondycja i cardio na końcu' : '';
    return `<div class="oc ok"><div class="oc-h">${svg('check','i s')}<b>Kolejność jest optymalna</b></div>
    <p class="small">Od najcięższych ćwiczeń wielostawowych do izolowanych${tail}.</p><div class="row">${whyBtn}</div>${why}</div>`;
  }
  if (p.orderOk === orderSig(p)) return `<div class="oc mine"><span class="small muted">Zostawiasz własną kolejność ćwiczeń.</span><button class="btn sm ghost" data-act="orderShow" data-plan="${p.id}">Pokaż sugestię</button></div>`;
  let list = '';
  sorted.forEach((x, k) => {
    const d = x.i - k;
    const mv = d > 0 ? `<span class="mv up" aria-label="w górę o ${d}">${svg('up','i s')}${d}</span>` : d < 0 ? `<span class="mv dn" aria-label="w dół o ${-d}">${svg('down','i s')}${-d}</span>` : '';
    list += `<li class="${d ? 'moved' : ''}"><span class="nm">${esc(getEx(x.it.exId).name)}</span><span class="osub">${esc(ordLabel(x.o))}</span>${mv}</li>`;
  });
  return `<div class="oc"><div class="oc-h">${svg('<path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M13 6h8M13 11h6M13 16h4"/>','i s')}<b>Sugerowana kolejność</b></div>
    <p class="small">Tak ułożony trening pozwoli dźwigać więcej przy mniejszym ryzyku kontuzji.</p>
    <ol class="oc-list">${list}</ol>
    <div class="row"><button class="btn primary sm" data-act="orderApply" data-plan="${p.id}">Ułóż w tej kolejności</button><button class="btn sm ghost" data-act="orderKeep" data-plan="${p.id}">Zostaw moją</button>${whyBtn}</div>${why}</div>`;
}

/* ---------- ĆWICZENIA ---------- */
function allEx(){ return [...EX, ...S.custom]; }
function filterEx(q, group, equip){
  const nq = norm(q).trim();
  return allEx().filter(e => (!group || e.group === group) && (!equip || e.equipment === equip) &&
    (!nq || norm([e.name, e.en, e.group, e.equipment, ...(e.primary || [])].join(' ')).includes(nq)));
}
function groupedRows(list, rowFn){
  let h = '';
  for (const g of GROUPS){
    const items = list.filter(e => e.group === g).sort((a, b) => ORDER(a) - ORDER(b));
    if (!items.length) continue;
    h += `<h2 class="sec-h">${esc(g)} <span class="n">${items.length}</span></h2><div class="exlist">${items.map(rowFn).join('')}</div>`;
  }
  return h || `<p class="muted" style="margin-top:16px">Brak ćwiczeń pasujących do wyszukiwania.</p>`;

// Odtwarzacz animacji w karcie ćwiczenia: jedna pętla, działa tylko gdy karta jest otwarta.
const AP = {id:null, el:null, u:0, playing:false, slow:false, raf:0, last:0, drawn:0};
function animMount(){
  const fig = $('#sheet [data-anim]');
  if (!fig){ animStop(); return; }
  AP.id = fig.dataset.anim; AP.el = fig; AP.u = 0; AP.playing = !reduced; AP.slow = false; AP.last = performance.now();
  const r = fig.querySelector('input[type=range]');
  r.addEventListener('input', () => { AP.u = r.value / 1000; animSetPlaying(false); animDraw(); });
  animDraw();
  if (!AP.raf) AP.raf = requestAnimationFrame(animTick);
}
function animStop(){ if (AP.raf) cancelAnimationFrame(AP.raf); AP.raf = 0; AP.id = null; AP.el = null; }
function animSetPlaying(on){
  AP.playing = on; AP.last = performance.now();
  const b = AP.el && AP.el.querySelector('[data-act="animPlay"]');
  if (b){ b.innerHTML = svg(on ? 'pause' : 'play', 'i s'); b.setAttribute('aria-label', on ? 'Zatrzymaj' : 'Odtwórz'); }
}
function animDraw(){
  if (!AP.el || !AP.el.isConnected){ animStop(); return; }
  AP.el.querySelector('.anim-stage').innerHTML = ANIM.svg(AP.id, AP.u);
  const inf = ANIM.info(AP.id, AP.u);
  AP.el.querySelector('.anim-lbl').textContent = inf.label;
  AP.el.querySelector('.anim-pct').textContent = inf.cyc ? '' : inf.pct + '% zakresu ruchu';
  const r = AP.el.querySelector('input[type=range]'); if (document.activeElement !== r) r.value = Math.round((((AP.u % 1) + 1) % 1) * 1000);
}
function animTick(now){
  AP.raf = 0;
  if (!AP.el || !AP.el.isConnected){ animStop(); return; }
  if (AP.playing && !document.hidden){
    const dt = Math.min(0.1, (now - AP.last) / 1000); AP.last = now;
    AP.u = (AP.u + dt / (ANIM.dur(AP.id) * (AP.slow ? 2.2 : 1))) % 1;
    if (now - AP.drawn > 30){ AP.drawn = now; animDraw(); }
  } else AP.last = now;
  AP.raf = requestAnimationFrame(animTick);
}

// Odtwarzacz filmu YouTube w karcie ćwiczenia: bez dźwięku, w pętli, z suwakiem i tempem.
// Bez internetu (albo gdy YouTube się nie wczyta) karta wraca do animacji.
let ytBroken = false, ytApi = null;
const YP = {el:null, p:null, ready:false, dur:0, drag:false, raf:0};
function ytLoadApi(){
  if (window.YT && YT.Player) return Promise.resolve();
  if (ytApi) return ytApi;
  ytApi = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => rej(new Error('yt'));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error('yt-timeout')), 12000);
  }).catch(e => { ytApi = null; throw e; });
  return ytApi;
}
const ytFmt = t => Math.max(0, t).toFixed(1).replace('.', ',') + ' s';
function ytMount(){
  const fig = $('#sheet [data-yt]');
  if (!fig){ ytStop(); return; }
  if (YP.el === fig) return;
  ytStop();
  YP.el = fig;
  const r = fig.querySelector('input[type=range]');
  const seek = final => { if (!YP.ready || !(YP.dur > 0)) return; const t = YP.dur * r.value / 1000; YP.p.seekTo(t, final); fig.querySelector('.yt-time').textContent = ytFmt(t); };
  r.addEventListener('pointerdown', () => { YP.drag = true; if (YP.ready) YP.p.pauseVideo(); });
  r.addEventListener('input', () => { YP.drag = true; if (YP.ready) YP.p.pauseVideo(); seek(false); });
  r.addEventListener('change', () => { seek(true); YP.drag = false; });
  if (!navigator.onLine){ ytFallback(fig); return; }
  ytLoadApi().then(() => {
    if (YP.el !== fig || !fig.isConnected) return;
    YP.p = new YT.Player(fig.querySelector('.yt-frame'), {
      host: 'https://www.youtube-nocookie.com', videoId: fig.dataset.yt,
      playerVars: {autoplay: 0, mute: 1, controls: 0, playsinline: 1, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0, origin: location.origin},
      events: {
        onReady: () => {
          if (YP.el !== fig) return;
          YP.ready = true; YP.dur = YP.p.getDuration() || 0; YP.p.mute();
          fig.querySelectorAll('[disabled]').forEach(x => x.disabled = false);
          if (!reduced) YP.p.playVideo();
          if (!YP.raf) YP.raf = requestAnimationFrame(ytTick);
        },
        onStateChange: ev => {
          if (YP.el !== fig) return;
          if (ev.data === 1){ fig.classList.add('on'); if (!YP.dur) YP.dur = YP.p.getDuration() || 0; }
          if (ev.data === 0){ YP.p.seekTo(0, true); YP.p.playVideo(); }
          const on = ev.data === 1 || ev.data === 3, b = fig.querySelector('.anim-ctl [data-act="ytToggle"]');
          b.innerHTML = svg(on ? 'pause' : 'play', 'i s'); b.setAttribute('aria-label', on ? 'Zatrzymaj' : 'Odtwórz');
        },
        onError: () => { if (YP.el === fig) ytFallback(fig); },
      },
    });
  }).catch(() => { ytBroken = true; if (YP.el === fig) ytFallback(fig); });
}
function ytFallback(fig){
  const id = fig.dataset.ex;
  ytStop();
  if (!fig.isConnected) return;
  fig.outerHTML = animFigure(id);

}
function ytStop(){
  if (YP.raf) cancelAnimationFrame(YP.raf);
  if (YP.p) try { YP.p.destroy(); } catch (e) {}
  YP.el = null; YP.p = null; YP.ready = false; YP.dur = 0; YP.drag = false; YP.raf = 0;
}
function ytTick(){
  YP.raf = 0;
  if (!YP.el || !YP.el.isConnected){ ytStop(); return; }
  if (YP.ready && !YP.drag && YP.dur > 0){
    const t = YP.p.getCurrentTime() || 0, r = YP.el.querySelector('input[type=range]');
    if (document.activeElement !== r) r.value = Math.round(Math.min(1, t / YP.dur) * 1000);
    YP.el.querySelector('.yt-time').textContent = ytFmt(t);
  }

}
function ytToggle(){ if (!YP.ready) return; const st = YP.p.getPlayerState(); (st === 1 || st === 3) ? YP.p.pauseVideo() : YP.p.playVideo(); }

/* ---------- mapa tygodnia: co poćwiczyć, co odpuścić ----------

// cel serii tygodniowo na partię zależnie od liczby treningów w tygodniu
const WK_TARGET = {1:4, 2:6, 3:9, 4:12, 5:14, 6:16};

const WK_GROUPS = [

  ['Najszerszy grzbietu', ['lats', 'teres']], ['Środek pleców', ['trapsM', 'trapsL', 'infra']], ['Kaptury', ['trapsU'], .5], ['Prostowniki grzbietu', ['erectors'], .5],
  ['Biceps', ['biceps', 'brachialis']], ['Triceps', ['triLong', 'triLat', 'triMed']], ['Przedramiona', ['brachiorad', 'flexors', 'extensors'], .5],
  ['Brzuch', ['abs', 'obliques', 'serratus']],
  ['Czworogłowe uda', ['quadRF', 'quadVL', 'quadVM']], ['Dwugłowe uda', ['hamLat', 'hamMed']], ['Pośladki', ['gluteMax', 'gluteMed']], ['Przywodziciele', ['adductors'], .5],
  ['Łydki', ['gastro', 'soleus']],

const wkExpand = list => list.flatMap(k => (typeof MUSCLE_GROUPS !== 'undefined' && MUSCLE_GROUPS[k]) || [k]);
function weekStats(){
  const now = Date.now(), T = wkTarget();
  const g = WK_GROUPS.map(([name, keys, f]) => ({name, keys, target:Math.round(T * (f || 1)), sets:0, recent:0, lastAt:0}));
  for (const s of SESS){
    const t = new Date(s.date).getTime(), age = (now - t) / 36e5; if (age > 24 * 7) continue;
    for (const x of s.ex || []){
      const m = exMuscles(getEx(x.exId)), P = new Set(wkExpand(m.p)), Q = new Set(wkExpand(m.s)), n = (x.sets || []).length;
      if (!n) continue;
      for (const q of g){
        const w = q.keys.some(k => P.has(k)) ? 1 : q.keys.some(k => Q.has(k)) ? .5 : 0; if (!w) continue;
        q.sets += w * n; if (age <= 48){ q.recent += w * n; q.lastAt = Math.max(q.lastAt, t); }
      }

  for (const q of g) q.state = q.recent >= 3 ? 'rec' : q.sets >= q.target ? 'ok' : q.sets > 0 ? 'low' : 'none';

}
function wkHeat(g){ const h = {}; for (const q of g){ const c = {rec:'h-rec', ok:'h-ok', low:'h-low'}[q.state]; if (c) q.keys.forEach(k => h[k] = c); } return h; }

const wkLegend = `<figcaption class="legend wk-leg"><span><i style="background:var(--hl)"></i>odpoczywa (48 h)</span><span><i style="background:var(--good)"></i>cel tygodnia</span><span><i style="background:var(--wk-low)"></i>trenowane, mniej</span><span><i style="background:var(--bm-muscle)"></i>brak</span></figcaption>`;

/* ---------- zamiennik ćwiczenia: te same mięśnie główne ---------- */
function swapCandidates(exId, n = 6){
  const m0 = exMuscles(getEx(exId)), P0 = new Set(wkExpand(m0.p)), S0 = new Set(wkExpand(m0.s)), g0 = getEx(exId).group, cardio = g0 === 'Cardio';
  const out = [];
  for (const e of EX){
    if (e.id === exId || (e.group === 'Cardio') !== cardio) continue;
    const m = exMuscles(e), P = wkExpand(m.p), Q = wkExpand(m.s);
    const hit = P.filter(k => P0.has(k)).length; if (!hit) continue;
    const score = hit * 3 + Q.filter(k => P0.has(k) || S0.has(k)).length * .5 - P.filter(k => !P0.has(k)).length + (e.group === g0 ? 1 : 0);
    out.push({e, score});
  }
  return out.sort((a, b) => b.score - a.score).slice(0, n).map(o => o.e);
}

/* ---------- pokrycie programu: wszystkie plany razem (każdy plan raz w tygodniu) ---------- */
function planGroupSets(items){
  const g = WK_GROUPS.map(([name, keys, f]) => ({name, keys, f:f || 1, sets:0, prim:0}));
  for (const it of items){
    const m = exMuscles(getEx(it.exId)), P = new Set(wkExpand(m.p)), Q = new Set(wkExpand(m.s)), n = (it.sets || []).length;
    for (const q of g){ const w = q.keys.some(k => P.has(k)) ? 1 : q.keys.some(k => Q.has(k)) ? .5 : 0; q.sets += w * n; if (w === 1) q.prim += n; }
  }
  return g;
}
function programFactor(){ const n = S.plans.filter(p => p.items.length).length; return n ? perWeek() / n : 1; }
function programSets(){ const f = programFactor(); return planGroupSets(S.plans.flatMap(p => p.items)).map(q => ({...q, sets:Math.round(q.sets * f * 2) / 2, target:Math.round(wkTarget() * q.f)})); }

  if (typeof BODYMAP === 'undefined' || !S.plans.some(q => q.items.length)) return '';

  for (const q of programSets()){ const c = q.sets >= q.target ? 'h-ok' : q.sets > 0 ? 'h-low' : ''; if (c) q.keys.forEach(k => heat[k] = c); }
  const skip = p && p.items.length ? planReview(p).flagged : new Set();
  const gaps = programGaps().filter(q => !skip.has(q.name)).slice(0, 6);
  const freqTxt = (() => { const n = S.plans.filter(q => q.items.length).length, f = programFactor(); return `${n} ${pl(n, 'plan', 'plany', 'planów')} przy ${perWeek()} ${pl(perWeek(), 'treningu', 'treningach', 'treningach')} w tygodniu: każdy plan ${f === 1 ? 'raz' : 'średnio ' + fmtN(Math.round(f * 10) / 10) + ' raza'} w tygodniu.`; })();
  const inPlans = new Set(S.plans.flatMap(o => o.items.map(i => i.exId)));
  const sug = gaps.map(q => { const e = wkSuggest(q, 8).find(x => !inPlans.has(x.id)) || wkSuggest(q, 1)[0]; return e ? `<div class="cov-row"><span><b>${esc(q.name)}</b> <small>${fmtN(q.sets)} / ${q.target} serii</small></span>${p ? `<button class="btn sm" data-act="covAdd" data-plan="${p.id}" data-id="${esc(e.id)}">${svg('plus','i s')}${esc(e.name)}</button>` : `<button class="wk-ex" data-act="exInfo" data-id="${esc(e.id)}">${esc(e.name)}</button>`}</div>` : ''; }).join('');

    ${p ? `<p class="muted small" style="margin:0">${freqTxt}</p>` : `<div class="cov-top"><figure class="bodymap wk wk-mini" style="margin:0" aria-hidden="true">${bodyMapFigs({p:[], s:[]}, heat)}</figure>
    <p class="muted small" style="margin:0">${freqTxt}</p></div>`}

/* ---------- podpowiedź kolejnych ćwiczeń przy układaniu planu ----------
   Plan na partie (np. klatka + triceps): brakujące części tych samych partii (góra klatki, głowa długa tricepsa…).
   Plan całego ciała (4+ obszary): najsłabiej pokryte partie całego ciała. Pusty plan: podstawowe wielostawowe. */
const WK_FAMILY = {'Klatka – góra':'klatka', 'Klatka – środek i dół':'klatka', 'Barki – przód':'barki', 'Barki – bok':'barki', 'Barki – tył':'barki',
  'Najszerszy grzbietu':'plecy', 'Środek pleców':'plecy', 'Kaptury':'plecy', 'Prostowniki grzbietu':'plecy', 'Biceps':'biceps', 'Triceps':'triceps', 'Przedramiona':'biceps',
  'Brzuch':'brzuch', 'Czworogłowe uda':'nogi', 'Dwugłowe uda':'nogi', 'Pośladki':'nogi', 'Przywodziciele':'nogi', 'Łydki':'nogi'};
function planNext(p, n = 3){
  const have = new Set(p.items.map(i => i.exId));
  if (!p.items.length) return ['Barbell_Squat', 'Barbell_Bench_Press_-_Medium_Grip', 'Bent_Over_Barbell_Row'].map(id => ({e:getEx(id), why:'podstawa planu'}));
  const g = planGroupSets(p.items);
  const prim = new Set(); for (const it of p.items){ const P = new Set(wkExpand(exMuscles(getEx(it.exId)).p)); for (const q of g) if (q.keys.some(k => P.has(k))) prim.add(WK_FAMILY[q.name]); }
  const fbw = prim.size >= 4;
  let cand = g.filter(q => (fbw || prim.has(WK_FAMILY[q.name])) && q.f === 1);
  if (!cand.length) cand = g.filter(q => prim.has(WK_FAMILY[q.name]));
  cand.sort((a, b) => a.sets - b.sets);
  const out = [];
  for (const q of cand){
    if (q.sets >= (fbw ? 3 : 4)) break;
    const e = wkSuggest(q, 8).find(x => !have.has(x.id) && !out.some(o => o.e.id === x.id));
    if (e) out.push({e, why:'na: ' + q.name.toLowerCase()});
    if (out.length >= n) break;
  }
  return out;
}
function nextCard(p){
  const list = planNext(p); if (!list.length) return '';
  return `<div class="next"><span class="lbl">${p.items.length ? 'Propozycje następnych ćwiczeń' : 'Na początek'}</span>${list.map(({e, why}) => `<button class="next-b" data-act="covAdd" data-plan="${p.id}" data-id="${esc(e.id)}">${svg('plus','i s')}<span><b>${esc(e.name)}</b><small>${esc(why)}</small></span></button>`).join('')}</div>`;
}

/* ---------- ocena planu: jakie partie pracują i czy czegoś brakuje ----------
   Serie na jeden trening, liczone jak na mapie tygodnia (mięsień główny 1, pomocniczy 0,5).
   Typ planu z grup ćwiczeń: całe ciało (nogi + 2 z: klatka, plecy, barki), góra ciała (klatka, plecy, barki, bez nóg) albo na partie.
   Wymagane minimum w jednym treningu: 2 serie w planie całego ciała / góry, 3 w planie na partie. Brak w tym planie,
   który jest w innym planie, nie jest błędem (np. FBW A i FBW B się uzupełniają). Ponad 12 serii na partię = dużo. */
const EX_FAM = {'Klatka piersiowa':'klatka', 'Plecy':'plecy', 'Barki':'barki', 'Biceps':'biceps', 'Triceps':'triceps', 'Czworogłowe uda':'nogi', 'Dwugłowe uda':'nogi', 'Pośladki i biodra':'nogi', 'Łydki':'nogi', 'Brzuch':'brzuch'};
const FAM_ORDER = ['klatka', 'plecy', 'barki', 'nogi', 'biceps', 'triceps', 'brzuch'];
const PR_MAX = 12, PR_WEEK = 20, PR_SETS = 25, PR_EX = 8;
// [etykieta, grupy (wystarczy jedna z nich), podpowiedzi ćwiczeń]

const CHARTS = new Map(); let chartSeq = 0;
function chartCard(title, spec){ const id = 'c' + (++chartSeq); CHARTS.set(id, spec); return `<section class="chart-card"><h3>${esc(title)}</h3><div class="chart" data-chart="${id}" role="img" aria-label="${esc(title)}"></div></section>`; }
function niceTicks(lo, hi, count){
  const span = hi - lo || 1; const raw = span / count; const mag = 10 ** Math.floor(Math.log10(raw)); const nr = raw / mag;
  const step = (nr < 1.5 ? 1 : nr < 3 ? 2 : nr < 7 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; const out = [];

const fmtTick = v => Math.abs(v) >= 10000 ? fmtN(Math.round(v / 100) / 10) + ' tys.' : fmtN(v);
function drawCharts(){ $$('[data-chart]').forEach(h => { const s = CHARTS.get(h.dataset.chart); if (s) drawChart(h, s); }); }
function drawChart(host, spec){
  const W = Math.max(260, Math.floor(host.clientWidth || 320)), H = 196, m = {l:46, r:16, t:22, b:26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.pts.length, ys = spec.pts.map(p => p.y);
  let lo = spec.type === 'bar' ? 0 : Math.min(...ys), hi = Math.max(...ys);
  if (spec.type !== 'bar'){ const pad = (hi - lo) * 0.2 || Math.max(1, hi * 0.1); lo = Math.max(0, lo - pad); hi += pad; }
  if (hi <= lo) hi = lo + 1;
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];

  const X = i => spec.type === 'bar' ? m.l + (i + 0.5) * band : (n === 1 ? m.l + iw / 2 : m.l + i * iw / (n - 1));
  const Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><g class="grid">`;
  s += ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + '</g>';
  s += ticks.map(t => `<text x="${m.l - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmtTick(t)}</text>`).join('');
  const maxLabels = Math.max(2, Math.floor(iw / 72)); const idx = [];
  if (n <= maxLabels) for (let i = 0; i < n; i++) idx.push(i); else for (let k = 0; k < maxLabels; k++) idx.push(Math.round(k * (n - 1) / (maxLabels - 1)));
  s += [...new Set(idx)].map(i => { const anc = spec.type === 'bar' || n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'; return `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${anc}">${fmtDate(spec.pts[i].x)}</text>`; }).join('');
  s += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/>`;
  if (spec.type === 'bar'){
    const bw = Math.max(4, Math.min(24, band - 2)), base = Y(y0);
    spec.pts.forEach((p, i) => {
      const x = X(i) - bw / 2, y = Y(p.y), r = Math.min(4, bw / 2, base - y);
      if (base - y < 0.5) return;
      s += `<path fill="var(--accent)" d="M${x.toFixed(1)},${base.toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + r).toFixed(1)}V${base.toFixed(1)}Z"/>`;
    });
  } else {
    const d = spec.pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += spec.pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  }
  const li = n - 1, ly = Y(spec.pts[li].y), bwEnd = spec.type === 'bar' ? Math.max(4, Math.min(24, band - 2)) / 2 : 0;
  s += `<text class="end" x="${Math.min(X(li) + bwEnd, W - 2).toFixed(1)}" y="${(ly - 9 < m.t - 6 ? ly + 18 : ly - 9).toFixed(1)}" text-anchor="end">${fmtTick(spec.pts[li].y)}</text>`;
  s += `<circle class="hl" r="6" fill="none" stroke="var(--ink)" stroke-width="2" visibility="hidden"/></svg><div class="ctip" hidden></div>`;
  host.innerHTML = s;
  const tip = $('.ctip', host), xh = $('.xh', host), hl = $('.hl', host);
  const show = e => {
    const r = host.getBoundingClientRect(); const px = e.clientX - r.left;
    let i = 0, best = Infinity; for (let k = 0; k < n; k++){ const dd = Math.abs(X(k) - px); if (dd < best){ best = dd; i = k; } }
    const p = spec.pts[i], x = X(i), y = Y(p.y);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    if (spec.type !== 'bar'){ hl.setAttribute('cx', x); hl.setAttribute('cy', y); hl.setAttribute('visibility', 'visible'); }
    tip.hidden = false; tip.innerHTML = `<b>${fmtN(p.y)} ${esc(spec.unit)}</b>${p.sub ? ' ' + esc(p.sub) : ''}<br>${fmtDate(p.x, {weekday:'short', day:'numeric', month:'short'})}`;
    tip.style.left = Math.min(Math.max(x, 70), W - 70) + 'px'; tip.style.top = Math.max(y, 40) + 'px';
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); hl.setAttribute('visibility', 'hidden'); };
  host.onpointermove = show; host.onpointerdown = show; host.onpointerleave = hide;
}

    if (s.ctx === 'w'){
      const x = ACTIVE.ex.find(q => q.key === s.key); if (!x) return;
      const last = lastFor(id); x.exId = id; x.mode = t ? 'time' : 'reps'; x.wnote = x.wnote || null;
      x.sets.forEach((q, j) => { if (q.done) return; q.kg = last && last.sets[j] ? last.sets[j].kg ?? null : null; if (t){ q.sec = q.sec ?? q.tSec ?? 30; } else { q.reps = q.reps ?? q.tReps ?? 10; } });
      saveActive(); sheets.pop(); renderSheet(); renderWorkout();
    } else {
      const p = planById(s.plan), it = p && p.items.find(q => q.id === s.item); if (!it) return;
      it.exId = id; if ((it.mode === 'time') !== t){ it.mode = t ? 'time' : 'reps'; it.sets = it.sets.map(q => t ? {sec:30, kg:null} : {reps:10, kg:null}); }
      sheets.pop(); renderSheet(); commit();
    }
    toast('Zamieniono na: ' + e.name);
  },
  wMove(el){ const i = +el.dataset.i, T = ACTIVE.timer; ssUnlink(ACTIVE.ex, i);
    const fKey = T && T.focus != null ? ACTIVE.ex[T.focus]?.key : null, wKey = T && T.kind === 'work' ? ACTIVE.ex[T.i]?.key : null;
    move(ACTIVE.ex, i, +el.dataset.dir);
    if (fKey) T.focus = ACTIVE.ex.findIndex(x => x.key === fKey); if (wKey) T.i = ACTIVE.ex.findIndex(x => x.key === wKey);
    saveActive(); renderWorkout(); },
  wDelEx(el){ const i = +el.dataset.i; const x = ACTIVE.ex[i]; confirmBox('Usunąć ćwiczenie z treningu?', getEx(x.exId).name + ' zniknie z dzisiejszego treningu. Plan się nie zmieni.', 'Usuń', () => { ssUnlink(ACTIVE.ex, i); ACTIVE.ex.splice(i, 1); ACTIVE.timer = null; ui.wMenu = null; saveActive(); renderWorkout(); }); },
  wAddEx(){ openSheet({type:'pick', target:{kind:'workout'}, q:'', group:'', sel:[]}); },
  tbStart(){ audioUnlock(); const i = Math.max(0, curIndex()); const x = ACTIVE.ex[i]; startTimer('rest', x ? x.rest : S.settings.restSet, 'Przerwa między seriami', i); saveActive(); updateTimer(); },
  tbAdj(el){ const T = ACTIVE.timer; if (!T) return; T.endsAt += +el.dataset.d * 1000; T.total = Math.max(1, T.total + +el.dataset.d); if (T.endsAt <= Date.now()){ T.fired = true; ACTIVE.timer = null; } saveActive(); updateTimer(); },
  tbSkip(){ const T = ACTIVE.timer; ACTIVE.timer = null; saveActive(); renderWorkout(); if (T){ const x = ACTIVE.ex[T.focus]; const c = x && $('#wex-' + x.key); if (c) c.scrollIntoView({behavior:reduced ? 'auto' : 'smooth', block:'start'}); } },
};
function limitInput(t){
  const f = t.dataset.f, v = num(t.value), c = clampV(f, v);
  if (v != null && c !== v){ t.value = fmtN(c); toast(f === 'kg' ? `Maksymalnie ${LIM.kg} kg.` : f === 'sec' ? `Maksymalnie ${LIM.sec} s.` : `Maksymalnie ${LIM.reps} powtórzeń.`); }
  return c;
}
const BIND = {
  exq(t){ ui.exQ = t.value; fillExList(); },
  exeq(t){ ui.exEquip = t.value; fillExList(); },
  pickq(t){ topSheet().q = t.value; fillPickList(); },
  planName(t){ const p = planById(t.dataset.plan); if (p){ p.name = t.value; persist(); } },
  pset(t){ const {it} = itemRef(t); if (!it) return; it.sets[+t.dataset.i][t.dataset.f] = limitInput(t); persist();
    const m = $(`.item-h[data-item="${it.id}"] .meta`); if (m) m.textContent = setsSummary(it); },
  note(t){ const {it} = itemRef(t); if (it){ it.note = t.value; persist(); } },
  wnote(t){ const x = ACTIVE?.ex[+t.dataset.i]; if (!x) return; x.wnote = t.value; saveActive(); },
  wset(t){ const i = +t.dataset.i; const s = ACTIVE?.ex[i]?.sets[+t.dataset.j]; if (!s) return; s[t.dataset.f] = limitInput(t); saveActive();
    // ciężar / powtórzenia / sekundy od razu w kolejnych, jeszcze niezrobionych seriach (piramida: zmień serię 3 → zmieniają się 3, 4, 5…)
    const f = t.dataset.f, x = ACTIVE.ex[i], j = +t.dataset.j;
    if (!s.done){ x.sets.forEach((q, k) => { if (k <= j || q.done) return; q[f] = s[f]; const inp = $(`#w-${x.key}-${k}-${f}`); if (inp && inp !== document.activeElement) inp.value = f === 'kg' ? fmtN(s[f]) : (s[f] ?? ''); }); saveActive(); }
    // pasek „Szybka zmiana” pokazuje najbliższą niezrobioną serię: odśwież liczbę na bieżąco
    const nj = x.sets.findIndex(q => !q.done), qb = $(`#wex-${x.key} .qstep [data-qf="${f}"]`);
    if (qb && nj >= 0){ const v = x.sets[nj][f] ?? (f === 'reps' ? x.sets[nj].tReps : f === 'sec' ? x.sets[nj].tSec : null); qb.textContent = v != null ? (f === 'kg' ? fmtN(v) : v) : '–'; }
    if (f === 'kg'){ const p = $(`[data-plates="${i}"]`); if (p) p.outerHTML = platesHTML(i); } },
  progEx(t){ ui.progEx = t.value; render(); },
  setting(t){ const f = t.dataset.f; S.settings[f] = t.type === 'checkbox' ? t.checked : num(t.value); persist(); },
  cf(t){ topSheet().f[t.dataset.f] = t.value; },
  finUpd(t){ topSheet().upd = t.checked; },
};
/* ---------- przesunięcie planu w lewo: przycisk „Usuń” (z potwierdzeniem) ---------- */
const SW = {el:null, x0:0, y0:0, dx:0, on:false, id:null, open:null, eat:false};
const SW_W = 88;
function swSet(el, x){ el.querySelector('.plan-link').style.transform = x ? `translateX(${x}px)` : ''; }
function swClose(){ if (SW.open && SW.open.isConnected) swSet(SW.open, 0); SW.open = null; }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.sw'); if (!el || e.target.closest('.sw-del') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  SW.el = el; SW.x0 = e.clientX; SW.y0 = e.clientY; SW.dx = 0; SW.on = false; SW.id = e.pointerId;
});
document.addEventListener('pointermove', e => {
  if (!SW.el || e.pointerId !== SW.id) return;
  const dx = e.clientX - SW.x0, dy = e.clientY - SW.y0;
  if (!SW.on){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ SW.el = null; return; }   // przewijanie w pionie
    if (Math.abs(dx) < 10) return;
    SW.on = true; SW.el.classList.add('drag'); if (SW.open && SW.open !== SW.el) swClose();
  }
  const base = SW.open === SW.el ? -SW_W : 0;
  SW.dx = Math.max(-SW_W - 30, Math.min(0, base + dx));
  swSet(SW.el, SW.dx);
});
const swEnd = e => {
  if (!SW.el || e.pointerId !== SW.id) return;
  const el = SW.el; SW.el = null;
  if (!SW.on) return;
  el.classList.remove('drag'); SW.eat = true; setTimeout(() => SW.eat = false, 350);
  if (SW.dx < -SW_W / 2){ swSet(el, -SW_W); SW.open = el; el.querySelector('.sw-del').tabIndex = 0; el.querySelector('.sw-del').removeAttribute('aria-hidden'); }
  else { swSet(el, 0); if (SW.open === el) SW.open = null; }
};
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);
// po przesunięciu nie otwieraj planu; stuknięcie gdziekolwiek (poza „Usuń”) zamyka odsłonięty przycisk
document.addEventListener('click', e => {
  if (SW.eat){ SW.eat = false; if (!e.target.closest('.sw-del')){ e.preventDefault(); e.stopPropagation(); return; } }
  if (SW.open && !SW.open.isConnected) SW.open = null;
  if (!SW.open) return;
  if (e.target.closest('.sw-del')){ SW.open = null; return; }   // „Usuń” → okno potwierdzenia
  e.preventDefault(); e.stopPropagation(); swClose();
}, true);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (fn){ e.preventDefault(); fn(t, e); }
});
const onBind = e => { const t = e.target; if (t.dataset && t.dataset.bind && BIND[t.dataset.bind]){ if (e.type === 'change' && t.type !== 'checkbox' && t.tagName !== 'SELECT') return; if (e.type === 'input' && (t.type === 'checkbox' || t.tagName === 'SELECT')) return; BIND[t.dataset.bind](t, e); } };
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);
// pola liczbowe (serie w treningu i w planie): po stuknięciu puste, stara wartość jako szara podpowiedź.
// iPhone stawia kursor za liczbą, więc cyfry się doklejały. Wyjście bez wpisania = wraca stara wartość.
const CLEAR_SEL = 'input[data-bind="wset"], input[data-bind="pset"]';
document.addEventListener('focusin', e => {
  const t = e.target; if (!t.matches || !t.matches(CLEAR_SEL) || t.dataset.old != null || t.value === '') return;
  t.dataset.old = t.value; t.dataset.ph = t.placeholder; t.placeholder = t.value; t.value = '';
});
document.addEventListener('focusout', e => {
  const t = e.target; if (!t.matches || !t.matches(CLEAR_SEL) || t.dataset.old == null) return;
  const old = t.dataset.old; t.placeholder = t.dataset.ph; delete t.dataset.old; delete t.dataset.ph;
  if (t.value.trim() === ''){ t.value = old; t.dispatchEvent(new Event('input', {bubbles:true})); }   // nic nie wpisane → przywróć (także w kolejnych seriach)
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && topSheet()) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.id === 'newfolder'){ e.preventDefault(); ACT.folderCreate(); }
  if (e.key === 'Enter' && e.target && (e.target.id === 'pin1' || e.target.id === 'pin2')){ e.preventDefault(); if (e.target.id === 'pin1' && $('#pin2')) $('#pin2').focus(); else ACT.pinGo(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'rnfolder'){ e.preventDefault(); ACT.folderRename(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'shcode'){ e.preventDefault(); ACT.shareFind(); }
});

function route(){
  const h = location.hash.replace('#', '');
  ui.tab = TABS.some(t => t.id === h) ? h : 'trening';
  if (ui.tab !== 'plany') ui.openItem = null;
  render(); scrollTo(0, 0);
}
addEventListener('hashchange', route);
ui.showWorkout = !!ACTIVE;
route();
initStore();
</script>
